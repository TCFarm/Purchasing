    + (LINES.filter(needsReorderReview).length
       ? `<span class="chip" id="revchip" aria-pressed="${REVW}"
            title="the smallest buy is more than the dating maths allows — these carry the evidence card">
            review before reorder<span class="n">${LINES.filter(needsReorderReview).length}</span></span>` : "")
    + `<span class="chip" id="chgchip" aria-pressed="${ONLYCH}">only what I changed<span class="n">${LINES.filter(touched).length}</span></span>`
    + `<span class="chip" id="newchip" aria-pressed="${NEWONLY}">not yet reviewed<span class="n">${LINES.filter(r=>!reviewed(r)).length}</span></span>`;
  document.querySelectorAll("#filters .chip[data-f]").forEach(x=>x.onclick=()=>{
    // ⛔ BUG 7 — "All" must clear the OTHER filters too. It used to leave the
    // risk filter on, so the chip read 118 while 7 lines rendered.
    FILTER=x.dataset.f;
    if(FILTER==="all"){ RISK=false; UNK=false; ONLYCH=false; NEWONLY=false;
                        LOSS=false; REVW=false; }
    render();});
  const rc=document.getElementById("riskchip");
  if(rc) rc.onclick=()=>{RISK=!RISK; render();};
  const lc=document.getElementById("losschip");
  if(lc) lc.onclick=()=>{LOSS=!LOSS; render();};
  const vc=document.getElementById("revchip");
  if(vc) vc.onclick=()=>{REVW=!REVW; render();};
  const uc=document.getElementById("unkchip");
  if(uc) uc.onclick=()=>{UNK=!UNK; render();};
  const cc=document.getElementById("chgchip");
  if(cc) cc.onclick=()=>{ONLYCH=!ONLYCH; render();};
  const nc=document.getElementById("newchip");
  if(nc) nc.onclick=()=>{NEWONLY=!NEWONLY; render();};
}
/* ⭐ wired ONCE, outside every repaint — same reason as the search box. */
(function wireSort(){
  const sel=document.getElementById("sort");
  if(!sel) return;
  sel.value=SORT;
  sel.onchange=()=>{SORT=sel.value; render();};
})();
/* ⭐ wired ONCE, outside every repaint */
(function wireSearch(){
  let t; const q=document.getElementById("q");
  if(!q) return;
  q.oninput=e=>{clearTimeout(t); t=setTimeout(()=>{Q=e.target.value.trim(); render();},170);};
})();
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const escAttr=esc;

/* ⛔⛔ A ROW BEING EDITED IS NEVER REMOVED FROM VIEW. Two reasons, and the second
   one crashes Safari outright:
   ⭐ It is disorienting on any browser — you nudge a quantity and the line you are
      working on vanishes from under the cursor, because lowering it took the row
      out of the dating-risk filter.
   ⛔ And in Safari it is fatal: removing the number input while its stepper is
      still live kills the WebContent process — *"This webpage was reloaded because
      a problem occurred"*. Deferring the re-render by a tick was not enough,
      because the pointer can still be down on the arrow when the DOM is rebuilt.
   ⭐ So the row STAYS until focus leaves it. `EDITING` is cleared on blur, and the
      next render drops the row normally. */
function visible(){
  const q=Q.toLowerCase();
  return LINES.filter(r=>{
    if(EDITING && r.sku===EDITING) return true;   // ⛔ never yank the row you are on
    if(FILTER!=="all" && r.source!==FILTER) return false;
    if(RISK){ const x=riskOf(r); if(x!=="⛔ over its life"&&x!=="⚠️ tight") return false; }
    if(UNK && riskOf(r)!=="unknown") return false;
    if(LOSS && !losesMoney(r)) return false;
    if(REVW && !needsReorderReview(r)) return false;
    if(ONLYCH && !touched(r)) return false;
    if(NEWONLY && reviewed(r)) return false;
    if(q && !((r.description||"").toLowerCase().includes(q)
           || (r.brand||"").toLowerCase().includes(q)
           || (r.sku||"").toLowerCase().includes(q)
           || String(r.upc||"").includes(q)
           // ⭐ the KeHE item number is what a buyer holds for an item we do not
           // carry — it is the only id such a line has besides its UPC.
           || String(r.kehe_item||"").toLowerCase().includes(q))) return false;
    return true;
  }).sort(sorter());
}
/* ⛔ The DEFAULT is the engine's own order and must stay a stable no-op — the
   `why` on each line refers to the sizing pass that produced it, and a reader
   comparing two lines is comparing that sequence. Every other sort is explicit.
   ⚠️ Sorting is applied INSIDE visible(), so the subtotal, the counts and the
   rendered list can never disagree about which lines are on screen. */
function sorter(){
  const RANK={"⛔ over its life":0,"⚠️ tight":1,"unknown":2,"basis":3,"ok":4};
  switch(SORT){
    /* ⭐ THE DEFAULT-WORTHY ONE: everything that needs a human, top of the page,
       worst first — and within a tier, by money at stake. */
    case "attention": return (a,b)=>attentionRank(a)-attentionRank(b)
                                    || (a.evidence&&b.evidence
                                        ? (+a.evidence.net_gp||0)-(+b.evidence.net_gp||0) : 0)
                                    || lineCost(b)-lineCost(a);
    case "cost":   return (a,b)=>lineCost(b)-lineCost(a);
    case "risk":   return (a,b)=>(RANK[riskOf(a)]??9)-(RANK[riskOf(b)]??9)
                                 || lineCost(b)-lineCost(a);
    /* ⛔ sort the number the row SHOWS. The strip displays position cover, so
       sorting on order-only cover ranked the list by an invisible figure. */
    case "cover":  return (a,b)=>(positionCoverOf(b)??-1)-(positionCoverOf(a)??-1);
    case "name":   return (a,b)=>String(a.description||a.sku)
                                   .localeCompare(String(b.description||b.sku));
    case "source": return (a,b)=>String(a.source||"").localeCompare(String(b.source||""))
                                 || lineCost(b)-lineCost(a);
    default:       return ()=>0;              // ⭐ Array.prototype.sort is stable
  }
}

/* ── one line ────────────────────────────────────────────────────────────── */
/* ⭐⭐ THE POSITION STRIP — the seven numbers a buyer needs to approve a line,
   in the SAME SEVEN PLACES on every row (Jack, 2026-09-06).
   ⛔ EVERY ONE OF THESE WAS ALREADY ON THE ROW, inside the `why` string behind a
   collapsed <details>. Data that requires a click is data the reviewer does not
   have while scanning 157 lines.
   ⛔ AN UNKNOWN IS RENDERED AS UNKNOWN, NEVER AS ZERO AND NEVER AS A FULL BAR.
   A SKU with no sales rate has no cover — that is an abstention, and drawing a
   confident bar for it would be the exact failure this whole engine keeps hitting
   (an absent signal read as a positive one). */
/* ⭐⭐ WHEN DOES THE ORDER WE ARE PLACING SELL OUT? (Jack, 2026-09-06: *"we are
   buying 24, but that should sell out by XYZ date? … if I adjust that to 55 when
   would it sell out by?"*) The live recalculation as the quantity changes IS the
   feature — a static date answers a question nobody asked.
   ⛔⛔ AN EARLIER VERSION OF THIS WAS WRONG TWICE, AND BOTH ERRORS MADE SAFE
   LINES LOOK DANGEROUS:
     1. it divided the WHOLE POSITION by the rate, which answers "when does
        everything run out", not "when does the order I am placing run out";
     2. it judged that date against the OLD stock's best-by. New units arrive
        fresh with their own dating — condemning them by the date on shelf stock
        failed lines that were perfectly fine.
   ⭐ THE MODEL, in the order things actually happen (FIFO):
     live_old  what we hold that will really sell before it dates. ⛔ THE ENGINE
               ALREADY COMPUTES THIS — `on_hand_effective`. Never re-derive it:
               a crude `rate x days_left` read 45 where the engine said 16 and
               falsely condemned a whole-milk line.
     start     live_old / rate weeks — when the NEW stock begins selling
     sellout   start + order_qty / rate weeks — when this order runs out
     deadline  the new units arrive after the delivery lag and must be GONE
               CUSTOMER_MIN_DAYS before their own best-by
   ⛔ NO RATE OR NO SHELF LIFE ⇒ NO VERDICT, and no rate at all ⇒ no date either.
   A large share of lines carry `no_dating_evidence`: that SKU has never been
   scanned, and inventing a deadline for it is worse than saying so. */
function sellThrough(r){
  const rate=+r.q75_wk||+r.mean_wk||0;
  const q=arrivingOf(r);        // ⛔ a case of 50 sells out on 50, not on 9
  if(!rate||q<=0) return null;
  const eff=r.on_hand_effective;
  if(eff==null||eff==="") return null;          // ⛔ unknown, not zero
  const start=Math.max(0,+eff)/rate*7;
  const sellout=start+q/rate*7;
  const sd=+r.shelf_days||0;
  const deadline=sd?(DELIVERY_LAG_DAYS+sd-CUSTOMER_MIN_DAYS):null;
  return {start, sellout, deadline,
          late: deadline!=null && sellout>deadline,
          over: deadline!=null ? sellout-deadline : null};
}
/* ⭐ Day 0 is the ORDER SUNDAY — the same origin the deadline is measured from
   (arrival = day DELIVERY_LAG_DAYS). ⛔ Built with the local-date constructor,
   never `new Date("2026-09-06")`, which parses as UTC and renders as the day
   before west of Greenwich. */
function dayZero(){
  const s=(ORDER&&ORDER.meta&&ORDER.meta.order_sunday)||WEEK||"";
  const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s));
  return m?new Date(+m[1],+m[2]-1,+m[3]):null;
}
function dayLabel(days){
  const z=dayZero(); if(!z) return null;
  const d=new Date(z.getTime());
  d.setDate(d.getDate()+Math.round(days));
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"})
    + (d.getFullYear()!==z.getFullYear()?" "+d.getFullYear():"");
}
/* ⛔ SAME PLACE ON EVERY ROW, including when it cannot be computed — a line that
   simply omits the sentence reads as a line with nothing to worry about. */
function sellLine(r){
  const st=sellThrough(r);
  if(!st){
    const why = qtyOf(r)<=0 ? "nothing on order"
      : (!(+r.q75_wk||+r.mean_wk)) ? "no sales rate for this item"
      : "no effective-stock reading";
    return `<div class="sell none">sell-through date unknown — ${esc(why)}</div>`;
  }
  const out=dayLabel(st.sellout), begin=dayLabel(st.start);
  if(!out) return `<div class="sell none">sell-through date unknown — the order
    week is not a date</div>`;
  const startBit = st.start>=1
    ? ` (starts selling ~${esc(begin)}, after the ${Math.round(st.start)}d of stock
        already on the floor)` : "";
  if(st.deadline==null)
    return `<div class="sell">sells out ~<b>${esc(out)}</b>${startBit}
      · <span class="mut">no shelf life on record, so nothing checks that against
      its dating</span></div>`;
  const by=dayLabel(st.deadline);
  return st.late
    ? `<div class="sell bad">sells out ~<b>${esc(out)}</b>${startBit}
       — ⛔ <b>${Math.round(st.over)} day(s) past</b> the ${esc(by)} it must be
       sold by (${r.shelf_days}d of life, less the ${CUSTOMER_MIN_DAYS}d a customer
       must receive)</div>`
    : `<div class="sell ok">sells out ~<b>${esc(out)}</b>${startBit}
       — within the ${esc(by)} it must be sold by</div>`;
}
/* ⭐⭐ THE REORDER-EVIDENCE CARD (ruling: Jack, 2026-09-08: *"the flag should have
   visuals of all of this avail data … make the visual very clear and consistent
   on each item so someone can glance and get a good idea of where each item
   stands without having to read a block of text"*).
   ⭐ FOUR VISUALS, SAME PLACE, SAME SCALE, EVERY ROW:
     1. NET GP — one number, red when negative. 13 of 58 flagged lines on the
        2026-09-06 order are NEGATIVE: Crème Fraîche sold 9 units for $9.70 of
        gross profit and expired 39 units costing $134 → -$124.46.
     2. THE FATE BAR — of everything that left the shelf, what SOLD (green) and
        what was BINNED (red). ⛔ Normalised to the ratio ON PURPOSE, because the
        ratio is the question; the absolute counts are printed beside it so a
        9-unit item cannot masquerade as a 90-unit one.
     3. THE SALES SPARKLINE — 26 weekly bars, so a dying item is visible as a
        shape rather than a sentence.
     4. Cover vs shelf life — already in `posStrip` above, unchanged.
   ⛔ `judgeable:false` MUST NOT RENDER AS A CLEAN RECORD. A SKU the expiry
   archive has never seen has no history, which is a different statement from
   "never dated out", and the card says so instead of drawing an all-green bar. */
/* ⭐⭐ THE TWO STATES WORTH JUMPING TO. Jack, 2026-09-08: *"where would i see
   this on the purchasing app? can we sort the page to show these at the top and
   other ones that prob need special attention at the top?"* — he could not find
   the card because it only renders on flagged rows, and nothing led him to one.
   ⛔ A view you have to scroll for is a view nobody uses. */
const losesMoney=r=>!!(r.evidence && (+r.evidence.net_gp||0)<0);
const needsReorderReview=r=>!!r.evidence;
/* ⭐ ONE ORDER FOR "NEEDS ATTENTION", used by the sort AND stated in the option
   label, so the list order is never a mystery. Losing money outranks everything:
   it is the only category settled by history rather than by a guess. */
function attentionRank(r){
  if(losesMoney(r)) return 0;                       // proven loss on its own record
  if(needsReorderReview(r)) return 1;               // the dating cap was overridden
  const x=riskOf(r);
  if(x==="⛔ over its life") return 2;
  if(x==="unknown") return 3;                       // ⛔ unknown is not safe
  if(x==="⚠️ tight") return 4;
  if(touched(r)) return 6;
  return 5;
}
/* ══ THE ALERT DASHBOARD ══════════════════════════════════════════════════
   ⛔⛔ RULING (Jack, 2026-09-08): *"these warnings are WAY too much text, we need
   a dashboard … otherwise none of it adds any value because it is just a giant
   wall of text anyone would skip over. If a dashboard, then they need to be
   interactive so they can click into or filter or DO something, not just warning
   flags."*
   ⛔ HE IS RIGHT AND THE PROOF IS IN THE PAYLOAD: of the ten alerts on the
   2026-09-06 order, TWO SAY THE SAME THING (the new-item pipeline count appears
   as its own alert and again as the list of UPCs) and TWO MORE ARE STALE (the
   on_order pin was lifted on 2026-09-08 but the payload predates it). A wall of
   prose hides duplication and staleness; a tile with a count cannot.
   ⭐ SEVERITY IS NOT GUESSED — the engine already encodes it in the leading
   glyph of every alert it writes (⛔ / ⚠️ / ⭐), which is a convention this
   project applies everywhere. Reading it is honest; inventing a keyword list
   would be the `packsize` title-parsing mistake again. */
const _SEV=[["⛔",0,"bad"],["⚠️",1,"warn"],["⏸",1,"warn"],
            ["🆕",2,"info"],["📝",2,"info"],["⭐",3,"ctx"]];
function alertSeverity(t){
  for(const [g,rank,cls] of _SEV) if(String(t).indexOf(g)>=0) return {rank,cls};
  return {rank:2,cls:"info"};
}
/* ⭐ A LABEL SHORT ENOUGH TO SCAN. First clause only, glyphs and counts stripped
   — the number goes in its own slot so the eye reads quantity before prose. */
function alertLabel(t){
  let x=String(t||"");
  for(const [g] of _SEV) x=x.split(g).join("");
  x=x.replace(/^\s*[\d,]+\s*/,"").split(/[—–:(]/)[0]
     .replace(/\s+/g," ").trim();
  return x.length>46?x.slice(0,44)+"…":x;
}
function alertCount(t){
  const m=String(t||"").match(/(\d[\d,]*)/);
  return m?m[1]:"";
}
/* ⛔ DEDUPE ON MEANING, NOT ON THE STRING. The two new-item alerts share no
   prefix but both are "N approved but not created" — so the signature is the
   label plus the count, which collapses them and would collapse any future
   restatement of the same fact. */
function alertTiles(){
  const raw=(ORDER&&ORDER.meta&&ORDER.meta.alerts)||[];
  const seen=new Map();
  raw.forEach(t=>{
    const lab=alertLabel(t), n=alertCount(t), sev=alertSeverity(t);
    const key=lab.toLowerCase().slice(0,26)+"|"+n;
    const cur=seen.get(key);
    /* keep the LONGER text of a duplicate pair — it is the one carrying the
       detail (the UPC list rather than the bare count) */
    if(!cur || String(t).length>String(cur.text).length)
      seen.set(key,{label:lab,count:n,text:String(t),sev,dupes:(cur?cur.dupes+1:0)});
    else cur.dupes++;
  });
  return [...seen.values()].sort((a,b)=>a.sev.rank-b.sev.rank);
}
/* ⭐ THE ROW-BACKED TILES — these are the interactive half. Each one KNOWS the
   filter it turns on, so clicking it changes the list rather than telling you to
   go and find something. ⛔ Counts come from the same predicates the chips use,
   so a tile can never disagree with the chip it activates. */
function rowTiles(){
  const t=[];
  const loss=LINES.filter(losesMoney).length;
  if(loss) t.push({n:loss,label:"lose money after binning",cls:"bad",
                   act:()=>{FILTER="all";RISK=UNK=ONLYCH=NEWONLY=REVW=false;LOSS=true;},
                   why:"gross profit on what sold, minus the cost of what was thrown away"});
  const rev=LINES.filter(needsReorderReview).length;
  if(rev) t.push({n:rev,label:"review before reorder",cls:"warn",
                  act:()=>{FILTER="all";RISK=UNK=ONLYCH=NEWONLY=LOSS=false;REVW=true;},
                  why:"the smallest buy is more than the dating maths allows"});
  const risky=LINES.filter(r=>riskOf(r)==="⛔ over its life").length;
  if(risky) t.push({n:risky,label:"order past their shelf life",cls:"bad",
                    act:()=>{FILTER="all";UNK=ONLYCH=NEWONLY=LOSS=REVW=false;RISK=true;},
                    why:"the pattern that dated out milk — cut the quantity and this drops"});
  const unk=LINES.filter(r=>riskOf(r)==="unknown").length;
  if(unk) t.push({n:unk,label:"no dating information",cls:"warn",
                  act:()=>{FILTER="all";RISK=ONLYCH=NEWONLY=LOSS=REVW=false;UNK=true;},
                  why:"⛔ unknown is not the same as safe"});
  const added=LINES.filter(r=>r.added&&stateOf(r)!=="remove"&&qtyOf(r)>0);
  /* ⛔⛔ `FILTER` MATCHES `r.source`, AND THE SOURCE VALUES ARE PROSE. I wrote
     `FILTER="added_by_hand"` here; the real values are `reorder (velocity)`,
     `on promo`, `added by hand` … so the tile matched NOTHING and the page said
     "nothing matches" under a tile reading 48. Jack hit it on the first click.
     ⭐ `ADDED_SOURCE` is declared at the top of this file and is what the add
     path assigns, so using it makes the tile and the rows impossible to drift
     apart — the same fix pattern as `positionCoverOf` being one definition. */
  if(added.length) t.push({n:added.length,label:"added by hand",cls:"info",
                    on:FILTER===ADDED_SOURCE,
                    act:()=>{FILTER=ADDED_SOURCE;RISK=UNK=ONLYCH=NEWONLY=LOSS=REVW=false;},
                    why:money0(added.reduce((n,r)=>n+lineCost(r),0))+" at cost the engine did not propose"});
  const nc=added.filter(r=>r.notCarried);
  if(nc.length) t.push({n:nc.length,label:"items we do NOT carry",cls:"bad",
                    act:null,
                    why:"no history, no on-hand, no dating — nothing here checked the quantity"});
  const nrev=LINES.filter(r=>!reviewed(r)).length;
  if(nrev) t.push({n:nrev,label:"not yet looked at",cls:"info",
                   act:()=>{FILTER="all";RISK=UNK=ONLYCH=LOSS=REVW=false;NEWONLY=true;},
                   why:"a tick is a read marker, not an approval — untouched lines still ship"});
  return t;
}
/* ⛔⛔ THE TILE LIST MUST OUTLIVE THE RENDER. The markup can only carry an index,
   so the `act` closures are kept here for the click handler to reach.
   ⛔ THIS DECLARATION WAS LOST ONCE ALREADY: the edit that added it ran in the
   same script as a later edit that failed its own assertion, so the whole file
   write was abandoned while the click handler — added separately — went in and
   READ it. The result compiled, passed the build's syntax check, and would have
   thrown ReferenceError on the first tile click. ⭐ `jsc` parsing a file proves
   nothing about a name that is only referenced inside a handler. */
let _TILES=[];
/* ⛔⛔ EVERY TILE MUST SELECT ITS OWN ROWS. The `added by hand` tile shipped
   pointing `FILTER` at a string no row carries, so it read 48 and showed 0 —
   Jack hit it on the first click. A count and its filter can only be trusted if
   something checks they agree, so this DOES check, on every render, and says so
   in the console rather than letting a tile lie silently.
   ⭐ Cheap: it runs each tile's action against a copy of the flag state and puts
   it straight back. ⛔ Never let it change what the user is looking at. */
function _auditTiles(rt){
  const snap=[FILTER,RISK,UNK,ONLYCH,NEWONLY,LOSS,REVW];
  const bad=[];
  rt.forEach(t=>{
    if(!t.act) return;
    try{ t.act(); if(visible().length===0 && t.n>0) bad.push(`${t.label} (${t.n})`); }
    catch(e){ bad.push(`${t.label} threw ${e&&e.name}`); }
  });
  [FILTER,RISK,UNK,ONLYCH,NEWONLY,LOSS,REVW]=snap;
  if(bad.length) console.warn("⛔ tile(s) whose filter matches NO rows: "+bad.join(", "));
  return bad;
}
function dashboard(){
  const rt=rowTiles(), at=alertTiles();
  _TILES=rt;
  _auditTiles(rt);
  const tile=(t,i)=>`<button class="tile ${t.cls}" data-tile="${i}"
      ${t.act?'':'disabled'} title="${escAttr(t.why||"")}">
      <b>${t.n}</b><s>${esc(t.label)}</s></button>`;
  const al=at.map((a,i)=>`<details class="alrt ${a.sev.cls}">
      <summary><b>${a.count||"•"}</b> ${esc(a.label)}${a.dupes?` <i>(said ${a.dupes+1}x)</i>`:""}</summary>
      <div>${esc(flat(a.text,600))}</div></details>`).join("");
  return `<div class="dash">
    <div class="tiles">${rt.map(tile).join("")}</div>
    ${at.length?`<details class="alrtwrap"><summary>${at.length} note(s) from the
      engine — nothing to click, open if you want the detail</summary>
      <div class="alrts">${al}</div></details>`:""}
  </div>`;
}
function evidenceCard(r){
  const e=r.evidence; if(!e) return "";
  const sold=+e.sold_units||0, exp=+e.expired_units||0, tot=sold+exp;
  const net=+e.net_gp||0, bad=net<0;
  const pct=v=>tot?(v/tot*100).toFixed(1):0;
  const money=v=>(v<0?"-$":"$")+Math.abs(v).toFixed(2);
  /* the sparkline: 26 weeks, one bar each, scaled to the row's own peak */
  const ser=Array.isArray(e.weekly_series)?e.weekly_series:[];
  const peak=Math.max(1,...ser.map(x=>+x||0));
  const spark=ser.map(v=>{
    const h=Math.max(1,Math.round((+v||0)/peak*100));
    return `<i style="height:${h}%" title="${(+v||0)} unit(s)"></i>`;}).join("");
  const fate = !e.judgeable
    ? `<div class="fate none">⛔ never seen in the expiry archive — no dating-out
         history exists for it, which is NOT the same as never dating out</div>`
    : tot===0
      ? `<div class="fate none">nothing sold and nothing binned in 26 weeks</div>`
      : `<div class="fate"><div class="fatebar">
           <i class="sold" style="width:${pct(sold)}%"></i>
           <i class="binned" style="width:${pct(exp)}%"></i>
         </div><span class="fatelab">
           <b>${sold.toFixed(0)}</b> sold · <b class="bn">${exp.toFixed(0)}</b> binned
           ${exp>0?`· <b class="bn">${(e.waste_share*100).toFixed(0)}% wasted</b>`:""}
           ${e.expired_events?`· ${e.expired_events} expiry event(s)`:""}
         </span></div>`;
  return `<div class="evid ${bad?"bad":""}">
    <div class="evidnum">
      <b class="${bad?"neg":"pos"}">${money(net)}</b>
      <s>net gross profit, 26wk</s>
      <span class="sub">${money(e.gp_on_sold||0)} earned − ${money(e.shrink_cost||0)} binned
        ${e.net_margin!=null?` · ${(e.net_margin*100).toFixed(0)}% net margin`:""}</span>
    </div>
    ${fate}
    <div class="spark" title="units sold per week, last 26 weeks">${spark}
      <s>${e.weeks_with_a_sale||0} of ${ser.length} weeks had a sale</s></div>
  </div>`;
}
function posStrip(r){
  const rate = +r.q75_wk || +r.mean_wk || 0;
  const oh   = +r.on_hand || 0, inb = +r.inbound || 0, bk = +r.pre_window || 0;
  const pk = packOf(r);
  const addQ = pk.units, have = oh + inb;   // ⛔ units that ARRIVE — see arrivingOf
  const lifeW = r.shelf_days ? (+r.shelf_days)/7 : null;
  const haveW = rate ? have/rate : null;
  const addW  = rate ? addQ/rate : null;
  // ⭐ one definition — see positionCoverOf. Never recompute this here.
  const totW  = positionCoverOf(r);
  const cell=(v,lbl,cls)=>`<div class="${cls||""}"><b>${v}</b><s>${lbl}</s></div>`;
  const n=v=>Number.isInteger(v)?String(v):String(Math.round(v*10)/10);

  let bar;
  if(totW==null){
    // no rate ⇒ no cover. Say so; do not draw a bar that implies a measurement.
    bar = `<div class="cov"><div class="covtrack"></div>
      <span class="covnote none">no sales rate — cover cannot be computed</span></div>`;
  }else{
    const ceil  = lifeW || 0;
    const scale = Math.max(totW, ceil) || 1;
    const s1 = Math.min(haveW, ceil||totW);
    const s2 = Math.max(0, Math.min(totW, ceil||totW) - s1);
    const s3 = ceil ? Math.max(0, totW - ceil) : 0;
    const pct = w => (w/scale*100).toFixed(1);
    /* ⛔ SAY WHICH COVER THIS IS. The risk chip beside it measures the ORDER
       alone (`coverOf`), this bar measures the POSITION we would hold — stock +
       inbound + order. On a slow mover with deep stock those differ by weeks, so
       an unqualified "cover" on both would read as the page contradicting
       itself. Measured 2026-09-06: 17 lines where the two verdicts disagree,
       every one of them the chip being the QUIETER of the two. */
    const note = !ceil ? `${n(totW)}w on hand+order · life unknown`
      : s3 > 0.05 ? `${n(totW)}w on hand+order vs ${n(ceil)}w of life — ${n(s3)}w past it`
      : `${n(totW)}w on hand+order within ${n(ceil)}w of life`;
    bar = `<div class="cov"><div class="covtrack">
        <i class="have" style="left:0;width:${pct(s1)}%"></i>
        <i class="add"  style="left:${pct(s1)}%;width:${pct(s2)}%"></i>
        ${s3>0?`<i class="over" style="left:${pct(ceil)}%;width:${pct(s3)}%"></i>`:""}
        ${ceil?`<u style="left:${pct(ceil)}%" title="what the dating allows"></u>`:""}
      </div><span class="covnote ${s3>0.05?"bad":""}">${esc(note)}</span></div>`;
  }
  /* ⛔⛔ A MISSING FIGURE IS NOT A ZERO. `+r.on_hand||0` renders an item we hold
     no Finale record for as "0 on hand" — a confident measurement of nothing,
     and the strongest possible argument for buying it. ⭐ For a SKU we carry, 0
     IS the measurement and still prints as 0; only absent prints as "—". Found
     driving the real page after the first catalogue line was added, 2026-09-06. */
  const nn=(raw,v)=>(raw==null||raw==="")?"—":n(v);
  const zz=raw=>(raw==null||raw==="")?"z":"";
  return `<div class="pos">
    ${cell(nn(r.on_hand,oh),   "on hand", oh?zz(r.on_hand):"z")}
    ${cell(nn(r.inbound,inb),  "inbound", inb?zz(r.inbound):"z")}
    ${cell(nn(r.pre_window,bk),"booked",  bk?zz(r.pre_window):"z")}
    ${cell(rate?n(rate):"—", "sells/wk", rate?"":"z")}
    ${cell(pk.per>1
        /* ⭐ SAY THE PACK WHERE THE NUMBER IS. A bare "1" in this column cannot be
           told from one popcorn bag, and the row's own header already reads
           "1 case (20 units)" — the strip must not disagree with it. */
        ? `<span data-posqty>${n(pk.cases)}</span> <em>case${pk.cases===1?"":"s"} (${n(pk.units)} units)</em>`
        : `<span data-posqty>${n(addQ)}</span>`, "ordering", addQ?"add":"z")}
    ${cell(totW==null?"—":n(totW)+"w", "total cover", totW==null?"z":(lifeW&&totW>lifeW?"hot":""))}
    ${cell(r.shelf_days?r.shelf_days+"d":"—", "shelf life", r.shelf_days?"":"z")}
  </div>${bar}${sellLine(r)}`;
}
/* ⭐ Cover and shelf life live in the fixed strip below the name, not in the
   prose line — same seven columns on every row. There is no `data-cover` span
   any more; applyQty repaints the whole strip instead.
   ⛔⛔ AND A HARD RULE LEARNED THE EXPENSIVE WAY (2026-09-06): the note above
   used to sit INSIDE this function's returned template literal, as an HTML
   comment, written with backticks around the identifiers. A BACKTICK INSIDE A
   TEMPLATE LITERAL CLOSES IT — so the rest of the markup was parsed as
   JavaScript and the whole file died on `SyntaxError: Unexpected identifier
   'data'`. Nothing rendered; the page was a blank shell. ⛔ NEVER put a comment
   inside a template literal here: JS comments go ABOVE the return, where a
   backtick is harmless and where they cost no bytes in 265 rows of markup.
   ⭐ The tags below say WHAT a line is in WORDS, never only in a colour: "the
   engine never proposed this" (added by hand, green rail) and "someone edited
   the engine's number" (changed, accent rail) are different facts and must not
   share one cue.
   ⭐ `added_by_hand` is filtered out of the three displayed engine flags — the
   ADDED BY HAND tag already says it, and spending a slot repeating it hides an
   engine flag the buyer has not seen. It stays in `r.flags`, so it is still what
   gets SAVED with the decision. */
function lineHtml(r){
  const st=stateOf(r), q=qtyOf(r), c=unitCost(r);
  const changed=touched(r), rk=riskOf(r);
  const inc=incOf(r);
  const note=(EDIT[r.sku]||{}).note ?? (SAVED[r.sku]||{}).reviewer_note ?? "";
  const rs=reviewState(r);
  return `<div class="line ${changed?"changed":""} ${r.added?"added":""} ${
      r.notCarried?"notcarried":""} ${st==="remove"?"removed":""}${
      rs==="new"?" unreviewed":""}" data-sku="${escAttr(r.sku)}">
    <div>
      <div class="nm">${rs==="new"?`<span title="you have not looked at this line yet"
        style="color:var(--ink3)">○</span> `:`<span title="reviewed"
        style="color:var(--good)">●</span> `}${esc(r.description||r.sku)}</div>
      <div class="meta">${esc(r.brand||"")} · ${esc(r.sku)}
        ${r.upc?`· <span title="UPC">UPC ${esc(r.upc)}</span>`:""}
        · ${money(c)}/unit → <b data-linecost>${money(q*c)}</b>
        · ordering <b data-unitlabel>${unitLabel(r)}</b>
        · buys in <b>${buyInLabel(r)}</b></div>
      <div data-pos>${posStrip(r)}</div>
      ${evidenceCard(r)}
      <div class="tags">
        <span class="tag src">${esc(r.source)}</span>
        <span class="tag ${rk==="⛔ over its life"?"bad":rk==="⚠️ tight"?"warn":""}"
              data-risk ${rk==="ok"||rk==="basis"?'style="display:none"':""}
              >${rk==="ok"||rk==="basis"?"":esc(rk)}</span>
        ${rk==="basis"?`<span class="tag" title="its quantity was sized on something
          other than the shelf sales rate, so cover-vs-life does not apply">sized on a
          different basis</span>`:""}
        ${inc>1?`<span class="tag">orders in ${inc}s</span>`:""}
        ${perOrderUnit(r)>1?`<span class="tag warn" title="${escAttr(r.order_unit_basis||'')}"
          >BULK — one case is ${perOrderUnit(r)} sellable units</span>`:""}
        ${(EDIT[r.sku]||{}).order_unit||(SAVED[r.sku]||{}).order_unit_override
          ?`<span class="tag warn">ordering unit corrected by hand</span>`:""}
        ${(r.flags||[]).filter(f=>f!=="added_by_hand").slice(0,3)
             .map(f=>`<span class="tag">${esc(f)}</span>`).join("")}
        ${r.added?`<span class="tag add" title="the engine did not propose this line
          — a reviewer put it on the order">ADDED BY HAND</span>`:""}
        ${r.notCarried?`<span class="tag nc" title="we hold no Finale product for this
          item: it can be ordered from KeHE, but the PO cannot be imported into Finale
          until ProductPipeline creates it">⚠️ NOT CARRIED — KeHE item ${
          esc(r.kehe_item||"?")}</span>`:""}
        ${r.partial?`<span class="tag bad" title="only the fields stored with the
          decision are known — the sales rate and shelf life are not">partial record</span>`:""}
        ${r.added&&!r.kehe_item&&!r.partial?`<span class="tag bad" title="finalize
          needs a KeHE item number to put a line on the PO">⛔ no KeHE item number</span>`:""}
        ${changed&&st!=="remove"&&!r.added?`<span class="tag warn">changed from ${r.order_qty}</span>`:""}
        ${st==="remove"?`<span class="tag bad">removed</span>`:""}
        ${r.prior_edit?`<span class="tag warn">someone already changed this from the
          engine's ${r.engine_qty}</span>`:""}
      </div>
      ${r.explain?`<div class="explain">${esc(r.explain)}</div>`:""}
      ${r.why?`<details class="why"><summary>the engine's own working</summary>
        <div>${esc(r.why)}</div></details>`:""}
      ${changed?`<div class="reasons" style="margin-top:7px;display:flex;flex-wrap:wrap;gap:5px">
         <span class="mut small" style="align-self:center">why?</span>
         ${REASONS.map(([k,lbl])=>`<span class="chip rsn${reasonsOf(r).includes(k)?" on":""}"
            data-rsn="${escAttr(r.sku)}|${k}" role="button" tabindex="0"
            aria-pressed="${reasonsOf(r).includes(k)}">${esc(lbl)}</span>`).join("")}
       </div>`:""}
      ${changed?`<input class="note" data-n="${escAttr(r.sku)}" value="${escAttr(note)}"
         placeholder="why did you change it? (this is the signal that improves the model)"
         style="margin-top:6px;width:100%;max-width:520px;border:1px solid var(--line);
                border-radius:7px;padding:5px 9px;background:var(--card);color:var(--ink);
                font:inherit;font-size:12.5px">`:""}
    </div>
    <div class="acts">
      <input type="number" min="0" step="${inc}" value="${q}" data-q="${escAttr(r.sku)}"
             aria-label="quantity" ${st==="remove"?"disabled":""}>
      <button class="mini unit" data-unit="${escAttr(r.sku)}"
              title="${unitOf(r)==='case'
                ? 'We are ordering CASES and breaking them down. Click if that is wrong and this is sold as it comes.'
                : 'We are ordering EACHES. Click if this is really a case we break down and sell individually.'}"
              >${unitOf(r)==='case'?'case':'each'}</button>
      <button class="mini ok ${rs!=="new"?"on":""}" data-ok="${escAttr(r.sku)}"
              title="${rs==="new"?"mark this line reviewed — the quantity stays as it is"
                                 :"un-mark it as reviewed"}">✓</button>
      <button class="mini rm ${st==="remove"?"on":""}" data-rm="${escAttr(r.sku)}"
              title="remove this line">✕</button>
    </div>
  </div>`;
}

function render(){
  paintFilters();
  const v=visible(), m=document.getElementById("main");
  let head="";
  /* ⛔⛔ THE FILE AND ITS CONTENTS MUST AGREE ABOUT WHICH WEEK THIS IS. The picker
     keys off the FILENAME; every decision is saved against `meta.order_sunday` and
     `purchase_drain.py` reads that. If they ever diverge, a reviewer would pick
     "2026-09-13" and write decisions onto another week, and no single screen would
     show the contradiction. This one does. */
  if(ORDER.meta&&WEEK!=null&&String(ORDER.meta.order_sunday||"")!==String(WEEK))
    head+=`<div class="banner bad">⛔ <b>This file is not the week it is named after.</b>
      <code>order_${esc(WEEK)}.json</code> declares order week
      <b>${esc(ORDER.meta.order_sunday)}</b> inside it, and that is the week your
      decisions are saved against — it is what <code>purchase_drain.py</code> reads.
      Do not review this until whoever published it has looked.</div>`;
  /* ⛔⛔ BUG 10 — THE ENGINE'S OWN ALERTS WERE DROPPED. Two of them are decisions
     this page exists to capture: "the smallest purchase possible is months of
     stock — buy it or cut the item", and "1,328 units are on a prior order Finale
     cannot see — if it was never placed, these under-order". The second changes
     how you read every quantity on the page. */
  /* ⛔⛔ THE PROSE BANNERS ARE GONE — see `dashboard()`. Ten alerts plus five
     banners rendered ~1,400 words above the first row, and Jack skipped all of
     it, correctly: *"just a giant wall of text anyone would skip over"*. Every
     count that had a matching filter is now a BUTTON that applies it. */
  head += dashboard();
  /* ⛔ THE `basis`, ADDED-BY-HAND AND NOT-CARRIED BANNERS ARE TILES NOW. Each
     was a paragraph restating a number the dashboard shows in one glance, and
     two of them told the reader to go and find rows the tile now filters to
     directly. ⭐ `ADD_NOTE` stays as prose: it is not a count, it is a specific
     failure on specific lines and there is nothing to click. */
  if(ADD_NOTE) head+=`<div class="banner bad">${ADD_NOTE}</div>`;
  const added=LINES.filter(r=>r.added);
  head+=`<div class="banner">Showing <b>${v.length}</b> of ${LINES.length} line(s) on this
    order for the <b>week of ${esc(ORDER.meta.order_sunday)}</b> —
    ${ORDER.meta.lines_buying} proposed by the engine
    from ${ORDER.meta.lines_considered.toLocaleString()} considered${
      added.length?`, plus ${added.length} added by hand`:""}.
    <span class="mut">Not ordered: ${Object.entries(
      /* ⛔ `nr` WAS DECLARED IN THE PROSE BLOCK THIS DASHBOARD REPLACED. Deleting
         that block left this reference dangling — a ReferenceError inside
         `render()`, so the page would have gone BLANK on load. `jsc` parsed the
         file happily and the build's syntax gate passed it; only running
         `render()` over real rows found it. ⭐ Read it from `meta` where it
         belongs, so it cannot depend on a banner existing. */
      (ORDER.meta.not_ordered_by_reason)||{}).slice(0,4)
      .map(([k,n])=>`${esc(k)} ${n}`).join(" · ")}.</span></div>`;
  m.innerHTML=head+(v.length?v.map(lineHtml).join(""):`<div class="center">nothing matches</div>`);
  paintTotals();
}

/* ⭐ The candidate's own increment, cost and pack — read through the SAME helpers

function candMatch(c,q,key){
  if(!q) return true;

     item number for something we DO stock matched nothing here and the catalogue
     section then offered it as "not carried" — which is false, and acting on it
     would create a second, unimportable line for a SKU we already have. ⭐ Both
     sides are normalised, because the price file pads the item number and the
     catalogue stores it stripped. */
  if(key && (codeKey(c.upc)===key || codeKey(c.kehe_item)===key)) return true;
  return (c.description||"").toLowerCase().includes(q)
      || (c.brand||"").toLowerCase().includes(q)

/* ⭐ ONE CARD FOR AN ITEM WE DO NOT CARRY. ⛔ It shows only what the price file

/* ⛔⛔ AN ITEM WE ALREADY CARRY CAN APPEAR IN THE "NOT CARRIED" CATALOGUE, AND

/* ⭐⭐ THE CATALOGUE HALF OF THE PANEL. ⛔ It is loaded LAZILY and only when it is
   actually wanted — 2.4 MB must never be pulled during ordinary review — so this
   returns markup for whatever state it is in, and kicks the fetch off when it
   should. ⛔ A LOADING STATE IS MANDATORY: on a slow link this is a visible wait,
   and a panel that says "nothing matches" while a fetch is in flight tells the
   buyer an item does not exist when we simply have not looked yet. */
function catSection(term, key, candHits){
  /* ⭐ WHEN TO REACH FOR IT: the user typed something that looks like an item
     number or a UPC (they are asking about THAT item, whatever the descriptions
     matched), or nothing among the SKUs we carry matched at all. */
  const want = !!term && (looksLikeCode(term) || candHits===0);
  if(!want) return "";
  const week=(ORDER&&ORDER.meta&&ORDER.meta.order_sunday)||WEEK;
  if(!week) return "";
  const LOADING=`<div class="catsec"><div class="center">searching the full KeHE
      catalogue (2.4 MB, first search only)…</div></div>`;
  /* ⛔⛔ THE STATES ARE TESTED ONE AT A TIME, IN ORDER, AND NOT AS ONE BOOLEAN.
     Written as `STATE!=="ready" && STATE!=="loading" || WEEK!==week` this read
     `(A&&B)||C`, so an ERRORED load took the first branch: it rendered the
     LOADING message, called loadCatalog again, got an instant `false` back from
     its own error guard, repainted — and sat there telling the buyer we were
     still searching, forever. ⛔ That is the "a failed load must not look like an
     empty shelf" rule this file already states once, in a new costume: the buyer
     must be told we could not look. Caught by driving the real page, 2026-09-06. */
  if(CAT_WEEK!==week || CAT_STATE==="idle"){
    /* ⛔ Fire and repaint when it lands. loadCatalog sets its state SYNCHRONOUSLY
       before its first await, so a burst of keystrokes cannot start a storm. */
    loadCatalog(week).then(()=>paintAdd());
    return LOADING;
  }
  if(CAT_STATE==="loading") return LOADING;
  if(CAT_STATE!=="ready")
    return `<div class="catsec"><div class="banner bad">⛔ <b>The items we do NOT
      carry could not be searched.</b><br>${esc(CAT_ERR||"unknown error")}
      <br><br>⛔ This is NOT "KeHE does not sell it" — we simply could not look.
      Everything else on the page is unaffected.</div></div>`;
  const hits=CAT_ROWS.filter(c=>catMatch(c,term,key));
  const shown=hits.slice(0,CAT_MAX);
  /* ⭐ Built ONCE per paint, not per card — carriedIndex() walks 2,200 rows. */
  const ix=carriedIndex();
  const dups=shown.filter(c=>carriedAs(c,ix)).length;
  return `<div class="catsec">
    <div class="banner">${hits.length
      ? `<b>${hits.length.toLocaleString()}</b> KeHE item(s) we do <b>not</b> carry
         match "${esc(ADDQ)}" (of ${CAT_ROWS.length.toLocaleString()} searched by
         item number, UPC, description and brand).`
      : `<b>No KeHE item we do not carry</b> matches "${esc(ADDQ)}" either —
         ${CAT_ROWS.length.toLocaleString()} searched by item number, UPC,
         description and brand.`}
      ⛔ These have <b>no Finale SKU and no history</b>: orderable from KeHE, but
      the PO cannot be imported into Finale until the product exists.
      ${dups?`<br>⛔ <b>${dups} of them we ALREADY carry</b> under a different item
        number — those cannot be added here, and say which SKU to use instead.`:""}</div>
    ${CAT_WARN?`<div class="banner bad">${esc(CAT_WARN)}</div>`:""}
    ${shown.map(c=>catCardHtml(c,ix)).join("")}
    ${hits.length>shown.length
      ? `<div class="candmore">${(hits.length-shown.length).toLocaleString()} more —
         search by the exact KeHE item number or UPC to land on one.</div>`:""}
  </div>`;
}
function paintAdd(){
  const wrap=document.getElementById("addwrap");
  /* ⛔ Nothing to paint while it is closed — and `idle` would otherwise render
     the failure banner ("unknown error") for a panel that has simply never been
     opened. Callers repaint it freely after an edit; this is the guard. */
  if(!wrap||wrap.hidden) return;
  const box=document.getElementById("addbody"),
        sub=document.getElementById("addsub"),
        q=document.getElementById("addq");
  if(!box) return;
  if(CAND_STATE==="loading"){
    if(q) q.disabled=true;
    if(sub) sub.textContent="";
    box.innerHTML=`<div class="center">loading the items the engine considered…</div>`;
    return;
  }
  /* ⛔⛔ A FAILED LOAD MUST NOT LOOK LIKE AN EMPTY SHELF. A search box over zero
     rows answers "there is nothing you can add", which is false, and a buyer has
     no way to tell the two apart. So the box is DISABLED and the reason — with
     the command that fixes it — is what fills the panel. */
  if(CAND_STATE!=="ready"){
    if(q){ q.disabled=true; q.value=""; }
    if(sub) sub.textContent="";
    box.innerHTML=`<div class="banner bad">⛔ <b>The list of addable items could not
      be loaded, so nothing can be added right now.</b><br>${esc(CAND_ERR||"unknown error")}
      <br><br>⛔ This is NOT "there is nothing to add" — the engine considered
      ${ORDER&&ORDER.meta?Number(ORDER.meta.lines_considered||0).toLocaleString():"thousands of"}
      SKUs for this week. Everything else on the page is unaffected.</div>`;
    return;
  }
  if(q) q.disabled=false;
  const all=(CAND&&CAND.rows)||[];
  const term=ADDQ.trim().toLowerCase();
  /* ⭐ Computed ONCE and passed down: an item number or UPC, stripped of padding
     and punctuation, or "" when what was typed is not a code. */

  let hits=all.filter(c=>candMatch(c,term,key));
  /* ⭐ WITH NO SEARCH TERM, SHOW THE FASTEST SELLERS THE ENGINE DECLINED rather
     than nothing. A blank panel reads as an empty pool; this is both a real
     answer to "what am I missing?" and proof the list loaded. */
  let headline="";
  if(!term){
    hits=all.filter(c=>(+c.q75_wk||+c.mean_wk||0)>0)
            .sort((a,b)=>((+b.q75_wk||+b.mean_wk||0)-(+a.q75_wk||+a.mean_wk||0)));
    headline=`Showing the fastest-selling items the engine did <b>not</b> buy this
      week. Type above to search all ${all.length.toLocaleString()}.`;

  if(sub) sub.textContent=`${all.length.toLocaleString()} SKUs the engine `
    +`considered and did not buy · week of ${(ORDER&&ORDER.meta&&ORDER.meta.order_sunday)||WEEK}`;
  box.innerHTML=
     (CAND_WARN?`<div class="banner bad">${esc(CAND_WARN)}</div>`:"")
   + `<div class="banner">${headline||`<b>${hits.length.toLocaleString()}</b> match
       "${esc(ADDQ)}".`}
       ⛔ Adding a line records a DECISION — it orders nothing. Quantities round
       <b>up</b> to what KeHE will ship. ⭐ Type a <b>KeHE item number</b> or a
       <b>UPC</b> to search the whole KeHE catalogue, including items we do not
       carry.</div>`
   + (shown.length?shown.map(candHtml).join("")
                  :(term?`<div class="center">nothing we carry matches
                          "${esc(ADDQ)}"</div>`:""))
   + (hits.length>shown.length
      ? `<div class="candmore">${(hits.length-shown.length).toLocaleString()} more —
         narrow the search to see them.</div>` : "")
   /* ⭐⭐ THE ITEMS WE DO NOT CARRY, in their own section BELOW the carried ones —
      the carried pool is always the better answer when it has one, and mixing the
      two would put a line with no history beside one with three years of it under
      the same heading. ⛔ Lazily fetched: see catSection(). */
   + catSection(term, key, hits.length);
}
/* ⭐ PUT THE LINE ON THE ORDER. ⛔ The quantity rounds UP to the order increment,
   never to nearest: `Math.round(1/12)*12` is 0, and adding a line at zero is a
   REMOVAL wearing an add's clothes. ⛔ And the increment is `unit_of_sale`,
   never `casepack` — see incOf(). */
function addSku(sku, want){
  /* ⭐ TWO POOLS, ONE ADD PATH. A candidate is a SKU the order sheet already
     carries; a catalogue item is one we do not carry at all. They differ in what
     is KNOWN about them, not in how the decision is recorded — so everything
     downstream (EDIT, Save, the unsaved guard, the totals) sees one shape. */
  const cat=CAT_BY[String(sku)];
  const c=cat?null:CAND_BY[String(sku)];
  if(!c&&!cat) return {ok:false, msg:`⛔ ${sku} is not in this week's candidate list`};
  if(LINES.some(x=>String(x.sku)===String(sku)))
    return {ok:false, msg:`⛔ ${sku} is already on the order`};
  /* ⛔⛔ THE GUARD IS HERE TOO, NOT ONLY IN THE MARKUP. The card that renders a
     duplicate has no Add button, but a click can still arrive from a card painted
     before the pool changed — and the cost of getting this wrong is a second,
     unimportable line for a product we already stock. */
  if(cat){
    const dup=carriedAs(cat, carriedIndex());
    if(dup) return {ok:false, msg:`⛔ we already carry this — it is `
      +`${esc(dup.description||dup.sku)} (SKU ${esc(dup.sku)}). Change THAT line's `
      +`quantity instead; adding it here would be a duplicate with no Finale SKU.`};
  }
  const r=cat?rowFromCatalog(cat):rowFromCandidate(c), inc=incOf(r);
  let v=Number(want);
  if(!Number.isFinite(v)||v<=0) v=inc;
  v=Math.max(inc, Math.ceil(v/inc)*inc);
  LINES.push(r);
  /* ⭐ The quantity lives in EDIT exactly like any other human change, so Save,
     the unsaved-work guard and the totals all pick it up with no special case. */
  EDIT[String(sku)]={qty:v};
  return {ok:true, qty:v, row:r,
          msg:`✓ added ${esc(r.description||sku)} — ${v} unit(s). `
             +(r.notCarried
               ? `⚠️ We do NOT carry this — no sales history, no on-hand, no `
                +`dating, so nothing here checks the quantity. It will go on the `
                +`KeHE order; the PO cannot be imported into Finale until the `
                +`product exists. `
               : "")
             +`⛔ nothing is saved until you press Save.`};
}
(function wireAdd(){

document.addEventListener("click",e=>{

  e.stopPropagation();
  const sku=b.dataset.add;
  const box=document.querySelector(`input[data-addq="${CSS.escape(sku)}"]`);
  const res=addSku(sku, box?box.value:null);
  const st=document.getElementById("status");
  if(st) st.innerHTML=res.msg;
  if(!res.ok) return;
  /* ⭐ The panel stays OPEN — a reviewer working from Julia's sheet is adding
     several, and closing after each one would make them re-search every time.
     Both surfaces repaint so the row appears behind the panel and the candidate
     flips to "✓ on the order". */
  paintAdd(); render();
},true);

/* ── edits ───────────────────────────────────────────────────────────────── */
/* ⛔⛔ BUG 2 — THE SNAP MUST BE VISIBLE. It used to change the stored value while
   leaving the box showing what was typed: type 18 on an "orders in 12s" line and
   the screen said 18 while 24 was saved. ⛔ BUG 3 — and when the snapped value
   equalled the engine's, the edit was DELETED, so the buyer saw their number,
   no "changed" tag, and a disabled Save: the change silently never happened.
   ⭐ Now: snap on COMMIT (blur/enter), write the snapped value back into the box,
   and always keep the edit so the intent is recorded. */
function applyQty(i, commit){
  const sku=i.dataset.q, r=LINES.find(x=>x.sku===sku); if(!r) return;
  const inc=incOf(r);
  let v=Number(i.value);
  if(!Number.isFinite(v)||v<0) v=0;
  if(commit){
    v=Math.round(v/inc)*inc;
    if(String(v)!==i.value) i.value=v;          // ⭐ show what will actually be ordered
  }
  EDIT[sku]={...(EDIT[sku]||{}), qty:v, decision:null};
  const el=i.closest(".line");
  if(el){
    el.classList.toggle("changed", touched(r));
    el.classList.toggle("removed", v<=0);
    /* ⛔ the review rail and pip are part of the row's state too — left out, an
       edited line kept its "you have not looked at this" rail for as long as the
       page went without a full render (found 2026-09-05 driving the page). */
    el.classList.toggle("unreviewed", reviewState(r)==="new");
    const pip=el.querySelector(".nm span");
    if(pip){ const nw=reviewState(r)==="new";
             pip.textContent=nw?"○":"●";
             pip.style.color=nw?"var(--ink3)":"var(--good)"; }
    const c=el.querySelector("[data-linecost]");
    /* ⛔ BUG 4 — live extended cost. ⛔ `v` is the box, in OUR units; on a bulk
       line the money follows the CASE, so this reads the same lineCost the
       totals and the order file do. */
    if(c) c.textContent=money(lineCost(r));
    // ⛔ the ordering-unit label moves with the quantity: 2 units of chia and 60
    // units of chia are both "1 case" and "2 cases" respectively.
    const ul=el.querySelector("[data-unitlabel]");
    if(ul) ul.innerHTML=unitLabel(r);
    /* ⛔ THE STRIP MUST MOVE WITH THE QUANTITY. It shows "ordering" and "cover",
       both of which change on every keystroke — a strip left stale would be a
       confidently-wrong number sitting in the buyer's primary read. It holds no
       focusable input, so a full repaint here is safe mid-edit. */
    const ps=el.querySelector("[data-pos]");
    if(ps) ps.innerHTML=posStrip(r);
    const rk=riskOf(r);
    const t=el.querySelector("[data-risk]");
    if(t){ t.textContent=rk==="ok"||rk==="basis"?"":rk;
           t.className="tag "+(rk==="⛔ over its life"?"bad":rk==="⚠️ tight"?"warn":"");
           t.style.display=rk==="ok"||rk==="basis"?"none":""; }
    // ⛔ BUG 9 — say something when a quantity is absurd. Nothing objected to a
    // two-million-dollar order before this.
    const _lc=lineCost(r), big=_lc>2000;
    i.style.borderColor=big?"var(--bad)":"";
    i.title=big?`⛔ ${money(_lc)} on one line — check this is intended`:"";
  }
  paintTotals();
  /* ⛔⛔ THE CHIP COUNTS ARE STATE, AND THIS PATH NEVER REFRESHED THEM.
     `applyQty` patches the row in place ON PURPOSE — a full render mid-keystroke
     would destroy the focused input — but it also skipped `paintFilters()`, so
     "only what I changed" sat at 0 while a line was visibly changed. Latent
     before 2026-09-05 and inherited by "not yet reviewed". The chips hold no
     focusable input, so repainting them here is safe at any time. */
  paintFilters();
  /* ⭐ ON COMMIT ONLY, do a full render. The note box — *"why did you change it?
     (this is the signal that improves the model)"* — is emitted by `lineHtml`,
     so before this it never appeared for the line you had just edited: you had
     to filter or save to make it show up, and by then the reason was gone.
     ⛔ Safe here and nowhere else: `commit` is blur/Enter, so focus has already
     left the box (Enter's handler blurs it immediately after). */
  /* ⛔⛔ NEVER RE-RENDER INSIDE THE INPUT'S OWN EVENT — IT CRASHES SAFARI.
     Reported 2026-09-06 (Jack): filter to dating risk, click the stepper arrow,
     and the tab dies with *"This webpage was reloaded because a problem
     occurred"* — WebKit's WebContent process crash, NOT a JS exception.
     ⭐ THE MECHANISM: `render()` replaces the whole list, so it DESTROYS the
     number input the stepper is still interacting with, from inside that input's
     own `change` handler. With the dating-risk filter on it happens every time,
     because lowering the quantity takes the row OUT of the filter — so the
     element really is removed rather than replaced in place.
     ⛔ It is not a performance problem: a filtered render measures 2.5 ms and an
     unfiltered one 9.8 ms over 226 rows. Re-rendering less would not have fixed it.
     ⭐ THE FIX IS TO LET THE EVENT FINISH FIRST. A zero-delay timeout runs after
     WebKit has finished dispatching the stepper interaction, so the input is no
     longer live when the DOM is rebuilt. Imperceptible to the reviewer, and it
     keeps the reason `render()` is here at all: the "why did you change it?" note
     box is emitted by `lineHtml`, so without a re-render it never appears on the
     line you just edited.
     ⚠️ Typing a quantity never crashed, because `change` then fires on BLUR —
     focus has already left the input, so nothing live is destroyed. */
  if(commit) setTimeout(render, 0);
}
document.addEventListener("focusin",e=>{
  const i=e.target.closest && e.target.closest("input[data-q]");
  if(i) EDITING=i.dataset.q;},true);
document.addEventListener("focusout",e=>{
  const i=e.target.closest && e.target.closest("input[data-q]");
  /* ⛔ clear AFTER the event settles, then re-render once so the row drops out of
     a filter it no longer matches — the tidy-up the crash was preventing. */
  if(i) setTimeout(()=>{ if(EDITING===i.dataset.q){ EDITING=null; render(); } },0);},true);
document.addEventListener("input",e=>{
  const i=e.target.closest("input[data-q]"); if(i) applyQty(i,false);},true);
document.addEventListener("change",e=>{
  const i=e.target.closest("input[data-q]"); if(i) applyQty(i,true);},true);
document.addEventListener("input",e=>{
  const n=e.target.closest("input[data-n]"); if(!n) return;
  const sku=n.dataset.n;
  EDIT[sku]={...(EDIT[sku]||{}), note:n.value};
  paintTotals();
},true);
document.addEventListener("keydown",e=>{
  const i=e.target.closest("input[data-q]");
  if(i&&e.key==="Enter"){ applyQty(i,true); i.blur(); }},true);
/* ⛔ CAPTURE PHASE, like every other delegated handler on this page: an ancestor
   calls stopPropagation, which killed the row-level buttons silently for a day
   (PM-512). ⭐ A bubble-phase listener here would never fire and would look like
   a button that does nothing. */
/* ⛔ Capture phase — an ancestor calls stopPropagation (PM-512). */
/* ⛔ Capture phase, and a SPAN not a button — the row's own click handlers must
   not swallow it. */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-rsn]"); if(!t) return;
  e.stopPropagation();
  const [sku,key]=t.dataset.rsn.split("|");
  const r=LINES.find(x=>x.sku===sku); if(!r) return;
  const cur=reasonsOf(r);
  const next=cur.includes(key)?cur.filter(x=>x!==key):cur.concat(key);
  EDIT[sku]={...(EDIT[sku]||{}), reasons:next.join(";")};
  render();
},true);
document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-unit]"); if(!b) return;
  const sku=b.dataset.unit, r=LINES.find(x=>x.sku===sku); if(!r) return;
  const now=unitOf(r), next=now==='case'?'each':'case';
  /* ⛔ A LINE WITH NO PACK RATIO CANNOT BECOME A CASE. Flipping it would invent
     a pack size, which is the one thing packsize.py refuses to do — a guessed
     ratio produces a confident wrong order quantity. */
  if(next==='case' && !(Number(r.units_per_order_unit)>1)){
    alert("We have no pack size for this item, so it cannot be ordered as a case "
      +"here.\n\nFinale's Std packing is what supplies that number. Fix it there "
      +"and it will come through on the next build — the app will not guess it.");
    return;
  }
  EDIT[sku]={...(EDIT[sku]||{}), order_unit:next};
  if(next===(r.order_unit||'each')){          // back to the engine's own answer
    const {order_unit, ...rest}=EDIT[sku];
    if(Object.keys(rest).length||SAVED[sku]) EDIT[sku]=rest; else delete EDIT[sku];
  }
  render();
},true);
document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-ok]"); if(!b) return;
  const sku=b.dataset.ok, r=LINES.find(x=>x.sku===sku); if(!r) return;
  const was=reviewState(r)!=="new";
  const cur=EDIT[sku]||{};
  EDIT[sku]={...cur, ack:!was};
  /* ⛔ Un-marking a line that was never anything BUT an ack must leave no edit
     behind, or Save stays enabled with nothing to save. */
  if(EDIT[sku].ack===false && EDIT[sku].qty==null && !EDIT[sku].decision
     && !EDIT[sku].note && !SAVED[sku]) delete EDIT[sku];
  render();
},true);
document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-rm]"); if(!b) return;
  const sku=b.dataset.rm;
  /* ⭐⭐ REMOVING AN ADDED LINE THAT WAS NEVER SAVED TAKES IT OFF THE PAGE
     ENTIRELY. There is no engine proposal underneath it to fall back to, so the
     struck-through ghost the ordinary path leaves would be a row representing
     nothing — and it would sit in the "removed" count as though the engine had
     wanted it. ⛔ NOT so once it is SAVED: SharePoint then holds a row for that
     SKU, and hiding it would hide a decision `purchase_drain.py` still applies.
     Those stay on screen, struck through, at quantity 0. */
  const r=LINES.find(x=>x.sku===sku);
  if(r && r.added && !SAVED[sku]){
    LINES=LINES.filter(x=>x.sku!==sku);
    delete EDIT[sku];
    const st=document.getElementById("status");
    if(st) st.textContent=`removed the line you had added for ${sku} — it was never saved`;
    paintAdd(); render(); return;
  }
  const cur=EDIT[sku]||{};
  EDIT[sku]={...cur, decision: cur.decision==="remove"?null:"remove"};
  if(!EDIT[sku].decision && EDIT[sku].qty==null) delete EDIT[sku];
  render();
},true);
document.getElementById("reset").onclick=()=>{
  const n=Object.keys(EDIT).length, saved=LINES.filter(r=>SAVED[r.sku]).length;
  /* ⭐ Lines a human ADDED but never saved have no engine number to revert TO —
     resetting them means taking them off the order, so say the count out loud
     rather than letting them silently reappear at quantity 0. */
  const adds=LINES.filter(r=>r.added&&!SAVED[r.sku]).length;
  /* ⛔ Reset clears UNSAVED work only. It used to leave the screen and the store
     disagreeing with no indication that saved changes were still in force. */
  if(n && !confirm(`Discard ${n} unsaved change(s)?`+
      (adds?`\n\n⛔ ${adds} of those are lines you ADDED by hand and never saved — `+
            `they will be taken off the order entirely.`:"")+
      (saved?`\n\n⛔ ${saved} change(s) already SAVED stay in force — use the ✕/quantity `+
             `to alter those, or they will be in the order.`:""))) return;
  EDIT={};
  LINES=LINES.filter(r=>!(r.added&&!SAVED[r.sku]));
  paintAdd(); render();
  document.getElementById("status").textContent=
    saved?`unsaved changes discarded · ${saved} saved change(s) still apply`:"";
};

/* ── save ────────────────────────────────────────────────────────────────── */
document.getElementById("save").onclick=async()=>{
  const btn=document.getElementById("save"), s=document.getElementById("status");
  btn.disabled=true; s.textContent="saving…";
  const id=await listId(); let ok=0, fail=0;
  const stamp=`${ORDER.meta.order_sunday} · built ${ORDER.meta.built_at||""}`;
  let addedOk=0;
  for(const [sku,e] of Object.entries(EDIT)){
    const r=LINES.find(x=>x.sku===sku); if(!r) continue;
    const q=saveQtyFor(r,e);
    /* ⭐ RECORD THE ENGINE'S NUMBER AND THE HUMAN'S SIDE BY SIDE. Storing only the
       final quantity loses the fact that a human overrode the model — which is
       the single most useful signal for improving it (order_feedback exists for
       exactly this reason). ⛔ Feedback is EVIDENCE, never an instruction. */
    const f={Title:`${ORDER.meta.order_sunday}:${sku}`,
      order_sunday:ORDER.meta.order_sunday, sku, upc:r.upc||"",
      item:(r.description||"").slice(0,255), brand:r.brand||"", source:r.source||"",
      /* ⭐ AN ADDED LINE HAS NO ENGINE QUANTITY, and 0 is the honest record of
         that: the model proposed nothing. ⛔ Leaving it null would make an
         addition indistinguishable from a decision row whose engine number was
         simply never written, and the scorecard would have to guess. */
      engine_qty:r.added?0:(r.order_qty??null), approved_qty:q,
      decision:decisionFor(r,e),
      unit_cost:unitCost(r)||null, line_cost:Number(lineCost(r).toFixed(2)),
      /* ⛔ the cover and risk RECORDED must describe the quantity actually
         approved. Storing the engine's cover_weeks against a halved quantity made
         the audit trail say the opposite of what the reviewer did. */
      /* ⛔ BOTH covers are recorded and NAMED. `dating_risk` is now judged on the
         position, so storing only the order-cover would leave an audit trail whose
         verdict could not be reproduced from its own numbers. */
      /* ⛔⛔ ONLY COLUMNS THE LIST ACTUALLY HAS. Graph rejects an unknown field
         with a bare 400 and the whole row is lost — no partial save, no useful
         message. I added `position_cover_weeks`, `on_hand` and `inbound` here on
         2026-09-06 when the risk chip moved onto the position; the
         `PurchaseReview` list has none of them, so EVERY save failed from that
         moment and the list stayed empty while the page reported a failure the
         reviewer had no way to interpret.
         ⭐ The three are recoverable anyway: they are on the published payload,
         joinable by (order_sunday, sku). Add the columns and they can come back —
         until then, do not send a field this list does not define. */
      cover_weeks:coverOf(r), shelf_days:r.shelf_days??null,
      dating_risk:riskOf(r), why:flat(r.why), flags:flat(r.flags),
      /* ⛔ THE Z IS LOAD-BEARING. toISOString() is UTC; slicing to 19 chars dropped
         the marker, so the same instant read as UTC here and as LOCAL in
         SharePoint and Excel — a silent 5-6 hour shift on every decision
         timestamp, in the audit trail we would use to reconstruct who decided
         what and when. */
      /* ⭐ the ordering-unit correction, recorded rather than silently applied —
         it is evidence that Finale's pack data is wrong for this SKU. */
      order_unit_override:(e.order_unit && e.order_unit!==(r.order_unit||'each'))
                          ? e.order_unit : "",
      change_reasons:reasonsOf(r).join(";").slice(0,255),
      reviewer:account, decided_at:new Date().toISOString().slice(0,19)+"Z",
      reviewer_note:(e.note||"").slice(0,255), build_stamp:stamp.slice(0,255)};
    const write=async()=>{
      const ex=(SAVED[sku]||{})._id;
      if(ex){ await graph(`/sites/${CFG.siteId}/lists/${id}/items/${ex}/fields`,
                          {method:"PATCH",body:JSON.stringify(f)});
              SAVED[sku]={...SAVED[sku],...f}; }
      else{ const j=await graph(`/sites/${CFG.siteId}/lists/${id}/items`,
              {method:"POST",body:JSON.stringify({fields:{...f,finalized:"false"}})});
            SAVED[sku]={...f,_id:j.id}; }
    };
    try{
      try{ await write(); }
      catch(err){
        /* ⛔⛔ "added" IS THE ONLY VALUE THIS PAGE HAS EVER SENT THAT THE LIST HAS
           NOT SEEN BEFORE. If `decision` was created as a Choice column, an
           unlisted value is rejected outright and the whole row is lost — and a
           lost row is a line that shows as added on screen and never reaches the
           order. ⭐ So retry ONCE as "changed", which is also true of an addition
           (0 -> n), and SAY SO: a fallback nobody is told about is how a page
           comes to disagree with its own store. ⛔ Once, and only for this one
           value — everything else still fails loudly. */
        if(f.decision==="added" && DECISION_ADDED==="added"){
          DECISION_ADDED="changed"; ADDED_FALLBACK=true;
          f.decision="changed";
          await write();
        } else throw err;
      }
      ok++; if(r.added) addedOk++;
    }catch(err){ fail++; console.error(sku,err); }
  }
  /* ⛔ SAY WHICH WEEK IT WENT TO. The one thing a reviewer cannot check afterwards
     is which order their decisions landed on. */
  s.textContent = (fail?`⛔ ${ok} saved, ${fail} FAILED on week ${ORDER.meta.order_sunday} — see the console`
                       :`✓ ${ok} change(s) saved to week ${ORDER.meta.order_sunday}`
                        +` · ${new Date().toLocaleTimeString()}`)
    + (addedOk?` · ${addedOk} line(s) you added by hand`:"")
    /* ⛔ SAY IT. The store now records those additions as ordinary "changed"
       rows, so anyone reading the list later cannot tell an addition from an
       override — that is a real loss of signal and someone has to widen the
       column. A silent fallback here would hide it forever. */
    + (ADDED_FALLBACK?` · ⛔ this list would not accept decision="added", so added `
        +`lines were recorded as "changed" — the quantities are correct, but tell `
        +`Jack: the PurchaseReview "decision" column needs to allow "added"`:"");
  btn.disabled=false;
  /* ⭐ the picker's per-week counts are now stale — refresh them from what we just
     wrote, so "no decisions yet" does not persist on a week that now has some. */
  ALLSAVED[String(ORDER.meta.order_sunday)]=SAVED;
  paintWeeks();
  /* ⛔⛔ EDIT is cleared ONLY because SAVED now carries the same state and
     qtyOf()/stateOf() read it. Clearing it while the screen read only EDIT is
     what made Save revert everything and Finalize export the engine's order. */
  if(!fail) EDIT={};
  render();
};

/* ── finalize ────────────────────────────────────────────────────────────── */
/* ⛔⛔ THIS PAGE DOES NOT SEND AN ORDER. It writes the approved quantities where
   `kehe_order.py finalize` reads them, and a human runs that step. Ordering is
   real money leaving the building; the Sunday output is a review artifact a
   person approves, never an auto-submitted order (hard boundary 4). */
document.getElementById("final").onclick=async()=>{
  const t=totals();
  /* ⛔ It used to print "save first" as prose and then build the artifact from
     whatever was on screen. Following the instruction was worse than ignoring it. */
  if(t.pending && !confirm(`⛔ ${t.pending} change(s) are NOT saved.\n\n`+
      `Finalize describes what is on screen, but purchase_drain.py reads the SAVED `+
      `decisions — so unsaved work will NOT reach the order.\n\nContinue anyway?`))
    return;
  const live=LINES.filter(r=>stateOf(r)!=="remove"&&qtyOf(r)>0)
    .map(r=>({sku:r.sku, upc:r.upc, item:r.description, qty:qtyOf(r),
              unit:unitCost(r),          // ⛔ the real unit cost, not cost/qty
              cost:Number(lineCost(r).toFixed(2)),
              engine:r.engine_qty??r.order_qty, source:r.source, added:!!r.added,
              notCarried:!!r.notCarried}));
  /* ⭐ AN ADDITION IS NOT AN OVERRIDE. Counting them together would report "42
     changed from the engine" on an order where 12 of those lines the engine
     never saw — two different facts about how much the model was trusted. */
  const addedL=live.filter(x=>x.added);
  const changed=live.filter(x=>!x.added && x.qty!==x.engine);
  const removed=LINES.filter(r=>stateOf(r)==="remove").map(r=>r.sku);
  const csv=["sku,upc,description,approved_qty,engine_qty,unit_cost,line_cost,source"]
    .concat(live.map(x=>[x.sku,x.upc,`"${String(x.item||"").replace(/"/g,'""')}"`,
      x.qty,x.engine,x.unit.toFixed(2),x.cost.toFixed(2),
      `"${x.source}"`].join(","))).join("\n");
  const m=document.getElementById("main");
  m.innerHTML=`<div class="banner"><b>Ready to execute — week of
      ${esc(ORDER.meta.order_sunday)}.</b> Nothing has been sent —
      this is the review artifact a human approves.</div>
    <table class="out">
      <tr><th>order week</th><td><b>${esc(ORDER.meta.order_sunday)}</b></td></tr>
      <tr><th>lines</th><td>${t.lines}</td></tr>
      <tr><th>units</th><td>${t.units.toLocaleString()}</td></tr>
      <tr><th>cost</th><td>${money(t.cost)}</td></tr>
      <tr><th>changed from the engine</th><td>${changed.length}</td></tr>
      <tr><th>added by hand (engine proposed none)</th><td>${addedL.length}${
        addedL.length?` — ${money(addedL.reduce((n,x)=>n+x.cost,0))}`:""}</td></tr>
      <tr><th>removed</th><td>${removed.length}</td></tr>
    </table>
    ${addedL.length?`<div class="banner">⭐ <b>Lines you added:</b> ${
      addedL.map(x=>`${esc(x.item||x.sku)} <b>×${x.qty}</b>`).join(" · ")}.
      ⛔ They reach the KeHE upload only if their decisions are SAVED —
      <code>purchase_drain.py</code> reads the store, not this screen.</div>`:""}
    ${live.some(x=>x.notCarried)?`<div class="banner bad">⚠️ <b>${
      live.filter(x=>x.notCarried).length} line(s) are for items we do NOT carry:</b> ${
      live.filter(x=>x.notCarried).map(x=>`${esc(x.item||x.sku)} <b>×${x.qty}</b>`).join(" · ")}.
      ⛔ They go on the KeHE upload keyed by UPC and item number, but the resulting
      PO cannot be imported into Finale until ProductPipeline creates each product —
      so plan receiving for them before the truck arrives.</div>`:""}
    <p class="mut small" style="margin-top:14px">Save first, then run this to produce the
      KeHE upload — it honours the approved quantities and a human's edit always wins:</p>
    <div class="banner"><code>python3 kehe_order.py finalize --sunday ${esc(ORDER.meta.order_sunday)}</code></div>
    <p class="mut small">Or take the approved lines as CSV:
      <button class="ghost" id="csvcopy" style="margin-left:8px">Copy</button>
      <button class="ghost" id="csvdl">Download</button>
      <span id="csvmsg" class="mut small"></span></p>
    <textarea id="csvbox" readonly style="width:100%;height:190px;font:12px ui-monospace,Menlo,monospace;
      border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);
      padding:9px">${esc(csv)}</textarea>
    <p style="margin-top:12px"><button class="ghost" onclick="render()">← back to the lines</button></p>`;
  /* ⛔ Selecting 280 lines out of a textarea by hand is not a way to get data out
     of a page, and it was the ONLY way (PM-527). Wired AFTER innerHTML, because
     these nodes do not exist until the panel is painted. */
  const msg=document.getElementById("csvmsg");
  const say=t=>{ if(msg){ msg.textContent=t; setTimeout(()=>{msg.textContent="";},2500); } };
  const cc=document.getElementById("csvcopy");
  if(cc) cc.onclick=async()=>{
    try{ await navigator.clipboard.writeText(csv); say("✓ copied"); }
    catch(err){
      /* ⛔ clipboard access is refused outside a secure context or without the
         permission — falling back silently would look like a dead button. */
      const b=document.getElementById("csvbox");
      if(b){ b.focus(); b.select(); say("⛔ could not copy — selected it for you, press ⌘C"); }
      else say("⛔ could not copy");
    }};
  const dl=document.getElementById("csvdl");
  if(dl) dl.onclick=()=>{
    const name=`approved_order_${ORDER.meta.order_sunday}.csv`;
    const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
    const a=document.createElement("a");
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    say("✓ "+name);
  };
};

/* ── boot ────────────────────────────────────────────────────────────────── */
async function boot(){
  const sub=document.getElementById("sub");
  try{
    if(!loadToken()){ if(!await completeLogin()){ await beginLogin(); return; } }
    sub.textContent="loading the order…";
    /* ⛔ THE WEEK IS CHOSEN ONCE, HERE, AND ONLY HERE. Every read below takes the
       week it is given — see pickWeek() for why "the newest" is the wrong rule. */
    WEEKS=await listWeeks();
    if(!WEEKS.length)
      throw new Error("no order has been published yet — run scripts/publish_order.py --publish");
    ALLSAVED=await loadAllSaved();
    const p=pickWeek();
    await switchWeek(p.key,{reason:p.reason, cached:true, boot:true});
  }catch(e){
    document.getElementById("main").innerHTML=
      `<div class="center">⛔ ${esc(e.message)}<br><br>
       <button class="ghost" onclick="sessionStorage.clear();location.href=location.pathname">sign in again</button></div>`;
    sub.textContent="not signed in";
  }
}
boot();

</script>
