<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Purchase review — TC Farm</title>
<style>
:root{color-scheme:light;
  --bg:#fcfcfb; --card:#fff; --line:#dedcd5; --ink:#0b0b0b; --ink2:#52514e; --ink3:#7d7b74;
  --accent:#2a78d6; --good:#008300; --warn:#eda100; --bad:#e34948; --chip:#f3f3f0;}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#1a1a19; --card:#232322; --line:#3a3a37; --ink:#fff; --ink2:#c3c2b7; --ink3:#8e8d84;
  --accent:#3987e5; --good:#3fa63f; --warn:#c98500; --bad:#e66767; --chip:#2f2f2d;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:12px 18px 10px}
h1{font-size:18px;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:12.5px;margin-top:2px}
/* ⭐ THE ORDER WEEK, stated where it cannot be missed. ⛔ Never smaller than the
   quantity fields it governs — a buyer who edits the wrong week finds out at the
   invoice. The amber state means "a newer week exists and you are not on it",
   which is a legitimate thing to be doing on purpose, so it warns, never blocks. */
.weekbar{display:flex;flex-wrap:wrap;gap:9px;margin-top:7px;align-items:center}
.weekbadge{font-size:15px;font-weight:700;letter-spacing:-.01em;padding:1px 12px;
  border:1.5px solid var(--accent);color:var(--accent);border-radius:20px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.weekbadge.stale{border-color:var(--warn);color:var(--warn)}
#week{max-width:420px}
.footweek{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--accent);
  border:1px solid var(--accent);border-radius:20px;padding:1px 10px;white-space:nowrap}
.footweek.stale{color:var(--warn);border-color:var(--warn)}
.totals{display:flex;flex-wrap:wrap;gap:14px;margin-top:9px;align-items:center}
.tot{display:flex;flex-direction:column;line-height:1.25}
.tot b{font-size:17px;font-variant-numeric:tabular-nums}
.tot span{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.03em}
.bar{flex:1;min-width:170px;height:7px;border-radius:4px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.chip{border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:12.5px;
  cursor:pointer;background:var(--card);color:var(--ink2);user-select:none}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:600;border-color:var(--ink)}
.chip .n{opacity:.65;margin-left:5px;font-variant-numeric:tabular-nums}
input[type=search],select{background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:7px;padding:5px 9px;font:inherit;font-size:12.5px}
main{padding:14px 18px 90px;max-width:1500px}
.line{display:grid;grid-template-columns:1fr auto;gap:10px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);padding:11px 13px;margin-bottom:8px}
.line.changed{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.line.removed{opacity:.5}
.line.removed .nm{text-decoration:line-through}
.nm{font-weight:600}
.meta{color:var(--ink2);font-size:12.5px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--ink2)}
.tag.src{border-color:var(--accent);color:var(--accent)}
.tag.bad{border-color:var(--bad);color:var(--bad);font-weight:600}
.tag.warn{border-color:var(--warn);color:var(--warn)}
/* ⭐⭐ THE POSITION STRIP (Jack, 2026-09-06): *"I don't even know. You're telling
   me to order twelve of them. I don't know how many I have. I don't know how many
   pending orders there are in a quick look, and the engine's own wording has a lot
   of information that is just in a long string of text that I can't read...
   everything needs to be positioned and visually structured so that it's the same
   on each row."*
   ⛔ THE DEFECT WAS NOT MISSING DATA — on_hand / inbound / pre_window were all on
   the row already, buried inside the `why` prose behind a <details>. A number a
   buyer must expand a disclosure to read is a number they do not have.
   ⭐ SO: FIXED COLUMNS, FIXED ORDER, EVERY ROW. The eye lands in the same place on
   line 1 and line 157, which is what makes 157 lines scannable at all. */
.pos{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin-top:9px;
  border:1px solid var(--line);border-radius:8px;overflow:hidden}
.pos>div{padding:4px 8px 5px;border-right:1px solid var(--line);min-width:0}
.pos>div:last-child{border-right:0}
.pos b{display:block;font-size:14px;line-height:1.2;color:var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pos s{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink3);text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* ⭐ A ZERO IS INFORMATION AND MUST NOT LOOK LIKE THE HEADLINE FIGURE — greyed,
   never hidden. "0 on hand" is exactly the fact that justifies the buy. */
/* ⭐ THE PACK, SAID WHERE THE NUMBER IS. "1" alone cannot be told from one
   popcorn bag; on a bulk line it is one case of fifty. ⛔ Not italic — this is a
   unit, not an aside. */
.pos b em{font-style:normal;font-size:11px;font-weight:600;color:var(--bad);
  margin-left:5px;letter-spacing:.01em}
.pos .z b{color:var(--ink3);font-weight:400}
.pos .add b{color:var(--accent);font-weight:700}
.pos .hot b{color:var(--bad);font-weight:700}
/* ══ ALERT DASHBOARD ══ tiles replace ~1,400 words of prose above the first row.
   ⛔ Every tile with an action is a real <button>, so it is keyboard-reachable
   and announces its pressed state; the ones with nothing to click are disabled
   rather than fake-clickable. */
.dash{margin:10px 0 4px}
.tiles{display:flex;flex-wrap:wrap;gap:8px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:1px;
  min-width:118px;padding:7px 11px;border:1px solid var(--line);border-radius:9px;
  background:var(--card);cursor:pointer;font:inherit;text-align:left}
.tile:disabled{cursor:default;opacity:.72}
.tile b{font-size:20px;line-height:1.05;font-variant-numeric:tabular-nums}
.tile s{font-size:10px;text-transform:uppercase;letter-spacing:.04em;
  color:var(--ink3);text-decoration:none;line-height:1.25}
.tile.bad b{color:var(--bad)} .tile.warn b{color:#a86400} .tile.info b{color:var(--ink)}
.tile.bad{border-color:var(--bad);background:#fff6f6}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile.on{background:var(--ink);border-color:var(--ink)}
.tile.on b,.tile.on s{color:#fff}
/* the engine's own notes: collapsed, one line each, count first */
.alrtwrap{margin-top:9px;font-size:12px}
.alrtwrap>summary{cursor:pointer;color:var(--ink3)}
.alrts{margin-top:6px;display:grid;gap:4px}
.alrt>summary{cursor:pointer;padding:3px 0;font-size:12px}
.alrt>summary b{font-variant-numeric:tabular-nums;margin-right:5px}
.alrt.bad>summary{color:var(--bad)} .alrt.warn>summary{color:#a86400}
.alrt.ctx>summary,.alrt.info>summary{color:var(--ink2)}
.alrt>div{font-size:11.5px;color:var(--ink2);padding:3px 0 6px 18px;line-height:1.45}
.alrt>summary i{color:var(--bad);font-style:normal}
/* ══ REORDER EVIDENCE ══ one shape per flagged row, same order every time:
   the net-GP number, the sold-vs-binned fate bar, then the 26-week sparkline.
   ⛔ The whole point is that the eye lands in the same three places on every
   card, so nothing here may reflow or reorder per item. */
.evid{display:grid;grid-template-columns:minmax(150px,190px) 1fr;gap:10px 14px;
  margin-top:8px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg2)}
.evid.bad{border-color:var(--bad);background:#fff5f5}
.evidnum b{display:block;font-size:19px;line-height:1.1;font-variant-numeric:tabular-nums}
.evidnum b.neg{color:var(--bad)} .evidnum b.pos{color:var(--good)}
.evidnum s{display:block;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;
  color:var(--ink3);text-decoration:none;margin-top:1px}
.evidnum .sub{display:block;font-size:10.5px;color:var(--ink2);margin-top:3px}
/* the fate bar — sold vs binned, normalised to the ratio, counts printed beside */
.fate{align-self:center}
.fatebar{display:flex;height:11px;border-radius:6px;overflow:hidden;
  background:var(--line)}
.fatebar i.sold{background:var(--good)} .fatebar i.binned{background:var(--bad)}
.fatelab{display:block;font-size:11px;color:var(--ink2);margin-top:4px}
.fatelab b{color:var(--ink)} .fatelab b.bn{color:var(--bad)}
.fate.none{font-size:11px;color:var(--ink3);line-height:1.35}
/* the sparkline — 26 weekly bars, scaled to the row's own peak */
.spark{grid-column:1/-1;display:flex;align-items:flex-end;gap:2px;height:34px;
  position:relative;padding-bottom:12px}
.spark i{flex:1 1 0;min-width:2px;background:var(--accent);opacity:.65;border-radius:1px}
.spark s{position:absolute;left:0;bottom:0;font-size:9.5px;color:var(--ink3);
  text-decoration:none}
@media (max-width:720px){ .evid{grid-template-columns:1fr} }
/* The cover bar: the track is WHICHEVER IS LONGER of what we would hold and what
   the dating allows, so the ceiling is always on screen and an overrun is visible
   as overrun rather than as a full bar. */
.cov{margin-top:7px;display:flex;align-items:center;gap:9px}
.covtrack{position:relative;flex:1;height:9px;border-radius:5px;background:var(--chip);
  overflow:hidden;min-width:80px}
.covtrack i{position:absolute;top:0;height:100%}
.covtrack i.have{background:var(--ink3);opacity:.55}
.covtrack i.add{background:var(--accent)}
.covtrack i.over{background:var(--bad)}
/* the dating ceiling — a hairline the fill is read against, not a segment */
.covtrack u{position:absolute;top:-2px;width:2px;height:13px;background:var(--ink2);
  text-decoration:none;border-radius:1px}
.covnote{font-size:11.5px;color:var(--ink2);font-variant-numeric:tabular-nums;
  white-space:nowrap}
.covnote.bad{color:var(--bad);font-weight:600}
.covnote.none{color:var(--ink3)}
/* ⭐⭐ THE SELL-THROUGH DATE (Jack, 2026-09-06): *"we are buying 24, but that
   should sell out by XYZ date? … if I adjust that to 55 when would it sell out
   by?"* ⛔ SAME PLACE ON EVERY ROW, including when it cannot be computed — a row
   that simply omits the sentence reads as a row with nothing to worry about. */
.sell{margin-top:5px;font-size:11.5px;color:var(--ink2);line-height:1.45}
.sell b{color:var(--ink);font-variant-numeric:tabular-nums}
.sell.bad{color:var(--bad)} .sell.bad b{color:var(--bad)}
.sell.none{color:var(--ink3)}
@media(max-width:720px){
  .pos{grid-template-columns:repeat(4,minmax(0,1fr))}
  .pos>div:nth-child(4n){border-right:0}
}
.acts{display:flex;gap:6px;align-items:flex-start}
.acts input{width:74px;height:34px;text-align:center;font-variant-numeric:tabular-nums;
  border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);font:inherit}
.mini{height:34px;min-width:34px;border:1px solid var(--line);border-radius:7px;background:var(--card);
  color:var(--ink2);cursor:pointer;font:inherit;font-size:13px;padding:0 9px}
.mini.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.mini.rm.on{background:var(--bad);border-color:var(--bad);color:#fff}
.mini.ok.on{background:var(--good);border-color:var(--good);color:#fff}
/* ⭐ reason chips — smaller than a filter chip so a row of twelve does not
   compete with the line itself, and clearly ON when chosen. */
.chip.rsn{font-size:11.5px;padding:2px 8px;cursor:pointer;user-select:none}
.chip.rsn.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
/* ⭐ An UNREVIEWED line is the default state, so it must not shout — the cue is a
   quiet left rail plus the ○ pip, distinct from the accent rail that means
   "changed". ⛔ Never a fill: 282 tinted rows would read as 282 problems. */
.line.unreviewed{box-shadow:inset 3px 0 0 var(--line)}
/* ⭐ the plain-English reason, ABOVE the raw working. Jack, 2026-09-06: the old
   panel "just has a whole bunch of random stuff underneath it". The working is
   still there — collapsed — because it is the audit trail. */
.explain{margin-top:7px;font-size:13px;line-height:1.5;color:var(--ink2);
  border-left:2px solid var(--line);padding-left:9px;max-width:74ch}
details.why{margin-top:6px}
details.why summary{cursor:pointer;color:var(--ink3);font-size:12px}
details.why div{color:var(--ink2);font-size:12.5px;margin-top:5px;
  white-space:pre-wrap;word-break:break-word}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:9px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:30}
.primary{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 17px;
  font:inherit;font-weight:600;cursor:pointer}
.primary[disabled]{opacity:.45;cursor:default}
.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;
  padding:9px 15px;font:inherit;cursor:pointer}
.mut{color:var(--ink2)} .small{font-size:12px}
.center{text-align:center;padding:40px 12px;color:var(--ink2)}
.banner{background:var(--chip);border:1px solid var(--line);border-radius:9px;
  padding:9px 12px;margin-bottom:10px;font-size:12.5px;color:var(--ink2)}
.banner.bad{border-color:var(--bad);color:var(--bad)}
/* ⭐⭐ ADD AN ITEM — the panel, and the way an added line reads on the list.
   ⛔ AN ADDED LINE MUST NOT LOOK LIKE AN ENGINE LINE SOMEONE EDITED. Those are
   different facts: one is "the model was wrong by 12", the other is "the model
   never saw this at all". The accent rail already means "changed", so an added
   line gets its own GREEN rail plus a tag that says so in words — colour alone
   is not a label. */
.addbtn{padding:5px 12px;font-size:12.5px;border-color:var(--accent);color:var(--accent);
  font-weight:600}
.line.added{border-color:var(--good);box-shadow:inset 3px 0 0 var(--good)}
.tag.add{border-color:var(--good);color:var(--good);font-weight:600}
/* ⛔⛔ `[hidden]` LOSES TO A CLASS SELECTOR, AND THAT SHIPPED (Jack, 2026-09-06:
   *"a refresh this pops up and won't close"*). The browser's own rule is
   `[hidden]{display:none}` — ONE attribute selector — while `.modal{display:flex}`
   below is a CLASS, which outranks it. So the panel rendered on every page load
   and `closeAdd()`'s `w.hidden=true` changed nothing on screen: the element was
   correctly marked hidden and correctly painted anyway.
   ⭐ THE GUARD IS FIRST, DELIBERATELY: an attribute+class selector beats the bare
   class, so any future `display:` added to `.modal` cannot resurrect this. */
[hidden]{display:none!important}
.modal[hidden]{display:none!important}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.42);
  display:flex;align-items:flex-start;justify-content:center;padding:36px 14px}
.modalbox{background:var(--bg);border:1px solid var(--line);border-radius:12px;
  width:100%;max-width:920px;max-height:calc(100vh - 72px);display:flex;
  flex-direction:column;padding:14px 16px 12px;box-shadow:0 14px 40px rgba(0,0,0,.28)}
.modalhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:9px}
.modalhead b{font-size:16px}
.modalhead .ghost{margin-left:auto;padding:5px 12px;font-size:12.5px}
#addq{width:100%;background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:8px;padding:8px 11px;font:inherit;font-size:13.5px}
#addbody{overflow:auto;margin-top:10px;min-height:120px}
.cand{border:1px solid var(--line);border-radius:9px;background:var(--card);
  padding:9px 11px;margin-bottom:7px;display:grid;grid-template-columns:1fr auto;gap:10px}
.cand.on{border-color:var(--good)}
.cand .nm{font-weight:600;font-size:13.5px}
.cand .meta{color:var(--ink2);font-size:12px;margin-top:2px}
/* the same figures the position strip shows, so the buyer judges an addable item
   on the numbers they will see on the row once it is added */
.candfig{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;font-size:11.5px;
  color:var(--ink2);font-variant-numeric:tabular-nums}
.candfig b{color:var(--ink);font-weight:600}
.candwhy{margin-top:5px;font-size:11.5px;color:var(--ink3);border-left:2px solid var(--line);
  padding-left:8px;max-width:78ch}
.cand .acts{align-items:center}
.cand .acts input{width:70px;height:32px}
.candmore{text-align:center;color:var(--ink2);font-size:12.5px;padding:9px}
/* ⭐⭐ AN ITEM WE DO NOT CARRY IS A DIFFERENT KIND OF THING, and the panel must
   say so before the buyer types a quantity into it. ⛔ Not a colour alone: the
   section carries a heading in words, and every such card repeats the one fact
   that matters — no Finale SKU, so it can go OUT to KeHE but the PO cannot come
   back IN until ProductPipeline creates the product. */
.catsec{margin:14px 0 8px;border-top:1px dashed var(--line);padding-top:11px}
.cand.newitem{border-style:dashed;border-color:var(--warn)}
.cand.newitem .nm:after{content:"NOT CARRIED";margin-left:8px;font-size:10px;
  font-weight:700;letter-spacing:.05em;color:var(--warn);border:1px solid var(--warn);
  border-radius:20px;padding:0 7px;vertical-align:middle}
.catwarn{margin-top:5px;font-size:11.5px;color:var(--warn);
  border-left:2px solid var(--warn);padding-left:8px;max-width:78ch}
.line.notcarried{border-color:var(--warn);box-shadow:inset 3px 0 0 var(--warn)}
.tag.nc{border-color:var(--warn);color:var(--warn);font-weight:600}
table.out{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:8px}
table.out td,table.out th{padding:4px 10px 4px 0;text-align:left;white-space:nowrap}
table.out th{color:var(--ink3);font-weight:600;border-bottom:1px solid var(--line)}
</style>
<header>
  <h1>Purchase review</h1>
  <!-- ⭐⭐ WHICH WEEK AM I EDITING? Until 2026-09-06 the page loaded whichever
       order_*.json sorted newest and said so only in small grey text, so
       publishing next week's recommendations SILENTLY replaced the week a buyer
       was working on. ⛔ The badge is in the STICKY header on purpose — it must be
       on screen at the moment any quantity is typed, not scrolled away.
       ⛔ These controls live OUTSIDE #filters, which paintFilters() rebuilds on
       every render; a <select> rebuilt mid-interaction closes under the cursor. -->
  <div class="weekbar">
    <label class="mut small" for="week">Order week</label>
    <select id="week" aria-label="which order week to review"><option>loading…</option></select>
    <span class="weekbadge" id="weeknow">—</span>
    <span class="mut small" id="weeknote"></span>
  </div>
  <div class="sub" id="sub">signing in…</div>
  <div class="totals" id="totals"></div>
  <div class="filters">
    <input type="search" id="q" placeholder="Find an item, brand, SKU or UPC…" style="min-width:220px">
    <!-- ⭐ OUTSIDE the repainted #filters region, like the search box: paintFilters()
         rebuilds its own innerHTML on every render, which once destroyed a focused
         control mid-interaction. Wired once in _app.js. -->
    <label class="mut small" for="sort">Sort</label>
    <select id="sort" style="border:1px solid var(--line);border-radius:7px;padding:5px 8px;
            background:var(--card);color:var(--ink);font:inherit;font-size:12.5px">
      <!-- ⭐ FIRST, and named for what it does: every line a human must look at,
           worst first. Jack, 2026-09-08: *"can we sort the page to show these at
           the top and other ones that prob need special attention at the top?"* -->
      <option value="attention">⛔ needs attention first</option>
      <option value="engine">the engine's order</option>
      <option value="cost">biggest spend first</option>
      <option value="risk">dating risk first</option>
      <option value="cover">most weeks of cover first</option>
      <option value="name">A–Z</option>
      <option value="source">by source</option>
    </select>
    <!-- ⭐⭐ ADD AN ITEM (Jack, 2026-09-06): *"there doesn't appear to be a way to
         add items to the order in the purchasing app — like what if I want to use
         some of her ideas and add them in manually?"* A reviewer compares this
         order against Julia's own hand-built sheet; until now they could change a
         quantity, zero a line or mark it reviewed, but never put a SKU ON.
         ⛔ OUTSIDE #filters, which paintFilters() rebuilds on every render. -->
    <button class="ghost addbtn" id="addopen" title="add a SKU the engine did not propose">
      + Add an item</button>
    <span id="progress" class="mut small"></span>
    <span id="subtot" class="mut small"></span>
  </div>
  <div class="filters" id="filters"></div>
</header>
<!-- ⛔ OUTSIDE <main>, which the finalize panel replaces wholesale, and outside
     <header>, which is sticky and would clip it. -->
<div class="modal" id="addwrap" hidden>
  <div class="modalbox" role="dialog" aria-modal="true" aria-labelledby="addtitle">
    <div class="modalhead">
      <b id="addtitle">Add an item to this order</b>
      <span class="mut small" id="addsub"></span>
      <button class="ghost" id="addclose" aria-label="close">Close</button>
    </div>
    <input type="search" id="addq" autocomplete="off"
           placeholder="Search by description, brand, SKU or UPC…">
    <div id="addbody"></div>
  </div>
</div>
<main id="main"><div class="center">Loading…</div></main>
<div class="foot">
  <!-- ⛔ The week again, beside the buttons that act on it. The header badge can be
       scrolled past on a long order; this bar cannot — it is fixed. -->
  <b id="footweek" class="footweek">—</b>
  <span id="tally" class="mut small">—</span>
  <span class="mut small">⛔ nothing is saved until you press Save</span>
  <button class="ghost" id="reset">Reset changes</button>
  <button class="primary" id="save" disabled>Save decisions</button>
  <button class="ghost" id="final" disabled>Finalize order…</button>
  <span id="status" class="mut small"></span>
</div>

<script>
const CFG = {
  clientId: "4a5939ef-bb89-4629-8a95-007509bb11a5",   /* "TC Farm Receiving" */
  tenantId: "c0f23c54-f515-4e2e-8aef-d3afb1ae34d0",
  siteId: "tcfarm0.sharepoint.com,d5fe3f11-af72-4c8b-b877-80e69226ca49,753c3608-e66a-4ec6-9fdf-5fb646ffa4fa",
  /* ⭐ same Entra app + same site as the new-item review — one credential,
     one sign-in. This app reads PurchaseReview/ instead. */
  scopes:["https://graph.microsoft.com/Sites.ReadWrite.All","offline_access","openid","profile"]
};
const AUTH=`https://login.microsoftonline.com/${CFG.tenantId}/oauth2/v2.0`;
const GRAPH="https://graph.microsoft.com/v1.0";
const store=sessionStorage;
let token=null,tokenExp=0,refreshTok=null,account="";

/* ── auth: authorization code + PKCE (same shape as the receiving page) ── */
const rand=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);
  return Array.from(a,b=>("0"+b.toString(16)).slice(-2)).join("")};
const b64url=b=>btoa(String.fromCharCode(...new Uint8Array(b)))
  .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const sha256=async s=>crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
async function beginLogin(){
  const v=rand(64),c=b64url(await sha256(v)),st=rand(16);
  store.setItem("pkce_v",v);store.setItem("pkce_s",st);
  location.assign(`${AUTH}/authorize?`+new URLSearchParams({
    client_id:CFG.clientId,response_type:"code",
    redirect_uri:location.origin+location.pathname,response_mode:"query",
    scope:CFG.scopes.join(" "),code_challenge:c,code_challenge_method:"S256",state:st}));
}
async function completeLogin(){
  const q=new URLSearchParams(location.search),code=q.get("code");
  if(q.get("error")) throw new Error(`${q.get("error")}: ${q.get("error_description")||""}`);
  if(!code) return false;
  if(q.get("state")!==store.getItem("pkce_s")) throw new Error("state mismatch — restart sign-in");
  const r=await fetch(`${AUTH}/token`,{method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams({client_id:CFG.clientId,grant_type:"authorization_code",code,
      redirect_uri:location.origin+location.pathname,code_verifier:store.getItem("pkce_v")})});
  const j=await r.json();
  if(!r.ok) throw new Error(j.error_description||j.error||"token exchange failed");
  setToken(j); history.replaceState({},"",location.pathname); return true;
}
function setToken(j){
  token=j.access_token; tokenExp=Date.now()+(j.expires_in||3600)*1000-60000;
  if(j.refresh_token) refreshTok=j.refresh_token;
  try{account=JSON.parse(atob(j.id_token.split(".")[1])).preferred_username||"";}catch(_){}
  store.setItem("tok",JSON.stringify({t:token,e:tokenExp,r:refreshTok,a:account}));
}
function loadToken(){try{const s=JSON.parse(store.getItem("tok")||"null");if(!s)return false;
  token=s.t;tokenExp=s.e;refreshTok=s.r;account=s.a||"";return Date.now()<tokenExp;}catch(_){return false}}
async function getToken(){
  if(token&&Date.now()<tokenExp) return token;
  if(refreshTok){
    const r=await fetch(`${AUTH}/token`,{method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({client_id:CFG.clientId,grant_type:"refresh_token",
        refresh_token:refreshTok,scope:CFG.scopes.join(" ")})});
    const j=await r.json(); if(r.ok){setToken(j);return token;}
  }
  throw new Error("session expired — reload and sign in again");
}
async function graph(path,opts={}){
  const t=await getToken();
  const r=await fetch(GRAPH+path,{...opts,headers:{...(opts.headers||{}),
    Authorization:"Bearer "+t,"Content-Type":"application/json"}});
  const txt=await r.text(); let j=null; try{j=txt?JSON.parse(txt):null}catch(_){}
  if(!r.ok) throw new Error((j&&(j.error?.message||j.error_description))||`${r.status} on ${path}`);
  return j;
}

/* ── data ─────────────────────────────────────────────────────────────── */
const fmt=(v,d=2)=>v===null||v===undefined||v===""?"—":Number(v).toFixed(d);
/* ⭐ Flatten anything the payload holds into a Text-column-safe string.
   ⛔ Never assume a payload field is a string — several are lists or objects, and
   the failure mode is a 400 that loses the whole batch of decisions. */
function flat(v,max){
  max=max||255;
  if(v==null) return "";
  let out;
  if(Array.isArray(v)) out=v.map(x=>typeof x==="string"?x:JSON.stringify(x)).join(" · ");
  else if(typeof v==="object") out=JSON.stringify(v);
  else out=String(v);
  return out.slice(0,max);
}


/* ══ PURCHASE REVIEW ══ the Sunday order, as a reviewable surface.
   ⛔ The engine decides; this page lets a human CHANGE that decision and records
   what they changed and why. It never re-derives a quantity of its own — an
   operator changes the ORDER, never the programming (hard boundary 7). */
const LIST="PurchaseReview", DIR="PurchaseReview";
let ORDER=null, LINES=[], EDIT={}, SAVED={}, LISTID=null,
    FILTER="all", Q="", RISK=false, UNK=false, ONLYCH=false,
    /* ⛔ DECLARED HERE OR THE PAGE DIES. `paintFilters` READS these in a
       template literal before anything assigns them, so an implicit global
       does not save you — it is a ReferenceError on first render. */
    LOSS=false, REVW=false,
    SORT="engine", NEWONLY=false;
/* ⭐⭐ WHICH ORDER WEEK ARE WE DECIDING — and every week available to switch to.
   ⛔⛔ Until 2026-09-06 this page could only ever show ONE week: loadOrder() listed
   the folder, took the newest name and that was that. So publishing 2026-09-13 to
   let Julia look ahead would have SILENTLY MOVED whoever was mid-review on
   2026-09-06 onto a different order, with the same header, the same buttons and
   no event of any kind. ⭐ The fix is not just "list them all": the DEFAULT must
   stay on the week someone is already working (the newest with saved decisions),
   because a publish is not a reason to move a buyer.
     WEEKS     [{key,name,id}] newest first — key is the order Sunday
     WEEK      the key we are editing right now
     ALLSAVED  {sunday: {sku: fields}} — every decision on the list, by week, so
               the picker can say which weeks have work in them */
let WEEKS=[], WEEK=null, ALLSAVED={}, SWITCHING=false, WEEK_REASON="";
/* the SKU whose quantity box currently has focus — see visible() */
let EDITING=null;
const WEEK_MEM="purchasing.week";
/* ⭐⭐ ADD AN ITEM THE ENGINE DID NOT PROPOSE (Jack, 2026-09-06: *"there doesn't
   appear to be a way to add items to the order in the purchasing app — like what
   if I want to use some of her ideas and add them in manually?"*).
   ⛔ THE PAYLOAD IS ONLY WHAT WE ARE BUYING — 265 rows of 2,260 — so there was no
   pool to search. `publish_order.py` now publishes the other ~2,000 as a separate
   slim `candidates_<sunday>.json`, fetched ONLY when the panel is opened so the
   ordinary review still downloads one file.
     CAND_STATE  idle | loading | ready | error — ⛔ the panel must never show an
                 empty search box on a failed load: "nothing to add" is FALSE and
                 a buyer would believe it.
     CAND_WARN   a non-fatal disagreement worth saying out loud (a candidate file
                 from a different build than the order on screen). */
let CAND=null, CAND_BY={}, CAND_STATE="idle", CAND_ERR="", CAND_WEEK=null,
    CAND_WARN="", ADDQ="", ADD_NOTE="";
const ADDED_SOURCE="added by hand", ADD_MAX=60;
/* ⭐⭐ AND THE ITEMS WE DO **NOT** CARRY (Jack, 2026-09-06: the add panel
   *"needs to allow for new items too based on KEHE ID or UPC code"*).
   ⛔⛔ A CATALOGUE ITEM IS NOT A CANDIDATE AND MUST NEVER RENDER LIKE ONE. A
   candidate is a row `order_sheet.csv` already carries — it has a Finale SKU,
   an on-hand, a sales rate and a best-by. A catalogue item has NONE of those:
   it can be ordered from KeHE (they key on UPC and item number) but it cannot
   come back through the Finale PO import until ProductPipeline creates the
   product, and no figure on it can be computed. ⛔ Unknown renders as unknown —
   a fabricated cover or sell-through date on one of these would be the exact
   failure the rest of this file keeps naming.
   ⛔ 2.4 MB / 20,580 rows, so it is NEVER fetched during ordinary review: only
   when a search finds nothing among the carried items, or when what was typed
   looks like an item number or a UPC.
     CAT_ROWS  the positional rows decoded into objects (the file stores arrays
               plus a `cols` header, to keep 20,580 rows fetchable)
     CAT_BY    synthetic sku -> row. ⭐ The sku is `KEHE-<item number>`, so the
               ONE thing `purchase_drain.py` must have to put the line on a PO
               travels inside the decision key itself and cannot be lost by a
               SharePoint column that does not exist. */
let CAT=null, CAT_ROWS=[], CAT_BY={}, CAT_STATE="idle", CAT_ERR="",
    CAT_WEEK=null, CAT_WARN="";
const CAT_PREFIX="KEHE-", CAT_MAX=30;
/* ⭐ The two dates that bound a new unit's life, stated once. Arrival is the
   delivery lag after the order goes out; a customer must receive at least
   CUSTOMER_MIN_DAYS of life, so the last day we can SELL a unit is that far
   before its best-by. */
const DELIVERY_LAG_DAYS=2, CUSTOMER_MIN_DAYS=5;
/* ⛔ THE ONE FIELD VALUE THIS PAGE HAS NEVER WRITTEN BEFORE. If PurchaseReview's
   `decision` column turns out to be a Choice rather than free text, an unlisted
   value is rejected and the whole row is lost. The save path retries ONCE as
   "changed" (which is also true: 0 -> n) and flips this, so `pendingFor` keeps
   comparing against what was actually stored instead of warning forever. */
let DECISION_ADDED="added", ADDED_FALLBACK=false;

const money=n=>n==null?"—":"$"+Number(n).toLocaleString(undefined,
  {minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>n==null?"—":"$"+Math.round(Number(n)).toLocaleString();

/* ⛔ `publish_order.py` writes `order_<sunday>.json`, so the Sunday is IN the name
   and ISO dates sort lexicographically. ⭐ But a name that does not carry a date is
   KEPT, not dropped — a dropped file is an order week nobody on this page can
   reach, and it would look exactly like "that week was never published". */
function weekKeyOf(name){
  const m=/^order_(\d{4}-\d{2}-\d{2})/.exec(name);
  return m ? m[1] : String(name).replace(/^order_/,"").replace(/\.json$/,"");
}
const isDate=k=>/^\d{4}-\d{2}-\d{2}$/.test(k);
async function listWeeks(){
  const ls=await graph(`/sites/${CFG.siteId}/drive/root:/${DIR}:/children?$select=name,id&$top=200`);
  const f=(ls.value||[]).filter(x=>/^order_.*\.json$/.test(x.name))
    .map(x=>({key:weekKeyOf(x.name), name:x.name, id:x.id}));
  f.sort((a,b)=>{                       // newest first; undated names last
    if(isDate(a.key)!==isDate(b.key)) return isDate(a.key)?-1:1;
    return a.key<b.key?1:a.key>b.key?-1:0;
  });
  return f;
}
/* ⛔ TAKES THE WEEK IT IS ASKED FOR. It used to pick `[0]` itself, which is how one
   publish could move a reviewer onto another order. The choice is made once, in
   pickWeek(), and every other caller must pass what it wants. */
async function loadOrder(w){
  if(!w) throw new Error("no order has been published yet — run scripts/publish_order.py --publish");
  const t=await getToken();
  const r=await fetch(`${GRAPH}/sites/${CFG.siteId}/drive/items/${w.id}/content`,
                      {headers:{Authorization:"Bearer "+t}});
  if(!r.ok) throw new Error(`order download failed ${r.status} for ${w.name}`);
  return await r.json();
}
async function listId(){
  if(LISTID) return LISTID;
  const j=await graph(`/sites/${CFG.siteId}/lists?$select=displayName,id`);
  const l=(j.value||[]).find(x=>x.displayName===LIST);
  if(!l) throw new Error(`list ${LIST} not found`);
  return (LISTID=l.id);
}
/* ⭐⭐ EVERY WEEK'S DECISIONS, GROUPED BY `order_sunday` — one read, not one per
   week. ⛔ That field is the ONLY thing separating one week's decisions from
   another's: `purchase_drain.decisions()` filters on it, and the save path writes
   it plus a `Title` of `<sunday>:<sku>`. A row with no `order_sunday` belongs to
   no week and is skipped rather than leaking into the week on screen. */
async function loadAllSaved(){
  const id=await listId();
  let url=`/sites/${CFG.siteId}/lists/${id}/items?expand=fields&$top=500`, out={};
  while(url){
    const j=await graph(url);
    for(const it of j.value||[]){
      const f=it.fields||{};
      const w=f.order_sunday==null?"":String(f.order_sunday);
      if(!w||!f.sku) continue;
      (out[w]=out[w]||{})[f.sku]={...f,_id:it.id};
    }
    const n=j["@odata.nextLink"]; url=n?n.replace(GRAPH,""):null;
  }
  return out;
}
async function loadSaved(sunday){
  ALLSAVED=await loadAllSaved();
  return ALLSAVED[String(sunday)]||{};
}
const savedCount=k=>Object.keys(ALLSAVED[String(k)]||{}).length;

/* ── unsaved work ────────────────────────────────────────────────────────── */
/* ⛔⛔ `Object.keys(EDIT).length` IS NOT "UNSAVED". boot() deliberately seeds EDIT
   from SAVED so a reload does not look like the saved work vanished — so a buyer
   who saved 40 lines and refreshed has 40 EDIT entries with nothing pending. Using
   that count as the switch guard would warn EVERY time, and a warning that always
   fires is a warning nobody reads.
   ⭐ So this asks the only question that matters: would pressing Save change what
   the store holds? It recomputes exactly what the save path would write and
   compares it field for field.
   ⛔ IT FAILS TOWARD "UNSAVED" ON PURPOSE. No line, no stored row, an unparseable
   quantity — every one of those returns "pending", because the cost of one extra
   confirm dialog is a click and the cost of a missed one is a buyer's morning. */
/* ⛔⛔ ONE DEFINITION OF WHAT WOULD BE SAVED, used by BOTH `pendingFor` and the
   save path. They used to compute it twice, and the moment a third decision
   value existed ("added") the two copies disagreed: `pendingFor` would say
   "changed", the store would hold "added", and every added line would count as
   unsaved FOREVER — the switch-week confirm firing on every switch, which is the
   "warning that always fires is a warning nobody reads" failure this file
   already names once. */
function saveQtyFor(r,e){
  return e.decision==="remove" ? 0 : (e.qty!=null ? e.qty : (r.order_qty||0));
}
function decisionFor(r,e){
  if(e.decision==="remove") return "remove";
  /* ⭐ A HUMAN INTRODUCED THIS LINE. The engine proposed nothing, so calling it
     "changed" would be a change to nothing — and the scorecard could never tell
     an override apart from an addition. */
  if(r.added) return DECISION_ADDED;
  return saveQtyFor(r,e)!==(r.order_qty||0) ? "changed" : "keep";
}
/* ⛔ "added" may already be stored as "changed", because the save path falls back
   to it when the list rejects the new value (see DECISION_ADDED) — and the
   session that reads the row back may not be the one that did the fallback.
   Treating those as different would mark every added line unsaved forever. */
const decisionMatches=(stored,want)=>
  stored===want || (want==="added" && stored==="changed");
function pendingFor(sku){
  const e=EDIT[sku];
  if(!e) return false;
  const r=LINES.find(x=>x.sku===sku); if(!r) return true;
  const s=SAVED[sku]; if(!s) return true;
  const q=saveQtyFor(r,e);
  const dec=decisionFor(r,e);
  const unit=(e.order_unit&&e.order_unit!==(r.order_unit||'each'))?e.order_unit:"";
  const note=e.note!=null?String(e.note).slice(0,255):String(s.reviewer_note||"");
  return !(Number(s.approved_qty)===q
           && decisionMatches(String(s.decision||""),dec)
           && String(s.reviewer_note||"")===note
           && String(s.change_reasons||"")===reasonsOf(r).join(";").slice(0,255)
           && String(s.order_unit_override||"")===unit);
}
const unsavedSkus=()=>Object.keys(EDIT).filter(pendingFor);

/* ── the addable pool ────────────────────────────────────────────────────── */
/* ⛔ NOT `order_*.json`. `listWeeks()` treats every `order_*.json` in this folder
   as a published order week, so `order_candidates_<sunday>.json` would appear in
   the picker as a week named "candidates_2026-09-06" that loads a document with
   no `meta.order_sunday` at all. */
const candName=week=>`candidates_${week}.json`;
/* ⭐ Fetched ONCE per week, on first open of the add panel. ⛔ IT NEVER THROWS —
   a failed load must leave the panel able to SAY WHY, because a search box over
   an empty array answers "there is nothing to add", and that is false. */
async function loadCandidates(week, orderMeta){
  orderMeta=orderMeta||(ORDER&&ORDER.meta)||{};
  if(CAND_WEEK===week && CAND_STATE==="ready") return true;
  if(CAND_WEEK===week && CAND_STATE==="error") return false;
  CAND_WEEK=week; CAND_STATE="loading"; CAND_ERR=""; CAND_WARN="";
  try{
    const t=await getToken();
    const r=await fetch(
      `${GRAPH}/sites/${CFG.siteId}/drive/root:/${DIR}/${encodeURIComponent(candName(week))}:/content`,
      {headers:{Authorization:"Bearer "+t}});
    if(r.status===404)
      throw new Error(`no ${candName(week)} has been published for this week. `
        +`Re-publish it with: python3 scripts/publish_order.py `
        +`--order-dir output/orders/${week} --publish`);
    if(!r.ok) throw new Error(`download failed ${r.status}`);
    const doc=await r.json();
    const rows=(doc&&doc.rows)||[];
    /* ⛔⛔ THE FILE MUST BE THIS WEEK'S. The same trap the payload already guards:
       adding a line off another week's candidate list would put that week's
       cost, on-hand and pack data onto this week's order, and nothing downstream
       would ever disagree. */
    const got=(doc&&doc.meta&&doc.meta.order_sunday)||"";
    if(String(got)!==String(week))
      throw new Error(`${candName(week)} declares order week "${got}" inside it, `
        +`not ${week} — do not add lines from it`);
    if(!rows.length)
      throw new Error(`${candName(week)} is empty. That can only mean the engine `
        +`bought every SKU it considered, which has never happened — treat it as a `
        +`broken publish, not as "nothing to add"`);
    /* ⚠️ NON-FATAL, but say it: two files from different builds carry different
       on-hand and cost readings, so an added line's figures would be from another
       day than the line above it. */
    const mine=orderMeta.source_dir||"";
    const theirs=(doc.meta&&doc.meta.source_dir)||"";
    if(mine&&theirs&&mine!==theirs)
      CAND_WARN=`⚠️ this list was built from ${theirs} but the order on screen is `
        +`${mine} — stock and cost figures below may be from a different build.`;
    else if((doc.meta&&doc.meta.built_at)&&orderMeta.built_at
            && doc.meta.built_at!==orderMeta.built_at)
      CAND_WARN=`⚠️ built ${String(doc.meta.built_at).slice(0,16)}, while the order `
        +`on screen was built ${String(orderMeta.built_at).slice(0,16)}.`;
    CAND=doc; CAND_BY={};
    for(const c of rows) if(c&&c.sku) CAND_BY[String(c.sku)]=c;
    CAND_STATE="ready";
    return true;
  }catch(e){
    CAND=null; CAND_BY={}; CAND_ERR=e.message||String(e); CAND_STATE="error";
    return false;
  }
}
/* ── the KeHE catalogue we do not carry ──────────────────────────────────── */
/* ⛔ NOT `order_*.json`, for the same reason as the candidate file — see
   candName(). ⭐ Same shape of name so the two sidecars stay obviously related. */
const catName=week=>`catalog_${week}.json`;
/* ⭐ ONE NORMALISER FOR BOTH CODES. KeHE's own price row carries `ITEM_#` as
   `"00000276"` while the published catalogue stores it stripped as `"276"`, and
   a UPC is written with and without its leading zeros everywhere it appears.
   ⛔ So both sides of every comparison go through this — comparing the raw
   strings makes a buyer who pasted the padded form from KeHE Connect see
   "no such item" for an item we can order today. */
const codeKey=v=>String(v??"").replace(/\D+/g,"").replace(/^0+(?=\d)/,"");
/* ⭐ Does what they typed look like a code rather than a name? Then go to the
   catalogue even if the carried pool already matched something — a buyer typing
   an item number is asking about THAT item, not about a description that happens
   to contain the digits. */
const looksLikeCode=t=>/^\d{3,14}$/.test(String(t||"").replace(/[\s-]/g,""));
/* ⭐ Fetched ONCE per week, and only on demand. ⛔ IT NEVER THROWS — like
   loadCandidates, because a failed load must be able to SAY WHY. "No such item"
   and "we could not look" are different answers and a buyer cannot tell them
   apart from an empty result list. */
async function loadCatalog(week, orderMeta){
  orderMeta=orderMeta||(ORDER&&ORDER.meta)||{};
  if(CAT_WEEK===week && (CAT_STATE==="ready"||CAT_STATE==="loading"))
    return CAT_STATE==="ready";
  if(CAT_WEEK===week && CAT_STATE==="error") return false;
  CAT_WEEK=week; CAT_STATE="loading"; CAT_ERR=""; CAT_WARN="";
  try{
    const t=await getToken();
    const r=await fetch(
      `${GRAPH}/sites/${CFG.siteId}/drive/root:/${DIR}/${encodeURIComponent(catName(week))}:/content`,
      {headers:{Authorization:"Bearer "+t}});
    if(r.status===404)
      throw new Error(`no ${catName(week)} has been published for this week, so the `
        +`items we do NOT carry cannot be searched. Re-publish it with: python3 `
        +`scripts/publish_order.py --order-dir output/orders/${week} --publish`);
    if(!r.ok) throw new Error(`download failed ${r.status}`);
    const doc=await r.json();
    const cols=(doc&&doc.cols)||[], rows=(doc&&doc.rows)||[];
    /* ⛔⛔ THE FILE MUST BE THIS WEEK'S — the same guard the payload and the
       candidate pool already carry. Another week's catalogue is another price
       file's costs and pack sizes, and nothing downstream would disagree. */
    const got=(doc&&doc.meta&&doc.meta.order_sunday)||"";
    if(String(got)!==String(week))
      throw new Error(`${catName(week)} declares order week "${got}", not ${week} `
        +`— do not add lines from it`);
    if(!cols.length||!rows.length)
      throw new Error(`${catName(week)} has no rows or no column header — treat that `
        +`as a broken publish, not as "KeHE does not sell it"`);
    const mine=orderMeta.source_dir||"", theirs=(doc.meta&&doc.meta.source_dir)||"";
    if(mine&&theirs&&mine!==theirs)
      CAT_WARN=`⚠️ this catalogue was built from ${theirs} but the order on screen is `
        +`${mine} — costs and pack sizes below may be from a different price file.`;
    /* ⭐ POSITIONAL -> OBJECTS, once. The file is arrays plus a header on purpose
       (20,580 rows of repeated JSON keys is megabytes of nothing but field
       names); every consumer below wants named fields. */
    CAT_ROWS=rows.map(a=>{const o={};
      for(let i=0;i<cols.length;i++) o[cols[i]]=a[i];
      o._sku=CAT_PREFIX+String(o.item??"").trim();
      o._itemKey=codeKey(o.item); o._upcKey=codeKey(o.upc);
      return o;});
    CAT_BY={};
    for(const c of CAT_ROWS) CAT_BY[c._sku]=c;
    CAT=doc; CAT_STATE="ready";
    return true;
  }catch(e){
    CAT=null; CAT_ROWS=[]; CAT_BY={};
    CAT_ERR=e.message||String(e); CAT_STATE="error";
    return false;
  }
}
/* ⭐ Exact on either code, substring on the description or brand. ⛔ The code
   match is EXACT on purpose: a substring match on a 12-digit UPC returns items
   that merely share a run of digits, and a buyer keying a code is entitled to
   read a single hit as confirmation. */
function catMatch(c,q,key){
  if(!q) return false;
  if(key && (c._itemKey===key || c._upcKey===key)) return true;
  return (c.description||"").toLowerCase().includes(q)
      || (c.brand||"").toLowerCase().includes(q);
}
/* ⭐ WHAT WE EXPECT TO PAY. ⛔ `reg_whlsl` — the REGULAR cost — never `net`.
   A published promo net is not a price we can buy at (canon:
   `Recipe Kit Tool/SUPPLIER-COST-FILES.md`), and understating the cost of a
   line nobody has ever bought is the direction that hides a bad buy. KeHE
   restates the real price on the download, which is where a gap gets caught. */
const catCost=c=>Number(c.reg_whlsl||c.net||0);
/* ⭐⭐ A CATALOGUE ITEM BECOMES A REAL LINE — and every figure it does not have
   is left NULL rather than zeroed. ⛔ A zero here is a lie the rest of the page
   believes: `posStrip` renders 0 on-hand as a fact, `riskOf` would read a
   0-week cover as "ok", and the sell-through line would print a confident date.
   ⛔ `unit_of_sale`, falling back to 1 — NEVER `casepack` (incOf()). */
function rowFromCatalog(c){
  const size=[c.size,c.uom].filter(Boolean).join(" ").trim();
  return {sku:c._sku, upc:c.upc||"",
    description:(c.description||c._sku)+(size?` - ${size}`:""),
    brand:c.brand||"", category:"",
    order_qty:0, engine_qty:0, source:ADDED_SOURCE,
    flags:["added_by_hand","not_carried"],
    unit_cost:catCost(c), supplier_price:catCost(c), reg_whlsl:c.reg_whlsl??null,
    item_price:c.srp??null,
    unit_of_sale:c.unit_of_sale||1, casepack:c.casepack||null,
    /* ⛔ NOT ZERO — UNKNOWN. We hold no Finale record for this item at all, so
       there is nothing to say about stock, demand or dating. */
    on_hand:null, inbound:null, pre_window:null,
    q75_wk:null, mean_wk:null, shelf_days:null, on_hand_effective:null,
    order_unit:'each', units_per_order_unit:1,
    order_unit_basis:"KeHE unit of sale — we hold no Finale pack data for this item",
    kehe_item:String(c.item??"").trim(),
    promo_start:c.promo_start||"", promo_end:c.promo_end||"",
    why:"",
    explain:"⛔ WE DO NOT CARRY THIS ITEM. It has no Finale SKU, no sales history, "
      +"no on-hand and no best-by, so nothing on this page can tell you whether the "
      +"quantity is right — you are sizing it blind. ⭐ It CAN be ordered from KeHE: "
      +"the export keys on the UPC and the item number. ⛔ But the PO cannot be "
      +"imported back into Finale until ProductPipeline creates the product, so "
      +"receiving it needs that done first. ⭐ This panel is for a ONE-OFF buy; if we "
      +"mean to CARRY it, it belongs in the new-item review (newitem_week.py), which "
      +"creates the product, the store channels and the Finale row.",
    added:true, notCarried:true};
}
/* ⭐ A CANDIDATE BECOMES A REAL LINE. ⛔ Every field the row machinery reads is
   filled here — `posStrip` needs on_hand/inbound/pre_window/q75_wk/shelf_days,
   `unitCost` needs the cost chain, `packOf`/`unitLabel` need order_unit and
   units_per_order_unit, `applyQty` needs unit_of_sale. A row missing any of them
   does not error; it renders a confident wrong figure, which is worse. */
function rowFromCandidate(c){
  return {sku:c.sku, upc:c.upc||"", description:c.description||"",
    brand:c.brand||"", category:c.category||"",
    /* ⛔ THE ENGINE PROPOSED NOTHING. Both of these are 0 on purpose: `order_qty`
       is what `qtyOf`/`touched`/`reviewState` measure a human's number against,
       and `engine_qty` is what the save path records as the model's proposal. */
    order_qty:0, engine_qty:0,
    source:ADDED_SOURCE,
    /* ⭐ the engine's own flags travel with the row — "covered",
       "dnr_no_auto_reorder" and the rest are exactly what the buyer is choosing
       to disagree with — plus a marker of our own. */
    flags:(c.flags||[]).concat(["added_by_hand"]),
    unit_cost:c.unit_cost, supplier_price:c.supplier_price,
    promo_cost:c.promo_cost, reg_whlsl:c.reg_whlsl, item_price:c.item_price,
    unit_of_sale:c.unit_of_sale, casepack:c.casepack,
    on_hand:c.on_hand, inbound:c.inbound, pre_window:c.pre_window,
    q75_wk:c.q75_wk, mean_wk:c.mean_wk, shelf_days:c.shelf_days,
    order_unit:c.order_unit||'each',
    units_per_order_unit:c.units_per_order_unit||1,
    order_unit_basis:c.order_unit_basis||"",
    kehe_item:c.kehe_item||"",
    why:c.why_not||"",
    explain:"⭐ You added this line — the engine did not propose it."
      +(c.why_not?" It left the item off the order because: "+c.why_not:"")
      +" ⛔ Nothing sized this quantity but you, so the cover bar above is the only"
      +" check on it.",
    added:true};
}
/* ⭐ The order increment. ⛔ `unit_of_sale`, falling back to 1 — NEVER `casepack`.
   `CASEPACK` is the MASTER case and is an exact multiple of `UNIT_OF_SALE`
   (verified n=21,984, 0 exceptions), so rounding on it over-orders by that
   multiple: GoMacro bars are 144/12 and a one-off script once asked for 144
   against a need of 12. ⛔ And `unit_of_sale || casepack` is the same bug wearing
   a fallback — it picks the LARGER increment exactly when we know least. */
const incOf=r=>Number(r.unit_of_sale)>0?Number(r.unit_of_sale):1;

/* ⛔⛔ AN ADDED LINE MUST SURVIVE A RELOAD, AND THE OLD CODE WOULD HAVE DROPPED
   IT SILENTLY. `switchWeek` replays SAVED onto LINES with
   `LINES.find(...); if(!r) continue;` — and an added SKU is by definition NOT in
   the payload, so its saved decision would be skipped. The decision would still
   be in SharePoint and `purchase_drain.py` would still order it, so the ORDER
   would be right while the SCREEN said the line had vanished: the buyer adds it
   again, and now two people believe two different things about the same order.
   ⭐ So: any saved SKU with no payload row is reinstated, from the candidate file
   where it can be reached and from the stored fields where it cannot.
   ⛔ NEVER THROWS — a failed candidate load must not stop the week from opening.
   Returns the extra rows; sets ADD_NOTE when the reinstatement was partial. */
async function reinstateAdded(rows, saved, week, orderMeta){
  ADD_NOTE="";
  const have=new Set(rows.map(r=>String(r.sku)));
  const orphan=Object.keys(saved).filter(s=>!have.has(String(s)));
  if(!orphan.length) return [];
  let ok=false;
  try{ ok=await loadCandidates(week, orderMeta); }catch(_){ ok=false; }
  /* ⛔ THE CATALOGUE IS FETCHED HERE ONLY WHEN A SAVED LINE ACTUALLY NEEDS IT.
     It is 2.4 MB, so pulling it on every week-open would be exactly the cost the
     lazy load exists to avoid — but a reviewer who added an item we do not carry
     must get that row back with its figures, not the stub. */
  let catOk=false;
  if(orphan.some(s=>String(s).startsWith(CAT_PREFIX))){
    try{ catOk=await loadCatalog(week, orderMeta); }catch(_){ catOk=false; }
  }
  const out=[], partial=[];
  for(const sku of orphan){
    if(catOk && String(sku).startsWith(CAT_PREFIX) && CAT_BY[String(sku)]){
      out.push(rowFromCatalog(CAT_BY[String(sku)])); continue;
    }
    const c=ok?CAND_BY[String(sku)]:null;
    if(c){ out.push(rowFromCandidate(c)); continue; }
    /* ⛔ REINSTATED FROM THE DECISION ROW ALONE. The store keeps on_hand, inbound
       and shelf_days but NOT the sales rate, the pack ratio or the order
       increment — so this row's cover CANNOT be computed and must not pretend
       otherwise. `posStrip` already renders a missing rate as "no sales rate —
       cover cannot be computed" rather than drawing a bar, which is the honest
       output here. */
    const f=saved[sku]||{};
    partial.push(sku);
    /* ⭐ A CATALOGUE LINE'S ITEM NUMBER IS IN ITS OWN KEY, so even the stub can
       still reach a KeHE PO — `purchase_drain.py` reads it back out of the sku.
       ⛔ That is the whole reason the synthetic sku is `KEHE-<item>` and not a
       random id: a decision row carries no column for it. */
    const cat=String(sku).startsWith(CAT_PREFIX);
    out.push({sku:String(sku), upc:f.upc||"", description:f.item||String(sku),
      brand:f.brand||"", order_qty:0, engine_qty:0, source:ADDED_SOURCE,
      kehe_item:cat?String(sku).slice(CAT_PREFIX.length):"",
      notCarried:cat,
      flags:["added_by_hand","partial_record"].concat(cat?["not_carried"]:[]),
      unit_cost:Number(f.unit_cost)||0,
      on_hand:f.on_hand??null, inbound:f.inbound??null, pre_window:null,
      q75_wk:null, mean_wk:null, shelf_days:f.shelf_days??null,
      order_unit:'each', units_per_order_unit:1, unit_of_sale:1,
      why:f.why||"",
      explain:"⛔ This line was added by hand in an earlier session and the "
        +"candidate list for this week could not be read, so only what was saved "
        +"with the decision is shown. Its sales rate, shelf life and order "
        +"increment are NOT known here — do not judge the quantity from this row.",
      added:true, partial:true});
  }
  if(partial.length){
    /* ⛔ NAME THE FILE THAT ACTUALLY FAILED. A catalogue line stubs out because
       `catalog_<sunday>.json` could not be read or does not list that item — the
       candidate pool has nothing to do with it, and blaming it sends whoever
       investigates to the wrong file. */
    const nc=partial.filter(s=>String(s).startsWith(CAT_PREFIX));
    const err = nc.length===partial.length
      ? `the KeHE catalogue for this week could not be read, or no longer lists `
        +`them${CAT_ERR?": "+esc(CAT_ERR):""}`
      : `the candidate list${nc.length?" or the KeHE catalogue":""} for this week `
        +`could not be read${CAND_ERR?": "+esc(CAND_ERR):""}`;
    ADD_NOTE=`⛔ ${partial.length} line(s) added by hand earlier could only be `
      +`partly reinstated (${esc(partial.slice(0,6).join(", "))}`
      +`${partial.length>6?", …":""}) — ${err}. Their quantities are intact and `
      +`will still be ordered; only the figures beside them are missing.`;
  }
  return out;
}

/* ── the week switcher ───────────────────────────────────────────────────── */
/* ⭐ WHICH WEEK DO WE OPEN? ⛔ NOT simply "the newest". A publish must never move
   someone mid-review, so a week that already has decisions in it outranks a week
   that has none, however new. And an explicit choice made in this browser session
   outranks both — being returned to another week by a reload is the same failure
   wearing a different hat. */
function pickWeek(){
  let mem=null; try{ mem=sessionStorage.getItem(WEEK_MEM); }catch(_){}
  if(mem && WEEKS.some(w=>w.key===mem))
    return {key:mem, reason:"the week you chose earlier in this session"};
  const withWork=WEEKS.filter(w=>savedCount(w.key)>0);
  if(withWork.length)
    return {key:withWork[0].key, reason:"the newest week that already has saved decisions"};
  return {key:WEEKS[0].key, reason:"the newest published week — none has decisions yet"};
}
/* ⛔ Rebuilt only when the week set, the selection or the decision counts change —
   never on render(). Repainting a <select> the user has open closes it. */
function paintWeeks(){
  const sel=document.getElementById("week"); if(!sel) return;
  sel.innerHTML=WEEKS.map((w,i)=>{
    const n=savedCount(w.key);
    return `<option value="${escAttr(w.key)}">${esc(w.key)}`
      + (i===0?" · newest":"")
      + ` — ${n?`${n} decision${n===1?"":"s"} saved`:"no decisions yet"}</option>`;
  }).join("");
  if(WEEK!=null) sel.value=WEEK;
}
/* ⭐ The badge, the note and the footer copy all say the SAME week, and they take
   it from `ORDER.meta.order_sunday` — the value the save path stamps on every row
   and `purchase_drain.py` filters on. ⛔ Not from the filename: if those two ever
   disagree the file is not what it claims, and render() says so in red. */
function paintWeekHeader(){
  const sunday=(ORDER&&ORDER.meta&&ORDER.meta.order_sunday)||WEEK||"—";
  const stale=!!(WEEKS.length&&WEEK!=null&&WEEKS[0].key!==WEEK);
  const b=document.getElementById("weeknow");
  if(b){ b.textContent="week of "+sunday; b.classList.toggle("stale",stale); }
  const f=document.getElementById("footweek");
  if(f){ f.textContent="week of "+sunday; f.classList.toggle("stale",stale); }
  const n=document.getElementById("weeknote");
  if(n) n.innerHTML = stale
    ? `⚠️ a newer order week (<b>${esc(WEEKS[0].key)}</b>) has been published — you are `
      + `NOT editing it. ${esc(WEEK_REASON)}.`
    : (WEEKS.length>1?`${WEEKS.length} weeks published · ${esc(WEEK_REASON)}.`
                     :`${esc(WEEK_REASON)}.`);
}
/* ⛔⛔ NOTHING IS COMMITTED UNTIL BOTH READS SUCCEED. Clearing the state first and
   loading after would leave week A's lines on screen under week B's heading if the
   download failed — which is precisely the "editing A while believing it is B"
   state this whole feature exists to make impossible. */
async function switchWeek(key, opts){
  opts=opts||{};
  const w=WEEKS.find(x=>x.key===key);
  if(!w) throw new Error(`no published order for ${key}`);
  const sel=document.getElementById("week"), st=document.getElementById("status");
  SWITCHING=true; if(sel) sel.disabled=true;
  if(st) st.textContent=`loading week ${key}…`;
  try{
    const doc=await loadOrder(w);
    const sunday=(doc.meta&&doc.meta.order_sunday)||key;
    const saved=opts.cached ? (ALLSAVED[String(sunday)]||{}) : await loadSaved(sunday);
    const rows=doc.rows||[];
    /* ⭐ lines a human ADDED in an earlier session are not in the payload — put
       them back before anything is committed. ⛔ Best-effort by construction: it
       never throws, so a candidate file that cannot be read costs the figures
       beside those rows, never the week. */
    const extra=await reinstateAdded(rows, saved, sunday, doc.meta||{});
    ORDER=doc; LINES=rows.concat(extra); SAVED=saved; EDIT={}; WEEK=key;
    WEEK_REASON=opts.reason||WEEK_REASON;
    FILTER="all"; RISK=false; UNK=false; ONLYCH=false; NEWONLY=false;
    LOSS=false; REVW=false;
    /* ⛔ THE ADD PANEL BELONGS TO ONE WEEK. Left loaded across a switch, the next
       search would offer week A's costs and stock levels for a line added to
       week B — and every figure would look perfectly ordinary. */
    closeAdd(); ADDQ="";
    if(CAND_WEEK!==sunday){ CAND=null; CAND_BY={}; CAND_STATE="idle"; CAND_ERR=""; CAND_WARN=""; }
    if(CAT_WEEK!==sunday){ CAT=null; CAT_ROWS=[]; CAT_BY={}; CAT_STATE="idle";
                           CAT_ERR=""; CAT_WARN=""; }
    try{ sessionStorage.setItem(WEEK_MEM,key); }catch(_){}
    /* ⭐ a saved change is the state of the world — reapply it so opening a week
       does not silently discard work someone already did. */
    for(const [sku,f] of Object.entries(SAVED)){
      const r=LINES.find(x=>x.sku===sku); if(!r) continue;
      if(f.decision==="remove") EDIT[sku]={decision:"remove"};
      else if(f.approved_qty!=null && Number(f.approved_qty)!==(r.order_qty||0))
        EDIT[sku]={qty:Number(f.approved_qty)};
    }
    const m=ORDER.meta;
    document.getElementById("sub").textContent=
      `order ${m.order_sunday} · ${m.lines_buying} lines to buy of `
      +`${(m.lines_considered||0).toLocaleString()} considered · built ${(m.built_at||"").slice(0,16)}`
      +` · signed in as ${account}`;
    paintWeeks(); paintWeekHeader(); render();
    if(st) st.textContent = opts.boot
      ? (Object.keys(EDIT).length?`restored ${Object.keys(EDIT).length} saved change(s)`:"")
      : `now reviewing week ${m.order_sunday} · ${savedCount(m.order_sunday)} decision(s) already saved`;
  } finally {
    SWITCHING=false;
    const s2=document.getElementById("week"); if(s2) s2.disabled=false;
  }
}
/* ⛔ Wired ONCE, outside every repaint — the same rule as #q and #sort. */
(function wireWeek(){
  const sel=document.getElementById("week");
  if(!sel) return;
  sel.onchange=async()=>{
    const want=sel.value;
    if(SWITCHING||want==null||want===WEEK){ if(WEEK!=null) sel.value=WEEK; return; }
    const u=unsavedSkus();
    /* ⛔⛔ LOSING A BUYER'S UNSAVED WORK IS THE WORST OUTCOME ON THIS PAGE. Nothing
       here is written until Save, so a switch discards it — say so in those words,
       name both weeks and the count, and default to NOT switching. */
    if(u.length && !confirm(
        `⛔ ${u.length} change(s) on week ${WEEK} are NOT saved.\n\n`
        +`Nothing on this page is kept until you press Save, so opening week ${want} `
        +`DISCARDS them.\n\nDiscard ${u.length} unsaved change(s) and open week ${want}?`)){
      /* ⛔ The control must never show a week we are not actually on. */
      sel.value=WEEK; return;
    }
    try{ await switchWeek(want,{reason:"you chose this week by hand"}); }
    catch(e){
      if(WEEK!=null) sel.value=WEEK;         // the old week is still loaded — say so
      document.getElementById("status").textContent=
        `⛔ could not open week ${want}: ${e.message} — still on week ${WEEK}`;
    }
  };
})();
/* ⛔ The other way unsaved work disappears: a reload or a closed tab. Same test, so
   it cannot fire on a page whose edits are all already in SharePoint. */
window.addEventListener("beforeunload",e=>{
  if(!unsavedSkus().length) return;
  e.preventDefault(); e.returnValue="";
});

/* ── the numbers a buyer is actually deciding on ─────────────────────────── */
/* ⛔⛔ THE CHAIN IS promo_cost -> supplier_price -> reg_whlsl, in that order, and it
   must match order_engine's `order_value` and write_kehe_xlsx. `reg_whlsl` is the
   KeHE CASE price on a bulk line: reading it second valued popcorn at $31.97 a
   unit instead of $1.07 and put the order total 29% above the engine's own
   figure. ⭐ The publisher now resolves it server-side into `unit_cost`; this
   falls back to the same chain so the page cannot drift from it. */
const unitCost=r=>Number(r.unit_cost ?? (r.promo_cost||r.supplier_price||r.reg_whlsl||0));
/* ⛔⛔ THE SCREEN MUST READ **EDIT → SAVED → ENGINE**, in that order.
   Reading only EDIT meant that pressing Save (which clears EDIT) snapped every
   line back to the engine's number and Finalize then exported the ENGINE's order
   — so following the page's own "save first, then finalize" instruction produced
   the wrong order. Found by a test agent, 2026-09-05. This is real money. */
function qtyOf(r){
  const e=EDIT[r.sku];
  if(e){ if(e.decision==="remove") return 0; if(e.qty!=null) return e.qty; }
  const s=SAVED[r.sku];
  if(s){ if(s.decision==="remove") return 0;
         if(s.approved_qty!=null&&s.approved_qty!=="") return Number(s.approved_qty); }
  return r.order_qty||0;
}
function stateOf(r){
  const e=EDIT[r.sku];
  if(e&&e.decision) return e.decision;
  if(e) return "keep";                       // an explicit edit un-removes
  const s=SAVED[r.sku];
  if(s&&s.decision==="remove") return "remove";
  return "keep";
}
/* ⭐ has a human touched this line at all — saved or pending? */
function touched(r){
  const e=EDIT[r.sku], s=SAVED[r.sku];
  /* ⛔ THE PRESENCE OF AN EDIT IS NOT A CHANGE (fixed 2026-09-05, found by
     driving the real page). This read `if(e) return true`, so the new "✓ mark
     reviewed" button — which writes `{ack:true}` and deliberately leaves the
     quantity alone — painted the line as CHANGED: accent rail, a "changed from
     24" tag, and a note box demanding to know why they changed it. The buyer had
     just agreed with the engine. ⭐ A change is a QUANTITY edit, a removal or a
     note — never the mere existence of a record.
     ⚠️ The earlier fix this must not undo (BUG 3): an edit whose snapped value
     equals the engine's still carries `qty`, so it stays "touched" and Save
     stays enabled — the case where a silent no-op looked like a lost edit. */
  if(e && (e.qty!=null || e.decision || e.note)) return true;
  return !!(s && (s.decision==="remove" || (s.approved_qty!=null &&
            Number(s.approved_qty)!==(r.order_qty||0))));
}
/* ⭐⭐ HAS THIS LINE BEEN LOOKED AT? — added 2026-09-05 (PM-527).
   ⛔ `touched()` answers "did the quantity move", which is NOT the same question.
   On a 282-line order the buyer's real problem is "where did I get to" — and a
   line they read and agreed with was indistinguishable from one they never
   opened. Both rendered identically, so the only way to resume was to start
   again.
   ⭐ NO NEW SHAREPOINT COLUMN. `decision` is already one of remove/changed/keep,
   so "I looked and I agree" is just a saved `keep` at the engine's quantity —
   which the save path already writes. ⛔ That matters: an array or an unknown
   field sent to this list is a bare HTTP 400 that loses the whole submit. */
function reviewState(r){
  if(stateOf(r)==="remove") return "removed";
  if(qtyOf(r)!==(r.order_qty||0)) return "changed";
  const e=EDIT[r.sku];
  if(e && e.ack===false) return "new";          // explicitly un-marked
  if((e && e.ack) || SAVED[r.sku]) return "ok"; // a saved row IS a decision
  return "new";
}
const reviewed=r=>reviewState(r)!=="new";

/* ⭐⭐ BUG 5 — COVER AND DATING RISK MUST FOLLOW THE QUANTITY ON SCREEN. Frozen at
   the engine's figure, the buyer could not tell whether they had fixed the very
   thing the red banner was shouting about. */
function coverOf(r){
  const rate=r.q75_wk||r.mean_wk||0;
  if(!rate) return null;
  return Math.round(arrivingOf(r)/rate*10)/10;   // ⛔ units that ARRIVE, not order units
}
/* ⭐⭐ HOW LONG THE POSITION LASTS — stock + inbound + what we are ordering,
   against this SKU's own weekly rate. ⛔ THIS, NOT `coverOf`, IS THE DATING TEST
   (ruling: Jack, 2026-09-06 — "yes, move the chip onto the position").
   ⛔ `coverOf` measures the ORDER ALONE, which answers a different question and
   answers the dating one too quietly: on the 2026-09-06 build 17 lines got a
   different verdict and the order-only measure was the QUIETER one every single
   time. Buying 24 of something that sells 41/wk is 0.6 weeks of order — but if we
   already hold 110, the pile is 3.3 weeks and it is the PILE that dates out.
   ⭐ ONE DEFINITION, used by the risk chip, the strip and the sort, so the page
   can never show a bar disagreeing with the flag beside it. */
function positionCoverOf(r){
  const rate=r.q75_wk||r.mean_wk||0;
  if(!rate) return null;
  const pos=(+r.on_hand||0)+(+r.inbound||0)+arrivingOf(r);  // ⛔ see arrivingOf
  return Math.round(pos/rate*10)/10;
}
/* ⛔⛔ COVER-VS-LIFE IS THE WRONG TEST FOR SOME LINE TYPES, and applying it
   anyway produces a confident false accusation. Corrected 2026-09-05 after Jack
   pushed back on a finding of mine: several "over its life" lines were nothing of
   the kind, because their demand basis is NOT the shelf sales rate.
     promo_probe   — a deliberate bounded buy; its own `why` carries the estimate
                     it was sized from (one probe read "6u = p90 of 8 observed
                     weeks 1.0/wk x 1.50 lift" while q75_wk was 0.0)
     min_presence  — we keep one on the shelf on purpose; velocity is not the point
     seasonal      — sized on the SEASONAL profile, never the annual mean
     recipe_kit    — kit demand is ADDITIVE and does not appear in the sales rate
   ⭐ These are reported as "different basis", never as risk. */
/* ⭐⭐ WHAT UNIT ARE WE ORDERING IN? (Jack, 2026-09-06.) A buyer looking at "1"
   cannot tell one popcorn bag from one 50 lb sack we break down and sell as
   fifty. Both are real lines on the same order, they price differently, and
   getting it wrong is a 50x error. The engine knows; it just never said so.
   ⛔ The OPERATOR may override it — `order_unit_override` — because the engine's
   pack data can be wrong and the person holding the invoice is the authority.
   The override is RECORDED, not silently applied. */
function unitOf(r){
  const e=EDIT[r.sku], s=SAVED[r.sku];
  return (e&&e.order_unit) || (s&&s.order_unit_override) || r.order_unit || 'each';
}
function perOrderUnit(r){
  return unitOf(r)==='case' ? (Number(r.units_per_order_unit)||1) : 1;
}
/* -> {cases, units} for the CURRENT quantity on screen, honouring an override. */
function packOf(r){
  const per=perOrderUnit(r), need=qtyOf(r);
  if(per<=1) return {cases:null, units:need, per:1};
  const cases=Math.ceil(need/per)||0;
  return {cases, units:cases*per, per};
}
/* ⭐⭐ HOW MANY UNITS ACTUALLY ARRIVE — the number the SHELF sees, not the number
   the buyer typed. (Jack, 2026-09-06: *"ordering 1 case adds 50 units and it needs
   to render differently"*.)
   ⛔⛔ THE QUANTITY BOX IS IN OUR SELLING UNITS; A BULK LINE SHIPS BY THE CASE, so
   asking for 9 chia seeds delivers a case of 50. Every PHYSICAL question — how
   long the position lasts, when it sells out, whether it dates out — must be
   asked of the 50, and every one of them was being asked of the 9. It read as a
   page arguing with itself: the strip said 1.2 weeks of cover while the engine's
   own sentence two lines below said eleven.
   ⛔ It is NOT the same as `qtyOf`, which stays in our units because that is what
   `approved_qty` means to the engine and to `kehe_order.finalize`. Only 2 lines
   on the 2026-09-06 order have a case pack, and both were wrong on every
   physical figure. */
function arrivingOf(r){ return packOf(r).units; }
/* ⭐⭐ WHAT THE LINE COSTS — the units that ARRIVE at the price of the unit they
   arrive in. ⛔ `qtyOf(r) * unitCost(r)` is wrong on a bulk line in BOTH factors
   at once, and the two errors do not cancel: it read 1 x $4.548 = $4.55 for a
   case the invoice charges $76.00 for. ⭐ `unit_cost` is the KeHE case price
   divided by Finale's own proven pack ratio (`publish_order._unit_cost`, ruling:
   Jack 2026-09-06 — *"it should be priced by the case based on the KEHE price
   file… if Finale doesn't show correct price"*), so arriving x unit_cost
   reproduces the case price exactly: 50 x $1.4578 = $72.89 and 20 x $3.80 =
   $76.00, both matching what `kehe_order.finalize` puts on the order. */
function lineCost(r){ return arrivingOf(r)*unitCost(r); }
/* ⭐ The one line a buyer reads to know what arrives. ⛔ Never just a number. */
/* ⭐ WHAT AM I ACTUALLY COMMITTING TO? (Jack, 2026-09-06.) The add panel offered
   a bare "12" with nothing saying whether that is a case, a minimum or a default,
   and the order lines carried no UPC at all — the code KeHE and the warehouse
   both identify an item by.
   ⭐ THE SMALLEST THING KEHE WILL SHIP, said in words. ⛔ Reads `unit_of_sale`
   and falls back to 1 — NEVER `casepack`, which is the master case and is a
   documented past over-order. When our selling unit differs from KeHE's (a bulk
   repack), it says so, because "12" means something different on those lines. */
function buyInLabel(r){
  const inc=Math.max(1, +(r&&r.unit_of_sale)||1);
  const per=perOrderUnit(r);
  if(inc<=1 && per<=1) return "1 unit";
  const base=`${inc} unit${inc===1?"":"s"}`;
  if(per>1) return `${base} <b>(1 case = ${per})</b>`;
  return base;
}
function unitLabel(r){
  const p=packOf(r);
  if(p.per<=1) return `${p.units} unit${p.units===1?'':'s'}`;
  return `${p.cases} case${p.cases===1?'':'s'} <b>(${p.units} units)</b>`;
}
/* ⭐⭐ WHY DID YOU CHANGE IT? (Jack, 2026-09-06: *"they could click some tags of
   common reasons of why they changed it, or write in some comments on each line
   item for what they changed and why, so that every line item itself has a spot
   to know what they did different."*)
   ⛔ THE POINT IS GROUPING, NOT RECORD-KEEPING. Free text cannot be grouped, and
   grouping is what turns a week of operator edits into a model correction —
   "11 lines cut for 'already have enough'" is a cover-model finding; eleven
   sentences are not. The free-text box stays for everything the tags miss.
   ⭐ The vocabulary is taken from the reasons Julia actually gave in operator
   feedback #1-#14, not invented: cover, dating, promo, kit, reservations,
   seasonality, assortment, and the two data faults she kept hitting. */
const REASONS=[
  ["cover",      "already have enough"],
  ["dating",     "will date out before it sells"],
  ["promo",      "on promo — worth going deeper"],
  ["promo_off",  "promo I know about that the engine cannot see"],
  ["reserved",   "covering a customer reservation"],
  ["kit",        "recipe kit needs it"],
  ["seasonal",   "season is turning"],
  ["assortment", "not carrying this any more"],
  ["short",      "vendor cannot supply it"],
  ["data_cost",  "⛔ the cost looks wrong"],
  ["data_pack",  "⛔ the pack size looks wrong"],
  ["data_stock", "⛔ the on-hand looks wrong"],
];
function reasonsOf(r){
  const e=EDIT[r.sku], s=SAVED[r.sku];
  const raw=(e&&e.reasons!=null) ? e.reasons
          : ((s&&s.change_reasons) || "");
  return String(raw).split(";").map(x=>x.trim()).filter(Boolean);
}
const NOT_VELOCITY=/promo_probe|min_presence|seasonal|recipe_kit/;
function riskOf(r){
  /* ⛔ THE EXEMPTION IS THE ENGINE'S, NOT THE FLAG'S. "sized on a different
     basis" means the ENGINE chose that quantity from something other than the
     shelf rate. A line a human added carries the engine's old flags for
     information, but nothing sized it except the person typing — so cover
     against shelf life is exactly the right test, and letting an inherited
     `promo_probe` flag suppress the dating verdict would silence the only check
     an added line has. */
  if(!r.added && NOT_VELOCITY.test((r.flags||[]).join(" "))) return "basis";
  const sd=r.shelf_days, c=positionCoverOf(r);
  if(!sd||c==null) return "unknown";          // ⛔ unknown is NOT "ok"
  if(qtyOf(r)<=0) return "ok";
  return c*7>sd ? "⛔ over its life" : c*7>sd*0.7 ? "⚠️ tight" : "ok";
}
function totals(){
  // ⛔ BUG 8 — a zero quantity IS a removal. Exporting a 0-qty line put a $0.00
  // unit cost into the CSV, which `kehe_order.py finalize` is documented to refuse.
  const live=LINES.filter(r=>stateOf(r)!=="remove" && qtyOf(r)>0);
  const units=live.reduce((n,r)=>n+arrivingOf(r),0);
  const cost=live.reduce((n,r)=>n+lineCost(r),0);
  const changed=LINES.filter(touched).length;
  /* ⛔⛔ "UNSAVED" IS NOT `Object.keys(EDIT).length` (corrected 2026-09-06). boot()
     and switchWeek() SEED EDIT from what is already stored, so a buyer who saved
     40 lines and refreshed was told "40 unsaved" with nothing whatever pending —
     and the finalize dialog warned them about work that was safely in SharePoint.
     ⭐ A count nobody can act on is worse than no count: it teaches people to click
     past the one warning that matters.
     ⛔ This does NOT gate the Save button, which stays enabled whenever any edit
     exists. A redundant re-save costs a round trip; a Save button wrongly disabled
     costs the work. */
  const pending=unsavedSkus().length;
  return {lines:live.length, units, cost, changed, pending,
          removed:LINES.length-live.length};
}

/* ⭐ THE TIER TARGET. Jack's standing correction: there is NO per-order floor —
   the goal is raising the AVERAGE order toward ~$9,000 for a better discount
   rung. ⛔ So this is shown as CONTEXT, never as a bar to clear. */
const TIER_TARGET=9000;
function paintTotals(){
  const t=totals();
  const pct=Math.min(100, t.cost/TIER_TARGET*100);
  document.getElementById("totals").innerHTML=
    `<div class="tot"><b>${t.lines}</b><span>lines</span></div>
     <div class="tot"><b>${t.units.toLocaleString()}</b><span>units</span></div>
     <div class="tot"><b>${money0(t.cost)}</b><span>at cost</span></div>
     ${t.changed?`<div class="tot"><b>${t.changed}</b><span>changed</span></div>`:""}
     ${t.removed?`<div class="tot"><b>${t.removed}</b><span>removed</span></div>`:""}
     <div class="bar" title="context only — there is no per-order minimum"><i style="width:${pct}%"></i></div>
     <span class="mut small">${money0(t.cost)} of the ~${money0(TIER_TARGET)} average
       we are working toward &mdash; context, not a floor</span>`;
  document.getElementById("tally").textContent=
    `${t.lines} lines · ${t.units.toLocaleString()} units · ${money0(t.cost)}`
    + (t.pending?` · ${t.pending} unsaved`:"");
  /* ⭐ "how much am I spending on promo this week" was unanswerable — the footer
     always showed the whole order however you filtered. */
  const st=document.getElementById("subtot");
  if(st){
    const v=visible().filter(r=>stateOf(r)!=="remove"&&qtyOf(r)>0);
    st.textContent = (FILTER==="all"&&!RISK&&!UNK&&!ONLYCH&&!NEWONLY&&!Q) ? "" :
      `this view: ${v.length} lines · ${v.reduce((n,r)=>n+arrivingOf(r),0).toLocaleString()} units · `
      + money0(v.reduce((n,r)=>n+lineCost(r),0));
  }
  /* ⭐ WHERE DID I GET TO — the question a 282-line order actually raises. */
  const pg=document.getElementById("progress");
  if(pg){
    const done=LINES.filter(reviewed).length;
    pg.textContent=`${done} of ${LINES.length} reviewed`;
    pg.style.color = done===LINES.length ? "var(--good)" : "";
  }
  const dirty=Object.keys(EDIT).length>0;
  document.getElementById("save").disabled=!dirty;
  document.getElementById("final").disabled=false;
}

/* ── filters ─────────────────────────────────────────────────────────────── */
function sources(){ const c={};
  for(const r of LINES) c[r.source]=(c[r.source]||0)+1; return c; }
function paintFilters(){
  const c=sources();
  const risky=LINES.filter(r=>{const x=riskOf(r);return x==="⛔ over its life"||x==="⚠️ tight";}).length;
  const unknown=LINES.filter(r=>riskOf(r)==="unknown").length;
  /* ⛔⛔ THE SEARCH INPUT IS NOT REBUILT HERE. paintFilters() runs on every
     render, render() runs on the search debounce — so rebuilding #q destroyed the
     focused input mid-word and sent the rest of the typing to the page body,
     where a space toggled a <details> open. The box lives OUTSIDE the repainted
     region and is wired once. Found by a test agent, 2026-09-05. */
  document.getElementById("filters").innerHTML=
    `<span class="chip" data-f="all" aria-pressed="${FILTER==="all"}">All<span class="n">${LINES.length}</span></span>`
    + Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
      `<span class="chip" data-f="${escAttr(k)}" aria-pressed="${FILTER===k}">${esc(k)}<span class="n">${v}</span></span>`).join("")
    + (risky?`<span class="chip" id="riskchip" aria-pressed="${RISK}" style="border-color:var(--bad);color:var(--bad)">⛔ dating risk<span class="n">${risky}</span></span>`:"")
    + (unknown?`<span class="chip" id="unkchip" aria-pressed="${UNK}">⚠️ no dating info<span class="n">${unknown}</span></span>`:"")
    + (LINES.filter(losesMoney).length
       ? `<span class="chip" id="losschip" aria-pressed="${LOSS}"
            style="border-color:var(--bad);background:${LOSS?"var(--bad)":"#fff5f5"};
            color:${LOSS?"#fff":"var(--bad)"}"
            title="gross profit on what sold, minus the cost of what was binned">
            ⛔ loses money<span class="n">${LINES.filter(losesMoney).length}</span></span>` : "")
