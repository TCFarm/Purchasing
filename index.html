<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Purchase review — TC Farm</title>
<style>
:root{color-scheme:light;
  --bg:#fcfcfb; --card:#fff; --line:#dedcd5; --ink:#0b0b0b; --ink2:#52514e; --ink3:#7d7b74;
  --accent:#2a78d6; --good:#008300; --warn:#eda100; --bad:#e34948; --chip:#f3f3f0;}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#1a1a19; --card:#232322; --line:#3a3a37; --ink:#fff; --ink2:#c3c2b7; --ink3:#8e8d84;
  --accent:#3987e5; --good:#3fa63f; --warn:#c98500; --bad:#e66767; --chip:#2f2f2d;}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--bg);
  border-bottom:1px solid var(--line);padding:12px 18px 10px}
h1{font-size:18px;margin:0;letter-spacing:-.01em}
.sub{color:var(--ink2);font-size:12.5px;margin-top:2px}
.totals{display:flex;flex-wrap:wrap;gap:14px;margin-top:9px;align-items:center}
.tot{display:flex;flex-direction:column;line-height:1.25}
.tot b{font-size:17px;font-variant-numeric:tabular-nums}
.tot span{font-size:11px;color:var(--ink3);text-transform:uppercase;letter-spacing:.03em}
.bar{flex:1;min-width:170px;height:7px;border-radius:4px;background:var(--chip);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;align-items:center}
.chip{border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:12.5px;
  cursor:pointer;background:var(--card);color:var(--ink2);user-select:none}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);font-weight:600;border-color:var(--ink)}
.chip .n{opacity:.65;margin-left:5px;font-variant-numeric:tabular-nums}
input[type=search],select{background:var(--card);color:var(--ink);border:1px solid var(--line);
  border-radius:7px;padding:5px 9px;font:inherit;font-size:12.5px}
main{padding:14px 18px 90px;max-width:1500px}
.line{display:grid;grid-template-columns:1fr auto;gap:10px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);padding:11px 13px;margin-bottom:8px}
.line.changed{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.line.removed{opacity:.5}
.line.removed .nm{text-decoration:line-through}
.nm{font-weight:600}
.meta{color:var(--ink2);font-size:12.5px;margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.tag{border:1px solid var(--line);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--ink2)}
.tag.src{border-color:var(--accent);color:var(--accent)}
.tag.bad{border-color:var(--bad);color:var(--bad);font-weight:600}
.tag.warn{border-color:var(--warn);color:var(--warn)}
.acts{display:flex;gap:6px;align-items:flex-start}
.acts input{width:74px;height:34px;text-align:center;font-variant-numeric:tabular-nums;
  border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);font:inherit}
.mini{height:34px;min-width:34px;border:1px solid var(--line);border-radius:7px;background:var(--card);
  color:var(--ink2);cursor:pointer;font:inherit;font-size:13px;padding:0 9px}
.mini.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.mini.rm.on{background:var(--bad);border-color:var(--bad);color:#fff}
.mini.ok.on{background:var(--good);border-color:var(--good);color:#fff}
/* ⭐ An UNREVIEWED line is the default state, so it must not shout — the cue is a
   quiet left rail plus the ○ pip, distinct from the accent rail that means
   "changed". ⛔ Never a fill: 282 tinted rows would read as 282 problems. */
.line.unreviewed{box-shadow:inset 3px 0 0 var(--line)}
details.why{margin-top:6px}
details.why summary{cursor:pointer;color:var(--ink3);font-size:12px}
details.why div{color:var(--ink2);font-size:12.5px;margin-top:5px;
  white-space:pre-wrap;word-break:break-word}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:9px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:30}
.primary{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 17px;
  font:inherit;font-weight:600;cursor:pointer}
.primary[disabled]{opacity:.45;cursor:default}
.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;
  padding:9px 15px;font:inherit;cursor:pointer}
.mut{color:var(--ink2)} .small{font-size:12px}
.center{text-align:center;padding:40px 12px;color:var(--ink2)}
.banner{background:var(--chip);border:1px solid var(--line);border-radius:9px;
  padding:9px 12px;margin-bottom:10px;font-size:12.5px;color:var(--ink2)}
.banner.bad{border-color:var(--bad);color:var(--bad)}
table.out{border-collapse:collapse;width:100%;font-size:12.5px;margin-top:8px}
table.out td,table.out th{padding:4px 10px 4px 0;text-align:left;white-space:nowrap}
table.out th{color:var(--ink3);font-weight:600;border-bottom:1px solid var(--line)}
</style>
<header>
  <h1>Purchase review</h1>
  <div class="sub" id="sub">signing in…</div>
  <div class="totals" id="totals"></div>
  <div class="filters">
    <input type="search" id="q" placeholder="Find an item, brand, SKU or UPC…" style="min-width:220px">
    <!-- ⭐ OUTSIDE the repainted #filters region, like the search box: paintFilters()
         rebuilds its own innerHTML on every render, which once destroyed a focused
         control mid-interaction. Wired once in _app.js. -->
    <label class="mut small" for="sort">Sort</label>
    <select id="sort" style="border:1px solid var(--line);border-radius:7px;padding:5px 8px;
            background:var(--card);color:var(--ink);font:inherit;font-size:12.5px">
      <option value="engine">the engine's order</option>
      <option value="cost">biggest spend first</option>
      <option value="risk">dating risk first</option>
      <option value="cover">most weeks of cover first</option>
      <option value="name">A–Z</option>
      <option value="source">by source</option>
    </select>
    <span id="progress" class="mut small"></span>
    <span id="subtot" class="mut small"></span>
  </div>
  <div class="filters" id="filters"></div>
</header>
<main id="main"><div class="center">Loading…</div></main>
<div class="foot">
  <span id="tally" class="mut small">—</span>
  <span class="mut small">⛔ nothing is saved until you press Save</span>
  <button class="ghost" id="reset">Reset changes</button>
  <button class="primary" id="save" disabled>Save decisions</button>
  <button class="ghost" id="final" disabled>Finalize order…</button>
  <span id="status" class="mut small"></span>
</div>

<script>
const CFG = {
  clientId: "4a5939ef-bb89-4629-8a95-007509bb11a5",   /* "TC Farm Receiving" */
  tenantId: "c0f23c54-f515-4e2e-8aef-d3afb1ae34d0",
  siteId: "tcfarm0.sharepoint.com,d5fe3f11-af72-4c8b-b877-80e69226ca49,753c3608-e66a-4ec6-9fdf-5fb646ffa4fa",
  /* ⭐ same Entra app + same site as the new-item review — one credential,
     one sign-in. This app reads PurchaseReview/ instead. */
  scopes:["https://graph.microsoft.com/Sites.ReadWrite.All","offline_access","openid","profile"]
};
const AUTH=`https://login.microsoftonline.com/${CFG.tenantId}/oauth2/v2.0`;
const GRAPH="https://graph.microsoft.com/v1.0";
const store=sessionStorage;
let token=null,tokenExp=0,refreshTok=null,account="";
/* ⭐ which order week we are deciding, and every week available to switch to */

/* ── auth: authorization code + PKCE (same shape as the receiving page) ── */
const rand=n=>{const a=new Uint8Array(n);crypto.getRandomValues(a);
  return Array.from(a,b=>("0"+b.toString(16)).slice(-2)).join("")};
const b64url=b=>btoa(String.fromCharCode(...new Uint8Array(b)))
  .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const sha256=async s=>crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));
async function beginLogin(){
  const v=rand(64),c=b64url(await sha256(v)),st=rand(16);
  store.setItem("pkce_v",v);store.setItem("pkce_s",st);
  location.assign(`${AUTH}/authorize?`+new URLSearchParams({
    client_id:CFG.clientId,response_type:"code",
    redirect_uri:location.origin+location.pathname,response_mode:"query",
    scope:CFG.scopes.join(" "),code_challenge:c,code_challenge_method:"S256",state:st}));
}
async function completeLogin(){
  const q=new URLSearchParams(location.search),code=q.get("code");
  if(q.get("error")) throw new Error(`${q.get("error")}: ${q.get("error_description")||""}`);
  if(!code) return false;
  if(q.get("state")!==store.getItem("pkce_s")) throw new Error("state mismatch — restart sign-in");
  const r=await fetch(`${AUTH}/token`,{method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},
    body:new URLSearchParams({client_id:CFG.clientId,grant_type:"authorization_code",code,
      redirect_uri:location.origin+location.pathname,code_verifier:store.getItem("pkce_v")})});
  const j=await r.json();
  if(!r.ok) throw new Error(j.error_description||j.error||"token exchange failed");
  setToken(j); history.replaceState({},"",location.pathname); return true;
}
function setToken(j){
  token=j.access_token; tokenExp=Date.now()+(j.expires_in||3600)*1000-60000;
  if(j.refresh_token) refreshTok=j.refresh_token;
  try{account=JSON.parse(atob(j.id_token.split(".")[1])).preferred_username||"";}catch(_){}
  store.setItem("tok",JSON.stringify({t:token,e:tokenExp,r:refreshTok,a:account}));
}
function loadToken(){try{const s=JSON.parse(store.getItem("tok")||"null");if(!s)return false;
  token=s.t;tokenExp=s.e;refreshTok=s.r;account=s.a||"";return Date.now()<tokenExp;}catch(_){return false}}
async function getToken(){
  if(token&&Date.now()<tokenExp) return token;
  if(refreshTok){
    const r=await fetch(`${AUTH}/token`,{method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:new URLSearchParams({client_id:CFG.clientId,grant_type:"refresh_token",
        refresh_token:refreshTok,scope:CFG.scopes.join(" ")})});
    const j=await r.json(); if(r.ok){setToken(j);return token;}
  }
  throw new Error("session expired — reload and sign in again");
}
async function graph(path,opts={}){
  const t=await getToken();
  const r=await fetch(GRAPH+path,{...opts,headers:{...(opts.headers||{}),
    Authorization:"Bearer "+t,"Content-Type":"application/json"}});
  const txt=await r.text(); let j=null; try{j=txt?JSON.parse(txt):null}catch(_){}
  if(!r.ok) throw new Error((j&&(j.error?.message||j.error_description))||`${r.status} on ${path}`);
  return j;
}

/* ── data ─────────────────────────────────────────────────────────────── */
const fmt=(v,d=2)=>v===null||v===undefined||v===""?"—":Number(v).toFixed(d);
/* ⭐ Flatten anything the payload holds into a Text-column-safe string.
   ⛔ Never assume a payload field is a string — several are lists or objects, and
   the failure mode is a 400 that loses the whole batch of decisions. */
function flat(v,max){
  max=max||255;
  if(v==null) return "";
  let out;
  if(Array.isArray(v)) out=v.map(x=>typeof x==="string"?x:JSON.stringify(x)).join(" · ");
  else if(typeof v==="object") out=JSON.stringify(v);
  else out=String(v);
  return out.slice(0,max);
}


/* ══ PURCHASE REVIEW ══ the Sunday order, as a reviewable surface.
   ⛔ The engine decides; this page lets a human CHANGE that decision and records
   what they changed and why. It never re-derives a quantity of its own — an
   operator changes the ORDER, never the programming (hard boundary 7). */
const LIST="PurchaseReview", DIR="PurchaseReview";
let ORDER=null, LINES=[], EDIT={}, SAVED={}, LISTID=null,
    FILTER="all", Q="", RISK=false, UNK=false, ONLYCH=false,
    SORT="engine", NEWONLY=false;

const money=n=>n==null?"—":"$"+Number(n).toLocaleString(undefined,
  {minimumFractionDigits:2,maximumFractionDigits:2});
const money0=n=>n==null?"—":"$"+Math.round(Number(n)).toLocaleString();

async function loadOrder(){
  const ls=await graph(`/sites/${CFG.siteId}/drive/root:/${DIR}:/children?$select=name,id`);
  const f=(ls.value||[]).filter(x=>/^order_.*\.json$/.test(x.name))
                        .sort((a,b)=>a.name<b.name?1:-1)[0];
  if(!f) throw new Error("no order has been published yet — run scripts/publish_order.py --publish");
  const t=await getToken();
  const r=await fetch(`${GRAPH}/sites/${CFG.siteId}/drive/items/${f.id}/content`,
                      {headers:{Authorization:"Bearer "+t}});
  if(!r.ok) throw new Error("order download failed "+r.status);
  return await r.json();
}
async function listId(){
  if(LISTID) return LISTID;
  const j=await graph(`/sites/${CFG.siteId}/lists?$select=displayName,id`);
  const l=(j.value||[]).find(x=>x.displayName===LIST);
  if(!l) throw new Error(`list ${LIST} not found`);
  return (LISTID=l.id);
}
async function loadSaved(sunday){
  const id=await listId(); let url=`/sites/${CFG.siteId}/lists/${id}/items?expand=fields&$top=500`, out={};
  while(url){
    const j=await graph(url);
    for(const it of j.value||[]){
      const f=it.fields||{};
      if(f.order_sunday===sunday) out[f.sku]={...f,_id:it.id};
    }
    const n=j["@odata.nextLink"]; url=n?n.replace(GRAPH,""):null;
  }
  return out;
}

/* ── the numbers a buyer is actually deciding on ─────────────────────────── */
/* ⛔⛔ THE CHAIN IS promo_cost -> supplier_price -> reg_whlsl, in that order, and it
   must match order_engine's `order_value` and write_kehe_xlsx. `reg_whlsl` is the
   KeHE CASE price on a bulk line: reading it second valued popcorn at $31.97 a
   unit instead of $1.07 and put the order total 29% above the engine's own
   figure. ⭐ The publisher now resolves it server-side into `unit_cost`; this
   falls back to the same chain so the page cannot drift from it. */
const unitCost=r=>Number(r.unit_cost ?? (r.promo_cost||r.supplier_price||r.reg_whlsl||0));
/* ⛔⛔ THE SCREEN MUST READ **EDIT → SAVED → ENGINE**, in that order.
   Reading only EDIT meant that pressing Save (which clears EDIT) snapped every
   line back to the engine's number and Finalize then exported the ENGINE's order
   — so following the page's own "save first, then finalize" instruction produced
   the wrong order. Found by a test agent, 2026-09-05. This is real money. */
function qtyOf(r){
  const e=EDIT[r.sku];
  if(e){ if(e.decision==="remove") return 0; if(e.qty!=null) return e.qty; }
  const s=SAVED[r.sku];
  if(s){ if(s.decision==="remove") return 0;
         if(s.approved_qty!=null&&s.approved_qty!=="") return Number(s.approved_qty); }
  return r.order_qty||0;
}
function stateOf(r){
  const e=EDIT[r.sku];
  if(e&&e.decision) return e.decision;
  if(e) return "keep";                       // an explicit edit un-removes
  const s=SAVED[r.sku];
  if(s&&s.decision==="remove") return "remove";
  return "keep";
}
/* ⭐ has a human touched this line at all — saved or pending? */
function touched(r){
  const e=EDIT[r.sku], s=SAVED[r.sku];
  /* ⛔ THE PRESENCE OF AN EDIT IS NOT A CHANGE (fixed 2026-09-05, found by
     driving the real page). This read `if(e) return true`, so the new "✓ mark
     reviewed" button — which writes `{ack:true}` and deliberately leaves the
     quantity alone — painted the line as CHANGED: accent rail, a "changed from
     24" tag, and a note box demanding to know why they changed it. The buyer had
     just agreed with the engine. ⭐ A change is a QUANTITY edit, a removal or a
     note — never the mere existence of a record.
     ⚠️ The earlier fix this must not undo (BUG 3): an edit whose snapped value
     equals the engine's still carries `qty`, so it stays "touched" and Save
     stays enabled — the case where a silent no-op looked like a lost edit. */
  if(e && (e.qty!=null || e.decision || e.note)) return true;
  return !!(s && (s.decision==="remove" || (s.approved_qty!=null &&
            Number(s.approved_qty)!==(r.order_qty||0))));
}
/* ⭐⭐ HAS THIS LINE BEEN LOOKED AT? — added 2026-09-05 (PM-527).
   ⛔ `touched()` answers "did the quantity move", which is NOT the same question.
   On a 282-line order the buyer's real problem is "where did I get to" — and a
   line they read and agreed with was indistinguishable from one they never
   opened. Both rendered identically, so the only way to resume was to start
   again.
   ⭐ NO NEW SHAREPOINT COLUMN. `decision` is already one of remove/changed/keep,
   so "I looked and I agree" is just a saved `keep` at the engine's quantity —
   which the save path already writes. ⛔ That matters: an array or an unknown
   field sent to this list is a bare HTTP 400 that loses the whole submit. */
function reviewState(r){
  if(stateOf(r)==="remove") return "removed";
  if(qtyOf(r)!==(r.order_qty||0)) return "changed";
  const e=EDIT[r.sku];
  if(e && e.ack===false) return "new";          // explicitly un-marked
  if((e && e.ack) || SAVED[r.sku]) return "ok"; // a saved row IS a decision
  return "new";
}
const reviewed=r=>reviewState(r)!=="new";

/* ⭐⭐ BUG 5 — COVER AND DATING RISK MUST FOLLOW THE QUANTITY ON SCREEN. Frozen at
   the engine's figure, the buyer could not tell whether they had fixed the very
   thing the red banner was shouting about. */
function coverOf(r){
  const rate=r.q75_wk||r.mean_wk||0;
  if(!rate) return null;
  return Math.round(qtyOf(r)/rate*10)/10;
}
/* ⛔⛔ COVER-VS-LIFE IS THE WRONG TEST FOR SOME LINE TYPES, and applying it
   anyway produces a confident false accusation. Corrected 2026-09-05 after Jack
   pushed back on a finding of mine: several "over its life" lines were nothing of
   the kind, because their demand basis is NOT the shelf sales rate.
     promo_probe   — a deliberate bounded buy; its own `why` carries the estimate
                     it was sized from (one probe read "6u = p90 of 8 observed
                     weeks 1.0/wk x 1.50 lift" while q75_wk was 0.0)
     min_presence  — we keep one on the shelf on purpose; velocity is not the point
     seasonal      — sized on the SEASONAL profile, never the annual mean
     recipe_kit    — kit demand is ADDITIVE and does not appear in the sales rate
   ⭐ These are reported as "different basis", never as risk. */
const NOT_VELOCITY=/promo_probe|min_presence|seasonal|recipe_kit/;
function riskOf(r){
  if(NOT_VELOCITY.test((r.flags||[]).join(" "))) return "basis";
  const sd=r.shelf_days, c=coverOf(r);
  if(!sd||c==null) return "unknown";          // ⛔ unknown is NOT "ok"
  if(qtyOf(r)<=0) return "ok";
  return c*7>sd ? "⛔ over its life" : c*7>sd*0.7 ? "⚠️ tight" : "ok";
}
function totals(){
  // ⛔ BUG 8 — a zero quantity IS a removal. Exporting a 0-qty line put a $0.00
  // unit cost into the CSV, which `kehe_order.py finalize` is documented to refuse.
  const live=LINES.filter(r=>stateOf(r)!=="remove" && qtyOf(r)>0);
  const units=live.reduce((n,r)=>n+qtyOf(r),0);
  const cost=live.reduce((n,r)=>n+qtyOf(r)*unitCost(r),0);
  const changed=LINES.filter(touched).length;
  const pending=Object.keys(EDIT).length;
  return {lines:live.length, units, cost, changed, pending,
          removed:LINES.length-live.length};
}

/* ⭐ THE TIER TARGET. Jack's standing correction: there is NO per-order floor —
   the goal is raising the AVERAGE order toward ~$9,000 for a better discount
   rung. ⛔ So this is shown as CONTEXT, never as a bar to clear. */
const TIER_TARGET=9000;
function paintTotals(){
  const t=totals();
  const pct=Math.min(100, t.cost/TIER_TARGET*100);
  document.getElementById("totals").innerHTML=
    `<div class="tot"><b>${t.lines}</b><span>lines</span></div>
     <div class="tot"><b>${t.units.toLocaleString()}</b><span>units</span></div>
     <div class="tot"><b>${money0(t.cost)}</b><span>at cost</span></div>
     ${t.changed?`<div class="tot"><b>${t.changed}</b><span>changed</span></div>`:""}
     ${t.removed?`<div class="tot"><b>${t.removed}</b><span>removed</span></div>`:""}
     <div class="bar" title="context only — there is no per-order minimum"><i style="width:${pct}%"></i></div>
     <span class="mut small">${money0(t.cost)} of the ~${money0(TIER_TARGET)} average
       we are working toward &mdash; context, not a floor</span>`;
  document.getElementById("tally").textContent=
    `${t.lines} lines · ${t.units.toLocaleString()} units · ${money0(t.cost)}`
    + (t.pending?` · ${t.pending} unsaved`:"");
  /* ⭐ "how much am I spending on promo this week" was unanswerable — the footer
     always showed the whole order however you filtered. */
  const st=document.getElementById("subtot");
  if(st){
    const v=visible().filter(r=>stateOf(r)!=="remove"&&qtyOf(r)>0);
    st.textContent = (FILTER==="all"&&!RISK&&!UNK&&!ONLYCH&&!NEWONLY&&!Q) ? "" :
      `this view: ${v.length} lines · ${v.reduce((n,r)=>n+qtyOf(r),0).toLocaleString()} units · `
      + money0(v.reduce((n,r)=>n+qtyOf(r)*unitCost(r),0));
  }
  /* ⭐ WHERE DID I GET TO — the question a 282-line order actually raises. */
  const pg=document.getElementById("progress");
  if(pg){
    const done=LINES.filter(reviewed).length;
    pg.textContent=`${done} of ${LINES.length} reviewed`;
    pg.style.color = done===LINES.length ? "var(--good)" : "";
  }
  const dirty=Object.keys(EDIT).length>0;
  document.getElementById("save").disabled=!dirty;
  document.getElementById("final").disabled=false;
}

/* ── filters ─────────────────────────────────────────────────────────────── */
function sources(){ const c={};
  for(const r of LINES) c[r.source]=(c[r.source]||0)+1; return c; }
function paintFilters(){
  const c=sources();
  const risky=LINES.filter(r=>{const x=riskOf(r);return x==="⛔ over its life"||x==="⚠️ tight";}).length;
  const unknown=LINES.filter(r=>riskOf(r)==="unknown").length;
  /* ⛔⛔ THE SEARCH INPUT IS NOT REBUILT HERE. paintFilters() runs on every
     render, render() runs on the search debounce — so rebuilding #q destroyed the
     focused input mid-word and sent the rest of the typing to the page body,
     where a space toggled a <details> open. The box lives OUTSIDE the repainted
     region and is wired once. Found by a test agent, 2026-09-05. */
  document.getElementById("filters").innerHTML=
    `<span class="chip" data-f="all" aria-pressed="${FILTER==="all"}">All<span class="n">${LINES.length}</span></span>`
    + Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([k,v])=>
      `<span class="chip" data-f="${escAttr(k)}" aria-pressed="${FILTER===k}">${esc(k)}<span class="n">${v}</span></span>`).join("")
    + (risky?`<span class="chip" id="riskchip" aria-pressed="${RISK}" style="border-color:var(--bad);color:var(--bad)">⛔ dating risk<span class="n">${risky}</span></span>`:"")
    + (unknown?`<span class="chip" id="unkchip" aria-pressed="${UNK}">⚠️ no dating info<span class="n">${unknown}</span></span>`:"")
    + `<span class="chip" id="chgchip" aria-pressed="${ONLYCH}">only what I changed<span class="n">${LINES.filter(touched).length}</span></span>`
    + `<span class="chip" id="newchip" aria-pressed="${NEWONLY}">not yet reviewed<span class="n">${LINES.filter(r=>!reviewed(r)).length}</span></span>`;
  document.querySelectorAll("#filters .chip[data-f]").forEach(x=>x.onclick=()=>{
    // ⛔ BUG 7 — "All" must clear the OTHER filters too. It used to leave the
    // risk filter on, so the chip read 118 while 7 lines rendered.
    FILTER=x.dataset.f;
    if(FILTER==="all"){ RISK=false; UNK=false; ONLYCH=false; NEWONLY=false; }
    render();});
  const rc=document.getElementById("riskchip");
  if(rc) rc.onclick=()=>{RISK=!RISK; render();};
  const uc=document.getElementById("unkchip");
  if(uc) uc.onclick=()=>{UNK=!UNK; render();};
  const cc=document.getElementById("chgchip");
  if(cc) cc.onclick=()=>{ONLYCH=!ONLYCH; render();};
  const nc=document.getElementById("newchip");
  if(nc) nc.onclick=()=>{NEWONLY=!NEWONLY; render();};
}
/* ⭐ wired ONCE, outside every repaint — same reason as the search box. */
(function wireSort(){
  const sel=document.getElementById("sort");
  if(!sel) return;
  sel.value=SORT;
  sel.onchange=()=>{SORT=sel.value; render();};
})();
/* ⭐ wired ONCE, outside every repaint */
(function wireSearch(){
  let t; const q=document.getElementById("q");
  if(!q) return;
  q.oninput=e=>{clearTimeout(t); t=setTimeout(()=>{Q=e.target.value.trim(); render();},170);};
})();
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const escAttr=esc;

function visible(){
  const q=Q.toLowerCase();
  return LINES.filter(r=>{
    if(FILTER!=="all" && r.source!==FILTER) return false;
    if(RISK){ const x=riskOf(r); if(x!=="⛔ over its life"&&x!=="⚠️ tight") return false; }
    if(UNK && riskOf(r)!=="unknown") return false;
    if(ONLYCH && !touched(r)) return false;
    if(NEWONLY && reviewed(r)) return false;
    if(q && !((r.description||"").toLowerCase().includes(q)
           || (r.brand||"").toLowerCase().includes(q)
           || (r.sku||"").toLowerCase().includes(q)
           || String(r.upc||"").includes(q))) return false;     // ⭐ UPC is searchable
    return true;
  }).sort(sorter());
}
/* ⛔ The DEFAULT is the engine's own order and must stay a stable no-op — the
   `why` on each line refers to the sizing pass that produced it, and a reader
   comparing two lines is comparing that sequence. Every other sort is explicit.
   ⚠️ Sorting is applied INSIDE visible(), so the subtotal, the counts and the
   rendered list can never disagree about which lines are on screen. */
function sorter(){
  const RANK={"⛔ over its life":0,"⚠️ tight":1,"unknown":2,"basis":3,"ok":4};
  switch(SORT){
    case "cost":   return (a,b)=>qtyOf(b)*unitCost(b)-qtyOf(a)*unitCost(a);
    case "risk":   return (a,b)=>(RANK[riskOf(a)]??9)-(RANK[riskOf(b)]??9)
                                 || qtyOf(b)*unitCost(b)-qtyOf(a)*unitCost(a);
    case "cover":  return (a,b)=>(coverOf(b)??-1)-(coverOf(a)??-1);
    case "name":   return (a,b)=>String(a.description||a.sku)
                                   .localeCompare(String(b.description||b.sku));
    case "source": return (a,b)=>String(a.source||"").localeCompare(String(b.source||""))
                                 || qtyOf(b)*unitCost(b)-qtyOf(a)*unitCost(a);
    default:       return ()=>0;              // ⭐ Array.prototype.sort is stable
  }
}

/* ── one line ────────────────────────────────────────────────────────────── */
function lineHtml(r){
  const st=stateOf(r), q=qtyOf(r), c=unitCost(r);
  const changed=touched(r), cw=coverOf(r), rk=riskOf(r);
  const inc=r.unit_of_sale||1;
  const note=(EDIT[r.sku]||{}).note ?? (SAVED[r.sku]||{}).reviewer_note ?? "";
  const rs=reviewState(r);
  return `<div class="line ${changed?"changed":""} ${st==="remove"?"removed":""}${
      rs==="new"?" unreviewed":""}" data-sku="${escAttr(r.sku)}">
    <div>
      <div class="nm">${rs==="new"?`<span title="you have not looked at this line yet"
        style="color:var(--ink3)">○</span> `:`<span title="reviewed"
        style="color:var(--good)">●</span> `}${esc(r.description||r.sku)}</div>
      <div class="meta">${esc(r.brand||"")} · ${esc(r.sku)}
        · ${money(c)}/unit → <b data-linecost>${money(q*c)}</b>
        · <span data-cover>${cw!=null?cw+"w cover":"cover unknown"}</span>
        ${r.shelf_days?` · ${r.shelf_days}d life`:" · life unknown"}</div>
      <div class="tags">
        <span class="tag src">${esc(r.source)}</span>
        <span class="tag ${rk==="⛔ over its life"?"bad":rk==="⚠️ tight"?"warn":""}"
              data-risk ${rk==="ok"||rk==="basis"?'style="display:none"':""}
              >${rk==="ok"||rk==="basis"?"":esc(rk)}</span>
        ${rk==="basis"?`<span class="tag" title="its quantity was sized on something
          other than the shelf sales rate, so cover-vs-life does not apply">sized on a
          different basis</span>`:""}
        ${inc>1?`<span class="tag">orders in ${inc}s</span>`:""}
        ${(r.flags||[]).slice(0,3).map(f=>`<span class="tag">${esc(f)}</span>`).join("")}
        ${changed&&st!=="remove"?`<span class="tag warn">changed from ${r.order_qty}</span>`:""}
        ${st==="remove"?`<span class="tag bad">removed</span>`:""}
        ${r.prior_edit?`<span class="tag warn">someone already changed this from the
          engine's ${r.engine_qty}</span>`:""}
      </div>
      ${r.why?`<details class="why"><summary>why the engine chose ${r.engine_qty??r.order_qty}</summary>
        <div>${esc(r.why)}</div></details>`:""}
      ${changed?`<input class="note" data-n="${escAttr(r.sku)}" value="${escAttr(note)}"
         placeholder="why did you change it? (this is the signal that improves the model)"
         style="margin-top:6px;width:100%;max-width:520px;border:1px solid var(--line);
                border-radius:7px;padding:5px 9px;background:var(--card);color:var(--ink);
                font:inherit;font-size:12.5px">`:""}
    </div>
    <div class="acts">
      <input type="number" min="0" step="${inc}" value="${q}" data-q="${escAttr(r.sku)}"
             aria-label="quantity" ${st==="remove"?"disabled":""}>
      <button class="mini ok ${rs!=="new"?"on":""}" data-ok="${escAttr(r.sku)}"
              title="${rs==="new"?"mark this line reviewed — the quantity stays as it is"
                                 :"un-mark it as reviewed"}">✓</button>
      <button class="mini rm ${st==="remove"?"on":""}" data-rm="${escAttr(r.sku)}"
              title="remove this line">✕</button>
    </div>
  </div>`;
}

function render(){
  paintFilters();
  const v=visible(), m=document.getElementById("main");
  let head="";
  /* ⛔⛔ BUG 10 — THE ENGINE'S OWN ALERTS WERE DROPPED. Two of them are decisions
     this page exists to capture: "the smallest purchase possible is months of
     stock — buy it or cut the item", and "1,328 units are on a prior order Finale
     cannot see — if it was never placed, these under-order". The second changes
     how you read every quantity on the page. */
  const al=(ORDER.meta.alerts||[]);
  if(al.length) head+=`<details class="banner" open><summary style="cursor:pointer">
    <b>${al.length} alert(s) from the order engine</b> — read these before deciding</summary>
    <ul style="margin:7px 0 0;padding-left:19px">${
      al.map(x=>`<li style="margin:4px 0">${esc(flat(x,400))}</li>`).join("")}</ul></details>`;
  const risky=LINES.filter(r=>riskOf(r)==="⛔ over its life").length;
  const unk=LINES.filter(r=>riskOf(r)==="unknown").length;
  if(risky) head+=`<div class="banner bad">⛔ <b>${risky} line(s) order more than their
    shelf life can clear.</b> That is the pattern that dated out milk — cut the quantity
    and this count drops as you go.</div>`;
  if(unk) head+=`<div class="banner">⚠️ <b>${unk} line(s) have no dating information at
    all</b> — no shelf life or no sales rate. ⛔ Unknown is not the same as safe.</div>`;
  const basis=LINES.filter(r=>riskOf(r)==="basis").length;
  if(basis) head+=`<div class="banner">${basis} line(s) were sized on something other than
    the shelf sales rate — a promo probe, a minimum-presence line, a seasonal buy or a
    recipe-kit top-off. ⛔ Cover-vs-life does not apply to those, so they carry no dating
    verdict here.</div>`;
  const nr=ORDER.meta.not_ordered_by_reason||{};
  head+=`<div class="banner">Showing <b>${v.length}</b> of ${LINES.length} lines the engine
    wants to buy, from ${ORDER.meta.lines_considered.toLocaleString()} considered.
    <span class="mut">Not ordered: ${Object.entries(nr).slice(0,4)
      .map(([k,n])=>`${esc(k)} ${n}`).join(" · ")}.</span></div>`;
  m.innerHTML=head+(v.length?v.map(lineHtml).join(""):`<div class="center">nothing matches</div>`);
  paintTotals();
}

/* ── edits ───────────────────────────────────────────────────────────────── */
/* ⛔⛔ BUG 2 — THE SNAP MUST BE VISIBLE. It used to change the stored value while
   leaving the box showing what was typed: type 18 on an "orders in 12s" line and
   the screen said 18 while 24 was saved. ⛔ BUG 3 — and when the snapped value
   equalled the engine's, the edit was DELETED, so the buyer saw their number,
   no "changed" tag, and a disabled Save: the change silently never happened.
   ⭐ Now: snap on COMMIT (blur/enter), write the snapped value back into the box,
   and always keep the edit so the intent is recorded. */
function applyQty(i, commit){
  const sku=i.dataset.q, r=LINES.find(x=>x.sku===sku); if(!r) return;
  const inc=r.unit_of_sale||1;
  let v=Number(i.value);
  if(!Number.isFinite(v)||v<0) v=0;
  if(commit){
    v=Math.round(v/inc)*inc;
    if(String(v)!==i.value) i.value=v;          // ⭐ show what will actually be ordered
  }
  EDIT[sku]={...(EDIT[sku]||{}), qty:v, decision:null};
  const el=i.closest(".line");
  if(el){
    el.classList.toggle("changed", touched(r));
    el.classList.toggle("removed", v<=0);
    /* ⛔ the review rail and pip are part of the row's state too — left out, an
       edited line kept its "you have not looked at this" rail for as long as the
       page went without a full render (found 2026-09-05 driving the page). */
    el.classList.toggle("unreviewed", reviewState(r)==="new");
    const pip=el.querySelector(".nm span");
    if(pip){ const nw=reviewState(r)==="new";
             pip.textContent=nw?"○":"●";
             pip.style.color=nw?"var(--ink3)":"var(--good)"; }
    const c=el.querySelector("[data-linecost]");
    if(c) c.textContent=money(v*unitCost(r));   // ⛔ BUG 4 — live extended cost
    const cv=el.querySelector("[data-cover]");
    if(cv){ const cw=coverOf(r), rk=riskOf(r);
      cv.textContent=cw!=null?`${cw}w cover`:"cover unknown";
      const t=el.querySelector("[data-risk]");
      if(t){ t.textContent=rk==="ok"?"":rk;
             t.className="tag "+(rk==="⛔ over its life"?"bad":rk==="⚠️ tight"?"warn":"");
             t.style.display=rk==="ok"?"none":""; } }
    // ⛔ BUG 9 — say something when a quantity is absurd. Nothing objected to a
    // two-million-dollar order before this.
    const big=v*unitCost(r)>2000;
    i.style.borderColor=big?"var(--bad)":"";
    i.title=big?`⛔ ${money(v*unitCost(r))} on one line — check this is intended`:"";
  }
  paintTotals();
  /* ⛔⛔ THE CHIP COUNTS ARE STATE, AND THIS PATH NEVER REFRESHED THEM.
     `applyQty` patches the row in place ON PURPOSE — a full render mid-keystroke
     would destroy the focused input — but it also skipped `paintFilters()`, so
     "only what I changed" sat at 0 while a line was visibly changed. Latent
     before 2026-09-05 and inherited by "not yet reviewed". The chips hold no
     focusable input, so repainting them here is safe at any time. */
  paintFilters();
  /* ⭐ ON COMMIT ONLY, do a full render. The note box — *"why did you change it?
     (this is the signal that improves the model)"* — is emitted by `lineHtml`,
     so before this it never appeared for the line you had just edited: you had
     to filter or save to make it show up, and by then the reason was gone.
     ⛔ Safe here and nowhere else: `commit` is blur/Enter, so focus has already
     left the box (Enter's handler blurs it immediately after). */
  if(commit) render();
}
document.addEventListener("input",e=>{
  const i=e.target.closest("input[data-q]"); if(i) applyQty(i,false);},true);
document.addEventListener("change",e=>{
  const i=e.target.closest("input[data-q]"); if(i) applyQty(i,true);},true);
document.addEventListener("input",e=>{
  const n=e.target.closest("input[data-n]"); if(!n) return;
  const sku=n.dataset.n;
  EDIT[sku]={...(EDIT[sku]||{}), note:n.value};
  paintTotals();
},true);
document.addEventListener("keydown",e=>{
  const i=e.target.closest("input[data-q]");
  if(i&&e.key==="Enter"){ applyQty(i,true); i.blur(); }},true);
/* ⛔ CAPTURE PHASE, like every other delegated handler on this page: an ancestor
   calls stopPropagation, which killed the row-level buttons silently for a day
   (PM-512). ⭐ A bubble-phase listener here would never fire and would look like
   a button that does nothing. */
document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-ok]"); if(!b) return;
  const sku=b.dataset.ok, r=LINES.find(x=>x.sku===sku); if(!r) return;
  const was=reviewState(r)!=="new";
  const cur=EDIT[sku]||{};
  EDIT[sku]={...cur, ack:!was};
  /* ⛔ Un-marking a line that was never anything BUT an ack must leave no edit
     behind, or Save stays enabled with nothing to save. */
  if(EDIT[sku].ack===false && EDIT[sku].qty==null && !EDIT[sku].decision
     && !EDIT[sku].note && !SAVED[sku]) delete EDIT[sku];
  render();
},true);
document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-rm]"); if(!b) return;
  const sku=b.dataset.rm;
  const cur=EDIT[sku]||{};
  EDIT[sku]={...cur, decision: cur.decision==="remove"?null:"remove"};
  if(!EDIT[sku].decision && EDIT[sku].qty==null) delete EDIT[sku];
  render();
},true);
document.getElementById("reset").onclick=()=>{
  const n=Object.keys(EDIT).length, saved=LINES.filter(r=>SAVED[r.sku]).length;
  /* ⛔ Reset clears UNSAVED work only. It used to leave the screen and the store
     disagreeing with no indication that saved changes were still in force. */
  if(n && !confirm(`Discard ${n} unsaved change(s)?`+
      (saved?`\n\n⛔ ${saved} change(s) already SAVED stay in force — use the ✕/quantity `+
             `to alter those, or they will be in the order.`:""))) return;
  EDIT={}; render();
  document.getElementById("status").textContent=
    saved?`unsaved changes discarded · ${saved} saved change(s) still apply`:"";
};

/* ── save ────────────────────────────────────────────────────────────────── */
document.getElementById("save").onclick=async()=>{
  const btn=document.getElementById("save"), s=document.getElementById("status");
  btn.disabled=true; s.textContent="saving…";
  const id=await listId(); let ok=0, fail=0;
  const stamp=`${ORDER.meta.order_sunday} · built ${ORDER.meta.built_at||""}`;
  for(const [sku,e] of Object.entries(EDIT)){
    const r=LINES.find(x=>x.sku===sku); if(!r) continue;
    const q=e.decision==="remove"?0:(e.qty!=null?e.qty:(r.order_qty||0));
    /* ⭐ RECORD THE ENGINE'S NUMBER AND THE HUMAN'S SIDE BY SIDE. Storing only the
       final quantity loses the fact that a human overrode the model — which is
       the single most useful signal for improving it (order_feedback exists for
       exactly this reason). ⛔ Feedback is EVIDENCE, never an instruction. */
    const f={Title:`${ORDER.meta.order_sunday}:${sku}`,
      order_sunday:ORDER.meta.order_sunday, sku, upc:r.upc||"",
      item:(r.description||"").slice(0,255), brand:r.brand||"", source:r.source||"",
      engine_qty:r.order_qty??null, approved_qty:q,
      decision:e.decision==="remove"?"remove":(q!==(r.order_qty||0)?"changed":"keep"),
      unit_cost:unitCost(r)||null, line_cost:Number((q*unitCost(r)).toFixed(2)),
      /* ⛔ the cover and risk RECORDED must describe the quantity actually
         approved. Storing the engine's cover_weeks against a halved quantity made
         the audit trail say the opposite of what the reviewer did. */
      cover_weeks:coverOf(r), shelf_days:r.shelf_days??null,
      dating_risk:riskOf(r), why:flat(r.why), flags:flat(r.flags),
      /* ⛔ THE Z IS LOAD-BEARING. toISOString() is UTC; slicing to 19 chars dropped
         the marker, so the same instant read as UTC here and as LOCAL in
         SharePoint and Excel — a silent 5-6 hour shift on every decision
         timestamp, in the audit trail we would use to reconstruct who decided
         what and when. */
      reviewer:account, decided_at:new Date().toISOString().slice(0,19)+"Z",
      reviewer_note:(e.note||"").slice(0,255), build_stamp:stamp.slice(0,255)};
    try{
      const ex=(SAVED[sku]||{})._id;
      if(ex){ await graph(`/sites/${CFG.siteId}/lists/${id}/items/${ex}/fields`,
                          {method:"PATCH",body:JSON.stringify(f)});
              SAVED[sku]={...SAVED[sku],...f}; }
      else{ const j=await graph(`/sites/${CFG.siteId}/lists/${id}/items`,
              {method:"POST",body:JSON.stringify({fields:{...f,finalized:"false"}})});
            SAVED[sku]={...f,_id:j.id}; }
      ok++;
    }catch(err){ fail++; console.error(sku,err); }
  }
  s.textContent = fail?`⛔ ${ok} saved, ${fail} FAILED — see the console`
                      :`✓ ${ok} change(s) saved · ${new Date().toLocaleTimeString()}`;
  btn.disabled=false;
  /* ⛔⛔ EDIT is cleared ONLY because SAVED now carries the same state and
     qtyOf()/stateOf() read it. Clearing it while the screen read only EDIT is
     what made Save revert everything and Finalize export the engine's order. */
  if(!fail) EDIT={};
  render();
};

/* ── finalize ────────────────────────────────────────────────────────────── */
/* ⛔⛔ THIS PAGE DOES NOT SEND AN ORDER. It writes the approved quantities where
   `kehe_order.py finalize` reads them, and a human runs that step. Ordering is
   real money leaving the building; the Sunday output is a review artifact a
   person approves, never an auto-submitted order (hard boundary 4). */
document.getElementById("final").onclick=async()=>{
  const t=totals();
  /* ⛔ It used to print "save first" as prose and then build the artifact from
     whatever was on screen. Following the instruction was worse than ignoring it. */
  if(t.pending && !confirm(`⛔ ${t.pending} change(s) are NOT saved.\n\n`+
      `Finalize describes what is on screen, but purchase_drain.py reads the SAVED `+
      `decisions — so unsaved work will NOT reach the order.\n\nContinue anyway?`))
    return;
  const live=LINES.filter(r=>stateOf(r)!=="remove"&&qtyOf(r)>0)
    .map(r=>({sku:r.sku, upc:r.upc, item:r.description, qty:qtyOf(r),
              unit:unitCost(r),          // ⛔ the real unit cost, not cost/qty
              cost:Number((qtyOf(r)*unitCost(r)).toFixed(2)),
              engine:r.engine_qty??r.order_qty, source:r.source}));
  const changed=live.filter(x=>x.qty!==x.engine);
  const removed=LINES.filter(r=>stateOf(r)==="remove").map(r=>r.sku);
  const csv=["sku,upc,description,approved_qty,engine_qty,unit_cost,line_cost,source"]
    .concat(live.map(x=>[x.sku,x.upc,`"${String(x.item||"").replace(/"/g,'""')}"`,
      x.qty,x.engine,x.unit.toFixed(2),x.cost.toFixed(2),
      `"${x.source}"`].join(","))).join("\n");
  const m=document.getElementById("main");
  m.innerHTML=`<div class="banner"><b>Ready to execute.</b> Nothing has been sent —
      this is the review artifact a human approves.</div>
    <table class="out">
      <tr><th>lines</th><td>${t.lines}</td></tr>
      <tr><th>units</th><td>${t.units.toLocaleString()}</td></tr>
      <tr><th>cost</th><td>${money(t.cost)}</td></tr>
      <tr><th>changed from the engine</th><td>${changed.length}</td></tr>
      <tr><th>removed</th><td>${removed.length}</td></tr>
    </table>
    <p class="mut small" style="margin-top:14px">Save first, then run this to produce the
      KeHE upload — it honours the approved quantities and a human's edit always wins:</p>
    <div class="banner"><code>python3 kehe_order.py finalize --sunday ${esc(ORDER.meta.order_sunday)}</code></div>
    <p class="mut small">Or take the approved lines as CSV:
      <button class="ghost" id="csvcopy" style="margin-left:8px">Copy</button>
      <button class="ghost" id="csvdl">Download</button>
      <span id="csvmsg" class="mut small"></span></p>
    <textarea id="csvbox" readonly style="width:100%;height:190px;font:12px ui-monospace,Menlo,monospace;
      border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);
      padding:9px">${esc(csv)}</textarea>
    <p style="margin-top:12px"><button class="ghost" onclick="render()">← back to the lines</button></p>`;
  /* ⛔ Selecting 280 lines out of a textarea by hand is not a way to get data out
     of a page, and it was the ONLY way (PM-527). Wired AFTER innerHTML, because
     these nodes do not exist until the panel is painted. */
  const msg=document.getElementById("csvmsg");
  const say=t=>{ if(msg){ msg.textContent=t; setTimeout(()=>{msg.textContent="";},2500); } };
  const cc=document.getElementById("csvcopy");
  if(cc) cc.onclick=async()=>{
    try{ await navigator.clipboard.writeText(csv); say("✓ copied"); }
    catch(err){
      /* ⛔ clipboard access is refused outside a secure context or without the
         permission — falling back silently would look like a dead button. */
      const b=document.getElementById("csvbox");
      if(b){ b.focus(); b.select(); say("⛔ could not copy — selected it for you, press ⌘C"); }
      else say("⛔ could not copy");
    }};
  const dl=document.getElementById("csvdl");
  if(dl) dl.onclick=()=>{
    const name=`approved_order_${ORDER.meta.order_sunday}.csv`;
    const url=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));
    const a=document.createElement("a");
    a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
    say("✓ "+name);
  };
};

/* ── boot ────────────────────────────────────────────────────────────────── */
async function boot(){
  const sub=document.getElementById("sub");
  try{
    if(!loadToken()){ if(!await completeLogin()){ await beginLogin(); return; } }
    sub.textContent="loading the order…";
    ORDER=await loadOrder();
    LINES=ORDER.rows||[];
    SAVED=await loadSaved(ORDER.meta.order_sunday);
    /* ⭐ a saved change is the state of the world — reapply it so a reload does
       not silently discard work someone already did. */
    for(const [sku,f] of Object.entries(SAVED)){
      const r=LINES.find(x=>x.sku===sku); if(!r) continue;
      if(f.decision==="remove") EDIT[sku]={decision:"remove"};
      else if(f.approved_qty!=null && Number(f.approved_qty)!==(r.order_qty||0))
        EDIT[sku]={qty:Number(f.approved_qty)};
    }
    const m=ORDER.meta;
    sub.textContent=`order ${m.order_sunday} · ${m.lines_buying} lines to buy of `
      +`${m.lines_considered.toLocaleString()} considered · built ${(m.built_at||"").slice(0,16)}`
      +` · signed in as ${account}`;
    render();
    if(Object.keys(EDIT).length)
      document.getElementById("status").textContent=
        `restored ${Object.keys(EDIT).length} saved change(s)`;
  }catch(e){
    document.getElementById("main").innerHTML=
      `<div class="center">⛔ ${esc(e.message)}<br><br>
       <button class="ghost" onclick="sessionStorage.clear();location.href=location.pathname">sign in again</button></div>`;
    sub.textContent="not signed in";
  }
}
boot();

</script>
